id: physical
description: >-
  Appendix universe, kept under its historical id so its results stay current: baseline with DLR on the model half-light ellipse (the sbw_host package default, the ellipse SBW itself evaluates) instead of the moment ellipse. Its decisions are exactly those of the pre-30-Oct physical universe (physical cut + half-light DLR)
decisions:
  sbw_profile: exponential
  band: r
  search_radius: r30
  dlr_max: d4
  dlr_radius: half_light
  extendedness_cut: ext05
  sbw_hostless_cut: flb01
  exclude_suspect: keep
  candidate_quality: none
  p_true_threshold: p005
  truth_match: matches_truth
  dp02_sample_cuts: physical
  dp2_sample: rc_salt
  dp2_candidate_catalogue: dp2_object
  reference_match: pos_1arcsec
