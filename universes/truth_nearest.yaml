id: truth_nearest
description: >-
  Baseline with the true host taken as the nearest primary DP0.2 object within 1 arcsec of the host truth position instead of Rubin's MatchesTruth
decisions:
  sbw_profile: exponential
  band: r
  search_radius: r30
  dlr_max: d4
  dlr_radius: moments
  extendedness_cut: ext05
  sbw_hostless_cut: flb01
  exclude_suspect: keep
  candidate_quality: none
  p_true_threshold: p005
  truth_match: nearest_1arcsec
  transient_peak_mag: r24
  dp02_sample_cuts: physical
  dp2_sample: rc_salt
  dp2_candidate_catalogue: dp2_object
  reference_match: pos_1arcsec
