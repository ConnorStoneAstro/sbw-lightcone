id: truth_nearest
description: Baseline with the true host taken as the nearest primary DP0.2 object
  within 1 arcsec of the host truth position instead of Rubin's MatchesTruth
decisions:
  sbw_profile: exponential
  band: r
  search_radius: r30
  dlr_max: d4
  dlr_radius: half_light
  extendedness_cut: ext05
  sbw_hostless_cut: flb01
  exclude_suspect: keep
  truth_match: nearest_1arcsec
  dp02_sample_cuts: clean
  dp2_sample: rc_salt
  reference_match: pos_1arcsec
  delight_catalogue: legacy_dr10
