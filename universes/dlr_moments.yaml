id: dlr_moments
description: >-
  Appendix universe, kept under its historical id so its results stay current: baseline with the simulated-tier sample cut at 3 arcsec from the host truth position (clean3, the first results' cut) instead of the physical cut. Its decisions are exactly those of the pre-30-Oct dlr_moments universe
decisions:
  sbw_profile: exponential
  band: r
  search_radius: r30
  dlr_max: d4
  dlr_radius: moments
  extendedness_cut: ext05
  sbw_hostless_cut: flb01
  exclude_suspect: keep
  candidate_quality: none
  p_true_threshold: p005
  truth_match: matches_truth
  dp02_sample_cuts: clean3
  dp2_sample: rc_salt
  dp2_candidate_catalogue: dp2_object
  reference_match: pos_1arcsec
