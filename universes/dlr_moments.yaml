id: dlr_moments
description: Baseline (clean3 sample) with the DLR ellipse from the PSF-subtracted
  HSM second moments (rms semi-axes), the literature-faithful DLR; materialized for
  DP0.2 and OU2024
decisions:
  sbw_profile: exponential
  band: r
  search_radius: r30
  dlr_max: d4
  dlr_radius: moments
  extendedness_cut: ext05
  sbw_hostless_cut: flb01
  exclude_suspect: keep
  candidate_quality: none
  p_true_threshold: p005
  truth_match: matches_truth
  dp02_sample_cuts: clean3   # as baseline
  dp2_sample: rc_salt
  reference_match: pos_1arcsec
  delight_catalogue: legacy_dr10
