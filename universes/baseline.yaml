id: baseline
description: 'Package defaults: exponential fit, r band, 30 arcsec, d_DLR<=4 on the
  half-light ellipse, extendedness cut, suspect fits kept, DP0.2 MatchesTruth, cleaned
  DP0.2 sample, 1 arcsec reference match, Legacy DR10 for DELIGHT, RC SALT3 sample
  for DP2'
decisions:
  sbw_profile: exponential
  band: r
  search_radius: r30
  dlr_max: d4
  dlr_radius: half_light
  extendedness_cut: ext05
  exclude_suspect: keep
  truth_match: matches_truth
  dp02_sample_cuts: clean
  dp2_sample: rc_salt
  reference_match: pos_1arcsec
  delight_catalogue: legacy_dr10
