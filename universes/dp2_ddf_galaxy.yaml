id: dp2_ddf_galaxy
description: >-
  dp2_ddf on parsnip_ddf_galaxy, parsnip_ddf_clean without any Legacy DR10 point source within 1 arcsec (2055); materialized for the DP2 chain, the DELIGHT comparison and the hostless ROC only
decisions:
  sbw_profile: exponential
  band: r
  search_radius: r30
  dlr_max: d4
  dlr_radius: moments
  extendedness_cut: ext05
  sbw_hostless_cut: flb01
  exclude_suspect: keep
  candidate_quality: none
  p_true_threshold: p005
  truth_match: matches_truth
  dp02_sample_cuts: physical
  dp2_sample: parsnip_ddf_galaxy
  dp2_candidate_catalogue: dp2_object
  reference_match: pos_1arcsec
