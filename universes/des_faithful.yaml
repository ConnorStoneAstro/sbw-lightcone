id: des_faithful
description: >-
  Baseline with the DES-SN 15 arcsec search radius, so the DLR column reproduces the published DES-SN5YR hosts as closely as DES DR2 allows (the moment ellipse is now the baseline DLR, so only the radius differs); materialized for the DES outputs only
decisions:
  sbw_profile: exponential
  band: r
  search_radius: r15
  dlr_max: d4
  dlr_radius: moments
  extendedness_cut: ext05
  sbw_hostless_cut: flb01
  exclude_suspect: keep
  candidate_quality: none
  p_true_threshold: p005
  truth_match: matches_truth
  dp02_sample_cuts: physical
  dp2_sample: rc_salt
  dp2_candidate_catalogue: dp2_object
  reference_match: pos_1arcsec
