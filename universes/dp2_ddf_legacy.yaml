id: dp2_ddf_legacy
description: >-
  dp2_ddf with Legacy Surveys DR10 Tractor sources from pre-transient imaging as the candidate catalogue (dp2_candidate_catalogue legacy_dr10). Tractor models carry no second moments, so DLR runs on the half-light ellipse here; materialized for the DP2 chain, the DELIGHT comparison and the hostless ROC only
decisions:
  sbw_profile: exponential
  band: r
  search_radius: r30
  dlr_max: d4
  dlr_radius: half_light
  extendedness_cut: ext05
  sbw_hostless_cut: flb01
  exclude_suspect: keep
  candidate_quality: none
  p_true_threshold: p005
  truth_match: matches_truth
  transient_peak_mag: r24
  dp02_sample_cuts: physical
  dp2_sample: parsnip_ddf
  dp2_candidate_catalogue: legacy_dr10
  reference_match: pos_1arcsec
