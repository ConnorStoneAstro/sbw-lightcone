id: ext_none
description: 'Baseline without the extendedness cut (all primary objects are candidates).
  Added for OU2024, where ext05 removes the true host for 18% of transients (faint compact
  hosts with refExtendedness < 0.5); materialized for the OU2024 outputs only'
decisions:
  sbw_profile: exponential
  band: r
  search_radius: r30
  dlr_max: d4
  dlr_radius: half_light
  extendedness_cut: none
  sbw_hostless_cut: flb01
  candidate_quality: none
  p_true_threshold: p005
  exclude_suspect: keep
  truth_match: matches_truth
  dp02_sample_cuts: clean3   # 3 arcsec kept so results stay comparable with the first DP0.2 run; the spec default is physical
  dp2_sample: rc_salt
  dp2_candidate_catalogue: dp2_object
  reference_match: pos_1arcsec
  delight_catalogue: legacy_dr10
