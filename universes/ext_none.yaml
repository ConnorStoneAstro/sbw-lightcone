id: ext_none
description: >-
  Baseline without the extendedness cut (all primary objects are candidates). Added for OU2024, where ext05 removes the true host for 18% of transients (faint compact hosts with refExtendedness < 0.5); materialized for the OU2024 outputs only
decisions:
  sbw_profile: exponential
  band: r
  search_radius: r30
  dlr_max: d4
  dlr_radius: moments
  extendedness_cut: none
  sbw_hostless_cut: flb01
  exclude_suspect: keep
  candidate_quality: none
  p_true_threshold: p005
  truth_match: matches_truth
  transient_peak_mag: r24
  dp02_sample_cuts: physical
  reference_match: pos_1arcsec
