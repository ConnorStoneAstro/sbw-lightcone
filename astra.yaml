    inputs: [des_sample, des_candidates, dp02_lib_script]
    decisions: [search_radius, dlr_max, dlr_radius, extendedness_cut, candidate_quality]
    recipe:
      command: python src/des_run.py sweep table --sample {inputs.des_sample} --candidates {inputs.des_candidates} --search-radius {decisions.search_radius} --dlr-max {decisions.dlr_max} --dlr-radius {decisions.dlr_radius} --extendedness {decisions.extendedness_cut} --candidate-quality {decisions.candidate_quality} --workers 8 --output {output}
      resources: {cpus: 8, memory: 8Gi}
  - id: des_calibration
    type: figure
