# ASTRA Analysis Specification

version: "0.0.15"
name: "SBW host association performance"
description: >-
  Tests the surface-brightness-weighted (SBW) host-association method for
  transients, as implemented in the sbw_host package, on four tiers of data:
  DP0.2 (DC2) and OpenUniverse2024 (OU2024, the same Rubin data products from
  the later w_2024_22 stack on a different simulated sky) with true hosts,
  the DES-SN5YR published hosts, and Rubin DP2 real data without any
  reference, where SBW is also compared with the DELIGHT predictions of
  Y. J. Kang on the deep-drilling-field transients (the DELIGHT training set
  itself is not public, so there is no DELIGHT-labelled tier).
  SBW is taken as the framework; the questions are which form of SBW (fitted
  exponential, free-n Sersic, or deblended image stamps) recovers hosts best,
  and how SBW relates to the directional-light-radius (DLR) standard
  (disagreement rate, band dependence, agreement versus d_DLR) rather than
  which one wins. Each tier produces an association table, a recovery or
  disagreement metric and regime-binned figures; the DP0.2 tier adds SBW
  calibration (reliability) curves and the SBW/DLR agreement-versus-truth
  matrix, and OU2024 repeats the DP0.2 chain, adds results in host-magnitude
  bins (its hosts are drawn ~1 dex too light) and checks whether its
  transients sit on the rendered host or its mirror image as in DC2; a
  cross-tier summary table collects them. Everything for DP0.2 and OU2024 runs
  on NERSC from the parquet copies of the truth and Object tables.

inputs:
  # ---- Tier 1: simulation with true hosts (DP0.2 / DC2) ----
  - id: dp02_sn_truth
    type: data
    source: "/global/cfs/cdirs/lsst/shared/DC2-prod/Run2.2i/truth/truth_merged_summary_v1-0-0/match_dr6_v2"
    description: >-
      DESC DC2 merged truth summary, one parquet per tract (166 tracts): every
      truth row (truth_type 1 galaxy, 2 star, 3 SN) with id, host_galaxy, ra,
      dec, redshift, fluxes and mag_r. SN rows (445k over the DC2 footprint)
      give the transient positions and the true host id; the host's own row
      gives its position, magnitude and redshift. The match_objectId column in
      these files refers to the DESC DR6 processing, not DP0.2, and is not used.
  - id: dp02_truth_match
    type: data
    source: "/global/cfs/cdirs/lsst/shared/rubin/DP0.2/match_ref_truth_summary_objectTable"
    description: >-
      Rubin's DP0.2 truth-to-object match (the TAP MatchesTruth table), one
      parquet per tract: truth id string to DP0.2 objectId with match_candidate,
      match_count and match_chisq. This is how a true host galaxy becomes a
      DP0.2 objectId under truth_match: matches_truth.
  - id: dp02_sn_peak
    type: data
    source: "/global/cfs/cdirs/lsst/shared/DC2-prod/Run2.2i/truth/sntruth/truth_sn_summary_v1-0-0.parquet"
    description: >-
      DESC DC2 SN truth summary, one row per simulated SN Ia (405,293; every
      SN row of dp02_sn_truth has one): SALT2 parameters (t0, x0, x1, c, mB)
      and max_flux_<band>, the SN's largest flux in each band over the full
      ten-year light curve (nJy). 31.4 - 2.5 log10(max_flux_r) is the true
      peak r magnitude used by transient_peak_mag; t0 is the peak epoch.
  - id: dp02_lib_script
    type: data
    source: src/dp02_lib.py
    description: >-
      The analysis library, declared as an input of the outputs whose numbers
      follow its definitions (success = P_SBW(true) >= p_true_threshold,
      agreement = P_SBW(DLR host) >= p_true_threshold, the placement
      accounting), so an edit there remakes them (4 Nov 2026).
  - id: cross_method_matrix_script
    type: data
    source: src/cross_method_matrix.py
    description: >-
      The script that draws Fig 9, declared as an input of dp2_cross_method_matrix
      so a layout edit remakes it (4 Nov 2026).
  - id: dp02_gallery_script
    type: data
    source: src/dp02_gallery.py
    description: >-
      The cutout-gallery renderer (also imported by src/des_gallery.py),
      declared as an input of the four galleries so a drawing change remakes
      them; it draws the other members of SBW's credible set faded (5 Nov 2026).
  - id: dp02_miss_script
    type: data
    source: src/dp02_miss.py
    description: >-
      The script that draws Fig 1, declared as an input of the two placement
      figures (3 Nov 2026) so that a layout edit makes them stale; the
      compute outputs do not list it, their identity is the recipe and its
      decisions.
  - id: dp02_visits
    type: data
    source: "/global/cfs/cdirs/lsst/shared/rubin/DP0.2/visitTable/visitTable_LSSTCam-imSim_2_2i_runs_DP0_2_v23_0_2_PREOPS-905_step7_20220501T161443Z.parq"
    description: >-
      DP0.2 Visit table (19,840 visits, expMidptMJD 59582 to 61406: the five
      DC2 years that were imaged, while the SN truth spans ten). A DC2 SN
      counts as detectable only when its peak epoch falls in this window.
  - id: dp02_object
    type: data
    source: "data/dp02_objectTable_index.csv"
    description: >-
      DP0.2 Object table at NERSC, /global/cfs/cdirs/lsst/shared/rubin/DP0.2/objectTable,
      one parquet per tract (157 tracts, 1 TB), the same rows ingested into
      Qserv. The declared source is an index of those files (path, size,
      mtime, written by src/dp02_index_objects.py) because lc hashes declared
      inputs by content on every command and 1 TB takes 15 minutes; DP0.2 is
      a frozen 2022 release, so the index stands in for the bytes. Per band: CModel bulge (de Vaucouleurs) and
      disk (exponential) determinant radii bdReB/bdReD in pixels, component
      fluxes bdFluxB/bdFluxD, cModelFlux, HSM source and PSF moments
      ixx/iyy/ixy(PSF), kronRad, extendedness. The v23 bdE1 column is unusable
      (the E1 functor lacked parentheses: xx - yy/(xx+yy)), so orientation and
      axis ratio come from the PSF-subtracted HSM moments instead.
  - id: cosmodc2_hosts
    type: data
    source: "data/cosmodc2_v1.1.4_image_index.csv"
    description: >-
      cosmoDC2 v1.1.4 image catalogue at NERSC,
      /global/cfs/cdirs/lsst/shared/xgal/cosmoDC2/cosmoDC2_v1.1.4_parquet_r2
      (the target of the cosmoDC2_v1.1.4_parquet symlink GCRCatalogs reads),
      131 healpix parquet files, 2.9 TB, 308 columns. Declared through an index
      (path, size, mtime) like dp02_object, since hashing 2.9 TB per lc command
      is not an option and cosmoDC2 is frozen. galaxy_id equals the DC2 merged
      truth galaxy id and SN host_galaxy. Used for the true bulge and disk
      half-light semi-axes (size_bulge_true, size_minor_bulge_true,
      size_disk_true, size_minor_disk_true, arcsec), position_angle_true,
      bulge_to_total_ratio_i, ellipticities, stellar masses and true magnitudes.
  - id: rsp_token
    type: data
    source: "/global/cfs/cdirs/m1727/cstone/.rsp_image_tap_token"
    description: >-
      Rubin Science Platform access token (read:tap and read:image scopes) on
      NERSC (mode 600), used by the cutout gallery and the PA-mirror figure to
      query dp02_dc2_catalogs.ObsCore and the SODA cutout service at
      data.lsst.cloud from Perlmutter compute nodes. Outside the repository and
      never committed; recorded by content like the other NERSC inputs, so only
      its hash enters the run records.
  - id: dp02_deblended_stamps
    type: data
    source: "RSP butler dp02 deepCoadd_deblendedModel / cutout service (not on NERSC)"
    description: >-
      Deblender model stamps for candidate hosts, used by the image-level
      (stamp) form of SBW. No DP0.2 images exist on NERSC, so this needs the
      RSP cutout service and is parked until a subsample is chosen.
  # ---- Tier 1b: simulation with true hosts (OpenUniverse2024, LSST WFD) ----
  - id: ou24_object
    type: data
    source: "data/ou24_objectTable_index.csv"
    description: >-
      OpenUniverse2024 LSST WFD Object table processed with the LSST Science
      Pipelines w_2024_22, in the roman-desc-sims butler repo at NERSC,
      /global/cfs/cdirs/lsst/production/gen3/roman-desc-sims/repo/u/descdm/step3b_wfd_NNN_w_2024_22/<timestamp>/objectTable_tract/<tract>/*.parq
      (NNN = 000..066): 67 files in 22 tracts (RA 5.8-13.2, Dec -46.7 to
      -41.4, about 27 deg2), 18.27M rows, 6.70M primary, 74.9 GB. The runs of
      one tract hold disjoint patches, so every file is needed (detect_isPrimary
      makes objects unique). The declared source is an index (run, tract, path,
      size, mtime, rows, primary rows, patches, RA/Dec box) written by
      src/ou24_index_objects.py --rule union, as dp02_object does for DP0.2.
      Every DP0.2 column used here exists with the same name; the v23 bdE1
      functor bug persists in w_2024_22 (r_bdE1 between 1.9 and 440 for 99.8%
      of resolved galaxies), so shapes come from the HSM moments as on DP0.2.
      Not a public release: DESC NERSC group access (lsst).
  - id: ou24_sn_truth
    type: data
    source: "data/ou24_sn_truth_index.csv"
    description: >-
      OU2024 transient truth, declared through an index (path, size, mtime,
      written by src/ou24_index_files.py) of 189 files, 0.62 GB, all read in
      place at NERSC: (1) the skyCatalog transient tables
      /global/cfs/cdirs/descssim/imSim/skyCatalogs_v1.1.2/snana_<hpix>.parquet
      (33 files, 1,352,231 transients; what imSim injected: id, ra, dec,
      host_id, z_CMB, model_name, mjds), public at
      https://portal.nersc.gov/cfs/lsst/DESC_TD_PUBLIC/Roman+DESC/PQ+HDF5_ROMAN+LSST_LARGE/
      and IRSA s3://nasa-irsa-simulations/openuniverse2024/roman/full/roman_rubin_cats_v1.1.2_faint/;
      (2) the SNANA truth dump OU24_TRANSIENT_TRUTH_HEAD.DAT.gz (R. Kessler,
      148 MB: CID, GENTYPE, GALID = true host, GALSNSEP, GALSNDDLR,
      LOGMASS_TRUE, a_rot) and (3) the 155 per-class SNANA HEAD files
      ROMAN+LSST_LARGE_<class>/*_HEAD.FITS.gz (SIM_HOSTLIB_GALID, HOSTGAL_*),
      both under /global/cfs/cdirs/lsst/www/DESC_TD_PUBLIC/Roman+DESC =
      https://portal.nersc.gov/cfs/lsst/DESC_TD_PUBLIC/Roman+DESC/. Every
      transient has a true host (GALID); SNANA's HOSTGAL_OBJID equals it
      whenever non-zero, so it is not an independent DLR host.
  - id: ou24_host_truth
    type: data
    source: "data/ou24_skycatalog_galaxy_index.csv"
    description: >-
      OU2024 skyCatalog v1.1.2 galaxy truth (diffsky), declared through an
      index of 105 files, 489 GB (the SED hdf5 files are most of it):
      /global/cfs/cdirs/descssim/imSim/skyCatalogs_v1.1.2/galaxy_<hpix>.parquet
      (positions, spheroid/disk half-light radii in arcsec before the
      area-preserving shear, spheroid/disk reduced-shear ellipticities,
      stellar mass), galaxy_flux_<hpix>.parquet (LSST fluxes in photons/s/cm2,
      AB magnitudes with the 00README zero points) and galaxy_sed_<hpix>.hdf5
      (separate disk, bulge and knot SEDs, the only source of B/T), for all 33
      healpix pixels, plus the LSST throughputs
      /global/cfs/cdirs/descssim/imSim/lsst/data/throughputs_aug_2021/baseline/total_<b>.dat
      used to integrate them. Public mirror as for ou24_sn_truth (IRSA,
      portal.nersc.gov PQ+HDF5_ROMAN+LSST_LARGE). galaxy_id = <hpix><1
      digit><9 digits> = the SNANA GALID.
  # ---- Tier 2: DES-SN5YR confident host matches ----
  - id: des_sn5yr_hosts
    type: data
    source: data/des_sn5yr
    description: >-
      DES-SN5YR release files (https://github.com/des-science/DES-SN5YR, copied 2026-10-29 from the
      baselineflux project's copy of 28 Oct 2026; sha256 in data/README.md):
      4_DISTANCES_COVMAT/DES-Dovekie_Metadata.csv (the Dovekie cosmology sample; 1,623 DES SNe Ia with
      IDSURVEY = 10, all with a host) and 0_DATA/DES-SN5YR_DES/DES-SN5YR_DES_HEAD.FITS.gz (SN RA/Dec and the
      published HOSTGAL / HOSTGAL2 positions, d_DLR, magnitudes), with their READMEs. The published host is
      the DES-SN DLR assignment (SExtractor A, B, THETA on deep SN-field coadds, d_DLR <= 4 within 15"),
      visually vetted: a DLR-derived reference, not truth.
  - id: des_dr2_objects
    type: data
    source: data/des_dr2_candidates.parquet
    description: >-
      Every DES DR2 object (des_dr2.main at NOIRLab Data Lab TAP) within 2 arcmin of each of the 1,623 DES
      SNe, one row per object, fetched once on 2026-10-29 by src/des_fetch_dr2.py (not a recipe: TAP is not
      reproducible; query, date and counts in data/README.md and the parquet metadata): position, the
      detection-image a_image, b_image, theta_j2000, kron_radius, extended_class_coadd/wavg, and per band
      (grizy) flux_auto(err), mag_auto, flux_radius, kron_radius, windowed moments, class_star, spread_model,
      flags, imaflags_iso, niter_model. The candidate catalogue for both methods.
  # ---- Tier 4: Rubin DP2, no truth ----
  - id: dp2_transients
    type: data
    source: "data/dp2_sn_candidates_index.csv"
    description: >-
      DP2 SN candidate samples from the EDP2 transient working group at NERSC,
      /global/cfs/cdirs/lsst/groups/TD/SN/EDP2/SN_candidates (Mi Dai, R. Chen;
      README and README_RC.md there), declared through an index (path, size,
      mtime; src/ou24_index_files.py) of the four sample files because the
      directory is shared and keeps growing; src/dp2_sample.py checks size and
      mtime against it. dp2_sample reads RC_sample.parquet, dp2_ddf_sample parsnip_ddf.parquet.
      RC_sample.parquet (rc_salt, R. Chen, 8 Oct 2026): 690 objects. Built
      from for_fastdb/subsample.hats (363,339 DiaObjects with ndet >= 7, >= 3
      positive detections after removing isDipole / psfFlux_flag / edge /
      saturatedCenter / bad / centroid / cr detections, max reliability >=
      0.486, >= 3 bands and >= 3 detections in one of griz); |b| > 10 deg
      (195,043); forced psfDiffFlux cleaned (visits with pixel or PSF flags
      dropped, psfDiffFluxErr_corrected, 5 sigma clip within nights of >= 3
      visits) and coadded per night (inverse variance); S/N > 5 on >= 3
      nights in >= 2 bands (122,465, = RC_lcfit_input_122k.parquet, rc_all);
      a per-band baseline correction (applied only where the baseline B < 0,
      its error added in quadrature); SNANA snlc_fit with SALT3.DOVEKIE (EDP2
      bandpasses, z fitted from the light curve over 0.01-1.5 with a +-0.5
      mag LCDM distance prior, >= 2 bands with S/N > 5, SNRSUM >= 20, >= 6
      epochs, one epoch before peak and one >= +5 rest-frame days after,
      epochs within -15..+35 rest-frame days); kept FITPROB > 0.01, |x1| < 3,
      |c| < 0.3. final_sample.parquet (md_final): Mi Dai's 617 SALT-fit
      candidates (102 in common with RC); parsnip_ddf.parquet: the 7823 DDF
      DiaObjects classified with ParSNIP (also the set the collaborator
      host associations cover; a local copy of its ids and positions is
      data/dp2_transients.csv, identical id set, 2026-10-26).
  - id: dp2_delight_yjkang
    type: data
    source: "data/dp2_delight_yjkang_index.csv"
    description: >-
      Y. J. Kang's DELIGHT host predictions for the 7823 DDF ParSNIP
      transients (dp2_sample parsnip_ddf), declared through an index (path,
      size, mtime, sha256; src/ou24_index_files.py --sha256) of the two files
      in /global/cfs/cdirs/lsst/groups/TD/SN/EDP2/SN_candidates/EDP2_Host_Associations/Host_Association_Delight_Prost_YJ_Kang
      (README there). delight_parsnip_dp2_8k_results.parquet: oid (the
      DiaObject id), image_survey (the cutouts DELIGHT ran on: Legacy 5100,
      PS1 2719, DES_DR2 4; not Rubin pixels), ra_delight / dec_delight (the
      CNN host centre, averaged over 8 rotations and flips), std_delight,
      ra_sex / dec_sex (the SExtractor source nearest in elliptical distance,
      "DELIGHT-SEx"), hostsize. The companion
      delight_parsnip_dp2_8k_legacy_dr10_photoz_specz.parquet carries Kang's
      nearest DP2 Object to the CNN position (dp2_objectId, 95.6% matched,
      separations up to 2"), the Legacy DR10 counterpart and photo-z /
      spec-z. DELIGHT has no truth here: it is a third method, compared by
      agreement only.
  - id: legacy_dr10_sweeps
    type: data
    source: "data/legacy_dr10_sweeps_index.csv"
    description: >-
      Legacy Surveys DR10 south Tractor catalogue sweeps,
      /global/cfs/cdirs/cosmo/data/legacysurvey/dr10/south/sweep/10.1 (5 x 5
      deg tiles, 1437 files), declared through an index (path, size, mtime,
      sha256; src/legacy_index_sweeps.py, each hash checked against the
      survey's legacysurvey_dr10_south_sweep_10.1.sha256sum) of the 14 tiles
      (25 GB) within 0.3 deg of any parsnip_ddf transient: ELAIS-S1, ECDFS,
      EDFS and COSMOS. TYPE (PSF/REX/EXP/DEV/SER/DUP), RA, DEC, SHAPE_R
      (half-light semi-major axis, arcsec), SHAPE_E1/E2, SERSIC, FLUX_G/R/I/Z
      (nanomaggies) and IVAR, FRACFLUX, NOBS, PSFSIZE, MASKBITS, DCHISQ. The
      imaging predates the DP2 transients. Read by dp2_ddf_sample for the
      star / AGN flags; a position needing a tile outside the index is an
      error, so only the DDF transients are covered.
  - id: dp2_object
    type: data
    source: "data/dp2_object_hats_index.csv"
    description: >-
      DP2 Object table at NERSC as the HATS catalogue
      /global/cfs/cdirs/lsst/shared/rubin/DP2/HATS/object_collection/object_lc
      (hats-import 0.10.0, 786,420,720 rows, 8840 healpix partitions of order
      2-8, 3.6 TB with the nested forced-source light curves; every row is a
      primary object). Declared through an index of the partition files
      (path, size, mtime; src/dp02_index_objects.py) because lc hashes inputs
      by content and the release is frozen; the scripts read the catalogue's
      per_partition_statistics.parquet beside them for partition bounding
      boxes and refuse to run if a partition is missing from the index. Both
      MultiProFit fits (exponential_* with n = 1 and sersic_* with free n:
      reff_x, reff_y, rho in 0.2" tract pixels, a Gaussian-mixture model
      whose half-light radius is ~1.386 reff; per-band {b}_exponentialFlux,
      {b}_sersicFlux), cModel fluxes and flags, HSM moments, blendedness,
      extendedness and the deblend columns.
outputs:
  # ---- Tier 1: DP0.2 ----
  - id: dp02_candidates
    type: table
    format: parquet
    description: >-
      Every DP0.2 primary object within the search radius of any DC2 SN, one
      row per (SN, object) pair, carrying the per-band CModel component radii
      and fluxes, HSM moments, extendedness and position, plus the
      object-table quality columns the candidate_quality cut reads:
      {b}_cModelFluxErr, {b}_cModel_flag, {b}_blendedness(_flag), {b}_bdChi2,
      deblend_nChild, deblend_skipped, detect_fromBlend, detect_isIsolated,
      parentObjectId and parent_nChild (deblend_nChild of the parent row,
      0 for isolated objects). DP0.2 has no deblend_tooManyPeaks or
      deblend_parentTooBig and names the CModel flag {b}_cModel_flag.
      Extracted once from the 157 tract files; everything downstream reads
      this instead of the 1 TB Object table.
    inputs: [dp02_sn_truth, dp02_object]
    decisions: [search_radius]
    recipe:
      command: python src/dp02_candidates.py --truth {inputs.dp02_sn_truth} --objects {inputs.dp02_object} --search-radius {decisions.search_radius} --workers 16 --output {output}
      resources: {cpus: 16, memory: 56Gi}
  - id: dp02_sample
    type: table
    format: parquet
    description: >-
      The sample, rung 2 of the ladder: one row per DC2 SN that is hosted,
      has a host truth row, is detectable (transient_peak_mag: true peak r
      from dp02_sn_peak, peak epoch inside the dp02_visits window) and lies
      within the dp02_sample_cuts offset cut. SNe whose true host has no
      DP0.2 object under truth_match stay in the sample with host_objectId =
      -1 (host_unmatched), so the association records what the pipeline does
      with them; before 31 Oct 2026 they were dropped. Columns: SN position,
      redshift, peak_mjd and peak_mag_r, true host truth id, position, mag_r
      and redshift, the host's DP0.2 objectId (per truth_match) and the
      SN-host separation, the flags behind the cuts (hostless, host_missing,
      faint, far; offset_re, the offset in host half-light radii, under
      cuts=physical). Both truth matchers are always carried (host_objectId_mt,
      host_objectId_nn with match_sep_arcsec). Parquet metadata:
      truth_match_precut (how the matchers compare on the sample) and
      sample_ladder (counts at every step: transients, hosted, host_row,
      detectable, sample, faint_dropped, far_dropped,
      host_unmatched_in_sample), the numbers the text quotes for the SNe the
      figures do not show.
    inputs: [dp02_sn_truth, dp02_truth_match, dp02_candidates, dp02_host_truth_shapes, dp02_sn_peak, dp02_visits]
    decisions: [truth_match, dp02_sample_cuts, transient_peak_mag]
    recipe:
      command: python src/dp02_sample.py --truth {inputs.dp02_sn_truth} --match {inputs.dp02_truth_match} --candidates {inputs.dp02_candidates} --shapes {inputs.dp02_host_truth_shapes} --peak {inputs.dp02_sn_peak} --visits {inputs.dp02_visits} --truth-match {decisions.truth_match} --cuts {decisions.dp02_sample_cuts} --peak-mag {decisions.transient_peak_mag} --record-decisions --output {output}
      resources: {cpus: 4, memory: 24Gi}
  - id: dp02_associations
    type: table
    format: parquet
    description: >-
      One row per sample SN: true host objectId, the SBW most probable host
      and its p_sbw, p_sbw of the true host and its rank, p_top (every
      candidate probability above 0.001, descending), frac_light_beyond, DLR
      host and d_dlr, d_dlr of the true host, and the derived flags
      sbw_correct (most probable host = true host) and agree (most probable
      host = DLR host), kept as diagnostics only since 4 Nov 2026: SBW's most
      probable host has no special meaning, and every success or agreement
      number uses P_SBW(true) >= p_true_threshold resp. P_SBW(DLR host) >=
      p_true_threshold (src/dp02_lib.py sbw_success, dlr_in_sbw_set);
      dlr_correct.
      flb_max is the largest frac_light_beyond over all candidates (an
      alternative hostless statistic to flb_best, the most probable host's).
      Candidates are cut in order: search radius, extendedness_cut, no usable
      radius or flux for the profile (always dropped: an object-table
      failure, not patched), candidate_quality; n_cut_* count the candidates
      each step removed and true_host_status records which step removed the
      true host (absent / point_source / unusable / quality / kept; absent
      includes the host-unmatched SNe of the sample, whose host_objectId is
      -1, so the table is the whole rung-2 sample and every consumer filters
      its own rung). The parquet metadata carries the fraction of candidates
      and of true hosts removed by each step.
    inputs: [dp02_sample, dp02_candidates]
    decisions: [sbw_profile, band, search_radius, dlr_max, dlr_radius, extendedness_cut, candidate_quality]
    recipe:
      command: python src/dp02_associate.py --sample {inputs.dp02_sample} --candidates {inputs.dp02_candidates} --profile {decisions.sbw_profile} --band {decisions.band} --search-radius {decisions.search_radius} --dlr-max {decisions.dlr_max} --dlr-radius {decisions.dlr_radius} --extendedness {decisions.extendedness_cut} --candidate-quality {decisions.candidate_quality} --workers 16 --output {output}
      resources: {cpus: 16, memory: 40Gi}
  - id: dp02_recovery
    type: metric
    format: json
    description: >-
      SBW as a distribution on rung 4 (true host usable by both methods):
      mean P_SBW(true host) (the expected recovery if each SN's host were
      drawn from the SBW probabilities), with and without the hostless cut,
      and the fractions in the four bands
      P(true) > 0.5 / p_true_threshold..0.5 / below the threshold (excluded) /
      SBW hostless; SBW recovery (P_SBW(true) >= p_true_threshold: the true
      host is in the credible set; SBW's most probable host has no special
      meaning, so 'most probable = true' is not reported since 4 Nov 2026)
      and DLR recovery with binomial intervals; the SBW-DLR agreement rate
      (P_SBW(DLR host) >= p_true_threshold), the fraction SBW declares
      hostless under sbw_hostless_cut, the 4x3 probabilistic agreement-matrix
      cells, and the random-position 2x2 with the fraction each method
      correctly rejects. ladder counts the sample at rungs 2, 3 and 4 and
      by_rung repeats mean P_SBW(true), SBW and DLR recovery and the
      hostless fractions on each rung (P = 0 where the true host is absent or
      cut), so the catalogue's and the method's losses are read side by side.
    inputs: [dp02_associations, dp02_random_associations, dp02_lib_script]
    decisions: [sbw_hostless_cut, p_true_threshold]
    recipe:
      command: python src/dp02_fig.py recovery --associations {inputs.dp02_associations} --random {inputs.dp02_random_associations} --hostless-cut {decisions.sbw_hostless_cut} --p-threshold {decisions.p_true_threshold} --output {output}
  - id: dp02_calibration
    type: figure
    format: pdf
    description: >-
      Candidate-level SBW reliability curve: on the SNe that SBW keeps as
      hosted (flb_best >= sbw_hostless_cut) and whose true host is a surviving
      candidate, every candidate with P_SBW > 0.001 is binned by its P_SBW and
      the fraction of candidates in the bin that are the true host is plotted
      against the bin's mean P_SBW (log-log over the full range, linear above
      0.5), with the candidate and true-host counts per bin. A calibrated
      probability follows the 1:1 line in every bin, not only for the most
      probable host. The calibration error is the summed |true hosts - summed
      P_SBW| over bins per SN. Hostless calls and SNe whose host is absent are
      left out because SBW's probabilities are not used there (30 Oct 2026;
      before, the curve was on the most probable host only).
      The hosted condition is rung 4 of the sample ladder.
    inputs: [dp02_associations]
    decisions: [sbw_hostless_cut]
    recipe:
      command: python src/dp02_fig.py calibration --associations {inputs.dp02_associations} --hostless-cut {decisions.sbw_hostless_cut} --output {output}
  - id: dp02_calibration_by_band
    type: figure
    format: pdf
    description: The candidate-level reliability curve (as dp02_calibration) recomputed in each of u g r i z y with the headline profile, one panel per band, independent of the band decision. Rung 4 of the sample ladder (true host usable by both methods; N in the title).
    inputs: [dp02_sample, dp02_candidates]
    decisions: [sbw_profile, search_radius, dlr_max, dlr_radius, extendedness_cut, candidate_quality, sbw_hostless_cut, p_true_threshold]
    recipe:
      command: python src/dp02_sweep.py band --sample {inputs.dp02_sample} --candidates {inputs.dp02_candidates} --profile {decisions.sbw_profile} --search-radius {decisions.search_radius} --dlr-max {decisions.dlr_max} --dlr-radius {decisions.dlr_radius} --extendedness {decisions.extendedness_cut} --candidate-quality {decisions.candidate_quality} --hostless-cut {decisions.sbw_hostless_cut} --p-threshold {decisions.p_true_threshold} --output {output}
      resources: {cpus: 16, memory: 40Gi}
  - id: dp02_calibration_by_profile
    type: figure
    format: pdf
    description: The candidate-level reliability curve (as dp02_calibration) recomputed for each analytic SBW form (exponential n = 1, de Vaucouleurs n = 4, moment Gaussian) in the headline band, independent of the sbw_profile decision. Rung 4 of the sample ladder (true host usable by both methods; N in the title).
    inputs: [dp02_sample, dp02_candidates]
    decisions: [band, search_radius, dlr_max, dlr_radius, extendedness_cut, candidate_quality, sbw_hostless_cut, p_true_threshold]
    recipe:
      command: python src/dp02_sweep.py profile --sample {inputs.dp02_sample} --candidates {inputs.dp02_candidates} --band {decisions.band} --search-radius {decisions.search_radius} --dlr-max {decisions.dlr_max} --dlr-radius {decisions.dlr_radius} --extendedness {decisions.extendedness_cut} --candidate-quality {decisions.candidate_quality} --hostless-cut {decisions.sbw_hostless_cut} --p-threshold {decisions.p_true_threshold} --output {output}
      resources: {cpus: 16, memory: 40Gi}
  - id: dp02_agreement_matrix
    type: figure
    format: pdf
    description: >-
      Probabilistic agreement matrix on the SNe whose true host passed the
      catalogue (cat1) and object-table (cat2) cuts for both methods, so every
      cell is an association outcome (the title gives N and the fraction of
      the sample): rows are the SBW probability of the true host, P_SBW(true)
      > 0.5 / in [p_true_threshold, 0.5] / below p_true_threshold (excluded
      by SBW) / SBW hostless under sbw_hostless_cut, against DLR host true /
      wrong / hostless: counts and fractions in each cell. A second panel applies the same cuts to dp02_random_positions as a 2x2
      (SBW hostless = correct / assigns a host = wrong, against the same for
