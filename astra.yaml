    inputs: [dp02_sample, dp02_associations, dp02_lib_script]
    decisions: [sbw_hostless_cut]
    recipe:
      command: python src/dp02_truth_match.py --sample {inputs.dp02_sample} --associations {inputs.dp02_associations} --hostless-cut {decisions.sbw_hostless_cut} --output {output}
  - id: dp02_disagreement_cases
    type: table
    format: csv
    description: >-
      Twelve seeded random SNe per class for the cutout gallery:
      truth_matchers_disagree (MatchesTruth and nearest-within-1-arcsec name
      different objects), sbw_excludes_true_host (true host survived the cuts
      but P_SBW(true) < p_true_threshold), dlr_wrong_or_hostless,
      dlr_host_excluded_by_sbw (DLR names a host SBW gives P_SBW <
