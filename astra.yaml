  - id: dp02_band_dependence
    type: figure
    format: pdf
    description: Mean P_SBW(true host), SBW (P_SBW(true) >= p_true_threshold) and DLR recovery and SBW-DLR agreement (the DLR host in SBW's credible set) per band (u g r i z y), and how often the SBW most probable host changes between bands (a stability diagnostic of the top candidate, not a success measure). Rung 4 of the sample ladder (true host usable by both methods; N in the title).
