  - id: dp02_profile_sweep
    type: table
    format: csv
    description: >-
      Mean P_SBW(true host), SBW recovery (P_SBW(true) >= p_true_threshold), DLR agreement and calibration error for every
      analytic SBW form (exponential n = 1, de Vaucouleurs n = 4, moment Gaussian)
