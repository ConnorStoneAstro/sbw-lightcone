    inputs: [dp02_associations, dp02_random_associations, dp02_lib_script]
    decisions: [sbw_hostless_cut, p_true_threshold]
    recipe:
      command: python src/dp02_fig.py agreement_matrix --survivors-only --associations {inputs.dp02_associations} --random {inputs.dp02_random_associations} --hostless-cut {decisions.sbw_hostless_cut} --p-threshold {decisions.p_true_threshold} --output {output}
  - id: dp02_agreement_vs_ddlr
