      command: python src/des_run.py associate --positions {inputs.des_random_positions} --candidates {inputs.des_random_candidates} --profile {decisions.sbw_profile} --band {decisions.band} --search-radius {decisions.search_radius} --dlr-max {decisions.dlr_max} --dlr-radius {decisions.dlr_radius} --extendedness {decisions.extendedness_cut} --candidate-quality {decisions.candidate_quality} --workers 8 --output {output}
      resources: {cpus: 8, memory: 8Gi}
  - id: des_association_sweep
    type: table
    format: parquet
    description: >-
      The des_associations computation for every DES band (griz; DR2 has no u, and Y is shallow and unused by
