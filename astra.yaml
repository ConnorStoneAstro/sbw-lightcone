  dc2_sn_position_sampled_from_sersic_profile:
    claim: In DC2 a hosted SN Ia is assigned to the bulge or disk with probability proportional to that
      component's stellar mass, and its position is drawn from the surface-brightness profile of that component
      (pure Sersic n = 1 disk or n = 4 bulge). DC2 truth therefore places SNe exactly according to the host
      light profile; an exponential-only SBW model is exact for disk-hosted SNe but mis-specified for bulge-hosted
      ones.
    created_at: '2026-10-26T20:04:08Z'
    evidence:
    - id: ev1
      doi: 10.48550/arXiv.2010.05926
      quote:
        exact: we first assigned the SN to one of the components randomly, assuming that the probability
          of a component hosting it was proportional to its stellar mass. Then, finally, we assigned a position
          by sampling the surface brightness profile of the hosting component (which in the cosmoDC2 catalog
          was by definition sersic and only had a sersic index of 1 or 4)
        prefix: Since cosmoDC2 galaxies have bulges, disks, or both,
        suffix: This prescription results in angular distance of the hosted SNe Ia
      location:
        page: 16
    scope: DC2/DP0.2 simulated SNe Ia only; real SN populations need not follow the host light exactly.
  dc2_sn_offsets_scale_with_hosting_component_size:
