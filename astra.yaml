  - id: dp02_random_positions
    type: table
    format: parquet
    description: >-
      Ten random sky positions per sample SN, uniform in area in the 45-90
      arcsec annulus around it (the design every tier shares since 2 Nov
      2026: they share the SN's field and depth, and the 30 arcsec search
