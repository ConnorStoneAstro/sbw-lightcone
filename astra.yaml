# ASTRA Analysis Specification

version: "0.0.15"
name: "SBW host association performance"
description: >-
  Tests the surface-brightness-weighted (SBW) host-association method for
  transients, as implemented in the sbw_host package, on five tiers of data:
  DP0.2 (DC2) and OpenUniverse2024 (OU2024, the same Rubin data products from
  the later w_2024_22 stack on a different simulated sky) with true hosts,
  the DES-SN5YR published hosts, the DELIGHT
  visually matched host set, and Rubin DP2 real data without any reference.
  SBW is taken as the framework; the questions are which form of SBW (fitted
  exponential, free-n Sersic, or deblended image stamps) recovers hosts best,
  and how SBW relates to the directional-light-radius (DLR) standard
  (disagreement rate, band dependence, agreement versus d_DLR) rather than
  which one wins. Each tier produces an association table, a recovery or
  disagreement metric and regime-binned figures; the DP0.2 tier adds SBW
  calibration (reliability) curves and the SBW/DLR agreement-versus-truth
  matrix, and OU2024 repeats the DP0.2 chain, adds results in host-magnitude
  bins (its hosts are drawn ~1 dex too light) and checks whether its
  transients sit on the rendered host or its mirror image as in DC2; a
  cross-tier summary table collects them. Everything for DP0.2 and OU2024 runs
  on NERSC from the parquet copies of the truth and Object tables.

inputs:
  # ---- Tier 1: simulation with true hosts (DP0.2 / DC2) ----
  - id: dp02_sn_truth
    type: data
    source: "/global/cfs/cdirs/lsst/shared/DC2-prod/Run2.2i/truth/truth_merged_summary_v1-0-0/match_dr6_v2"
    description: >-
      DESC DC2 merged truth summary, one parquet per tract (166 tracts): every
      truth row (truth_type 1 galaxy, 2 star, 3 SN) with id, host_galaxy, ra,
      dec, redshift, fluxes and mag_r. SN rows (445k over the DC2 footprint)
      give the transient positions and the true host id; the host's own row
      gives its position, magnitude and redshift. The match_objectId column in
      these files refers to the DESC DR6 processing, not DP0.2, and is not used.
  - id: dp02_truth_match
    type: data
    source: "/global/cfs/cdirs/lsst/shared/rubin/DP0.2/match_ref_truth_summary_objectTable"
    description: >-
      Rubin's DP0.2 truth-to-object match (the TAP MatchesTruth table), one
      parquet per tract: truth id string to DP0.2 objectId with match_candidate,
      match_count and match_chisq. This is how a true host galaxy becomes a
      DP0.2 objectId under truth_match: matches_truth.
  - id: dp02_object
    type: data
    source: "data/dp02_objectTable_index.csv"
    description: >-
      DP0.2 Object table at NERSC, /global/cfs/cdirs/lsst/shared/rubin/DP0.2/objectTable,
      one parquet per tract (157 tracts, 1 TB), the same rows ingested into
      Qserv. The declared source is an index of those files (path, size,
      mtime, written by src/dp02_index_objects.py) because lc hashes declared
      inputs by content on every command and 1 TB takes 15 minutes; DP0.2 is
      a frozen 2022 release, so the index stands in for the bytes. Per band: CModel bulge (de Vaucouleurs) and
      disk (exponential) determinant radii bdReB/bdReD in pixels, component
      fluxes bdFluxB/bdFluxD, cModelFlux, HSM source and PSF moments
      ixx/iyy/ixy(PSF), kronRad, extendedness. The v23 bdE1 column is unusable
      (the E1 functor lacked parentheses: xx - yy/(xx+yy)), so orientation and
      axis ratio come from the PSF-subtracted HSM moments instead.
  - id: cosmodc2_hosts
    type: data
    source: "data/cosmodc2_v1.1.4_image_index.csv"
    description: >-
      cosmoDC2 v1.1.4 image catalogue at NERSC,
      /global/cfs/cdirs/lsst/shared/xgal/cosmoDC2/cosmoDC2_v1.1.4_parquet_r2
      (the target of the cosmoDC2_v1.1.4_parquet symlink GCRCatalogs reads),
      131 healpix parquet files, 2.9 TB, 308 columns. Declared through an index
      (path, size, mtime) like dp02_object, since hashing 2.9 TB per lc command
      is not an option and cosmoDC2 is frozen. galaxy_id equals the DC2 merged
      truth galaxy id and SN host_galaxy. Used for the true bulge and disk
      half-light semi-axes (size_bulge_true, size_minor_bulge_true,
      size_disk_true, size_minor_disk_true, arcsec), position_angle_true,
      bulge_to_total_ratio_i, ellipticities, stellar masses and true magnitudes.
  - id: rsp_token
    type: data
    source: "/global/cfs/cdirs/m1727/cstone/.rsp_image_tap_token"
    description: >-
      Rubin Science Platform access token (read:tap and read:image scopes) on
      NERSC (mode 600), used by the cutout gallery and the PA-mirror figure to
      query dp02_dc2_catalogs.ObsCore and the SODA cutout service at
      data.lsst.cloud from Perlmutter compute nodes. Outside the repository and
      never committed; recorded by content like the other NERSC inputs, so only
      its hash enters the run records.
  - id: dp02_deblended_stamps
    type: data
    source: "RSP butler dp02 deepCoadd_deblendedModel / cutout service (not on NERSC)"
    description: >-
      Deblender model stamps for candidate hosts, used by the image-level
      (stamp) form of SBW. No DP0.2 images exist on NERSC, so this needs the
      RSP cutout service and is parked until a subsample is chosen.
  # ---- Tier 1b: simulation with true hosts (OpenUniverse2024, LSST WFD) ----
  - id: ou24_object
    type: data
    source: "data/ou24_objectTable_index.csv"
    description: >-
      OpenUniverse2024 LSST WFD Object table processed with the LSST Science
      Pipelines w_2024_22, in the roman-desc-sims butler repo at NERSC,
      /global/cfs/cdirs/lsst/production/gen3/roman-desc-sims/repo/u/descdm/step3b_wfd_NNN_w_2024_22/<timestamp>/objectTable_tract/<tract>/*.parq
      (NNN = 000..066): 67 files in 22 tracts (RA 5.8-13.2, Dec -46.7 to
      -41.4, about 27 deg2), 18.27M rows, 6.70M primary, 74.9 GB. The runs of
      one tract hold disjoint patches, so every file is needed (detect_isPrimary
      makes objects unique). The declared source is an index (run, tract, path,
      size, mtime, rows, primary rows, patches, RA/Dec box) written by
      src/ou24_index_objects.py --rule union, as dp02_object does for DP0.2.
      Every DP0.2 column used here exists with the same name; the v23 bdE1
      functor bug persists in w_2024_22 (r_bdE1 between 1.9 and 440 for 99.8%
      of resolved galaxies), so shapes come from the HSM moments as on DP0.2.
      Not a public release: DESC NERSC group access (lsst).
  - id: ou24_sn_truth
    type: data
    source: "data/ou24_sn_truth_index.csv"
    description: >-
      OU2024 transient truth, declared through an index (path, size, mtime,
      written by src/ou24_index_files.py) of 189 files, 0.62 GB, all read in
      place at NERSC: (1) the skyCatalog transient tables
      /global/cfs/cdirs/descssim/imSim/skyCatalogs_v1.1.2/snana_<hpix>.parquet
      (33 files, 1,352,231 transients; what imSim injected: id, ra, dec,
      host_id, z_CMB, model_name, mjds), public at
      https://portal.nersc.gov/cfs/lsst/DESC_TD_PUBLIC/Roman+DESC/PQ+HDF5_ROMAN+LSST_LARGE/
      and IRSA s3://nasa-irsa-simulations/openuniverse2024/roman/full/roman_rubin_cats_v1.1.2_faint/;
      (2) the SNANA truth dump OU24_TRANSIENT_TRUTH_HEAD.DAT.gz (R. Kessler,
      148 MB: CID, GENTYPE, GALID = true host, GALSNSEP, GALSNDDLR,
      LOGMASS_TRUE, a_rot) and (3) the 155 per-class SNANA HEAD files
      ROMAN+LSST_LARGE_<class>/*_HEAD.FITS.gz (SIM_HOSTLIB_GALID, HOSTGAL_*),
      both under /global/cfs/cdirs/lsst/www/DESC_TD_PUBLIC/Roman+DESC =
      https://portal.nersc.gov/cfs/lsst/DESC_TD_PUBLIC/Roman+DESC/. Every
      transient has a true host (GALID); SNANA's HOSTGAL_OBJID equals it
      whenever non-zero, so it is not an independent DLR host.
  - id: ou24_host_truth
    type: data
    source: "data/ou24_skycatalog_galaxy_index.csv"
    description: >-
      OU2024 skyCatalog v1.1.2 galaxy truth (diffsky), declared through an
      index of 105 files, 489 GB (the SED hdf5 files are most of it):
      /global/cfs/cdirs/descssim/imSim/skyCatalogs_v1.1.2/galaxy_<hpix>.parquet
      (positions, spheroid/disk half-light radii in arcsec before the
      area-preserving shear, spheroid/disk reduced-shear ellipticities,
      stellar mass), galaxy_flux_<hpix>.parquet (LSST fluxes in photons/s/cm2,
      AB magnitudes with the 00README zero points) and galaxy_sed_<hpix>.hdf5
      (separate disk, bulge and knot SEDs, the only source of B/T), for all 33
      healpix pixels, plus the LSST throughputs
      /global/cfs/cdirs/descssim/imSim/lsst/data/throughputs_aug_2021/baseline/total_<b>.dat
      used to integrate them. Public mirror as for ou24_sn_truth (IRSA,
      portal.nersc.gov PQ+HDF5_ROMAN+LSST_LARGE). galaxy_id = <hpix><1
      digit><9 digits> = the SNANA GALID.
  # ---- Tier 2: DES-SN5YR confident host matches ----
  - id: des_sn5yr_hosts
    type: data
    source: "https://github.com/des-science/DES-SN5YR (4_DISTANCES_COVMAT/DES-Dovekie_Metadata.csv, 0_DATA/DES-SN5YR_DES/DES-SN5YR_DES_HEAD.FITS.gz)"
    description: >-
      1623 DES SNe Ia of the Dovekie cosmology sample (IDSURVEY = 10) with the
      published HOSTGAL_RA/DEC (DLR-based, visually vetted) host positions.
  - id: des_dr2_objects
    type: data
    source: "tap://datalab.noirlab.edu/tap des_dr2.main (a_image, b_image, theta_j2000, flux_radius, flux_auto)"
    description: >-
      DES DR2 SExtractor shape and flux measurements for every object within the
      search radius of each DES SN; the candidate catalogue for both methods.
  # ---- Tier 3: DELIGHT visually matched hosts ----
  - id: delight_hosts
    type: data
    source: "DELIGHT (Forster et al. 2022, AJ 164 195) public training set: transient RA/Dec and visually matched host RA/Dec"
    description: >-
      Historical transients with hosts matched by eye; no ground truth but a
      vetted reference. Candidate galaxies must come from a survey with model
      fits covering these fields (see decision delight_catalogue).
  - id: delight_candidate_objects
    type: data
    source: "DESI Legacy Surveys DR10 Tractor catalogue (shape_r, shape_e1, shape_e2, sersic, flux_*) via NOIRLab Data Lab TAP"
    description: >-
      Candidate galaxies with parametric (EXP/DEV/SER) Tractor models around each
      DELIGHT transient.
  # ---- Tier 4: Rubin DP2, no truth ----
  - id: dp2_transients
    type: data
    source: "NERSC /global/cfs/cdirs/lsst/groups/TD/SN/EDP2/SN_candidates/{RC_sample,final_sample,parsnip_ddf,RC_lcfit_input_122k}.parquet (file chosen by decision dp2_sample)"
    description: >-
      DP2 SN candidate samples from the EDP2 transient working group (Mi Dai,
      R. Chen; README and README_RC.md in that directory). RC_sample.parquet:
      690 objects with a successful SALT3 fit (FITPROB > 0.01, |x1| < 3,
      |c| < 0.3) after nightly coadd, baseline correction and S/N cuts;
      final_sample.parquet: Mi Dai's 617 candidates with a SALT fit (overlap of
      102 with RC); parsnip_ddf.parquet: the 7823 DDF DiaObjects run through
      ParSNIP (also the set the three collaborator host-association runs
      cover); RC_lcfit_input_122k.parquet: all 122,465 objects passing the
      detection, reliability, |b| > 10 and S/N cuts before any fit. A local
      copy of the parsnip_ddf ids and positions is data/dp2_transients.csv
      (verified identical id set, 2026-10-26).
  - id: dp2_parsnip_ddf_sample
    type: data
    source: "NERSC /global/cfs/cdirs/lsst/groups/TD/SN/EDP2/SN_candidates/parsnip_ddf.parquet (local copy data/dp2_transients.csv)"
    description: >-
      The 7823-object DDF ParSNIP sample, fixed as the cross-method comparison
      set regardless of dp2_sample, because the collaborator associations below
      exist only for it.
  - id: dp2_dlr_legacy_jlee
    type: data
    source: "NERSC .../SN_candidates/EDP2_Host_Associations/Host_Association_DLR_J_Lee/host_association_DLR_8k_sample_v261009.csv"
    description: >-
      J. Lee's DLR host association of the 7823 DDF sample using DESI Legacy
      Surveys DR10 Tractor shapes (SHAPE_R, SHAPE_E1/E2, TYPE) with photo-z;
      columns include ddlr, ddlr_second, n_candidates, has_host (7809 rows).
  - id: dp2_delight_yjkang
    type: data
    source: "NERSC .../SN_candidates/EDP2_Host_Associations/Host_Association_Delight_Prost_YJ_Kang/delight_parsnip_dp2_8k_results.parquet (+ _legacy_dr10_photoz_specz.parquet)"
    description: >-
      Y. J. Kang's DELIGHT (and SExtractor) predicted host positions for the
      7823 DDF sample on image cutouts, with DP2 Object and Legacy DR10
      counterparts and redshifts in the companion file.
  - id: dp2_object
    type: data
    source: "tap://data.lsst.cloud/api/tap dp2 Object (MultiProFit sersic_* and exponential_* fits) | NERSC HATS object_collection"
    description: >-
      DP2 Object table rows with both MultiProFit fits, queried per transient
      region (grouped TAP) or via the LSDB HATS copy at NERSC.

outputs:
  # ---- Tier 1: DP0.2 ----
  - id: dp02_candidates
    type: table
    format: parquet
    description: >-
      Every DP0.2 primary object within the search radius of any DC2 SN, one
      row per (SN, object) pair, carrying the per-band CModel component radii
      and fluxes, HSM moments, extendedness and position, plus the
      object-table quality columns the candidate_quality cut reads:
      {b}_cModelFluxErr, {b}_cModel_flag, {b}_blendedness(_flag), {b}_bdChi2,
      deblend_nChild, deblend_skipped, detect_fromBlend, detect_isIsolated,
      parentObjectId and parent_nChild (deblend_nChild of the parent row,
      0 for isolated objects). DP0.2 has no deblend_tooManyPeaks or
      deblend_parentTooBig and names the CModel flag {b}_cModel_flag.
      Extracted once from the 157 tract files; everything downstream reads
      this instead of the 1 TB Object table.
    inputs: [dp02_sn_truth, dp02_object]
    decisions: [search_radius]
    recipe:
      command: python src/dp02_candidates.py --truth {inputs.dp02_sn_truth} --objects {inputs.dp02_object} --search-radius {decisions.search_radius} --workers 16 --output {output}
      resources: {cpus: 16, memory: 56Gi}
  - id: dp02_sample
    type: table
    format: parquet
    description: >-
      One row per DC2 SN in the test sample: SN position and redshift, true
      host truth id, position, mag_r and redshift, the true host's DP0.2
      objectId (per truth_match) and the SN-host separation, plus the flags
      the sample cuts were based on (missing host row, host unmatched,
      separation cut; offset_re, the offset in host half-light radii, under
      cuts=physical). Both truth matchers are always computed
      (host_objectId_mt, host_objectId_nn with match_sep_arcsec);
      host_objectId is the one truth_match selects, and the parquet metadata
      key truth_match_precut counts how the two compare before the
      matcher-dependent cut.
    inputs: [dp02_sn_truth, dp02_truth_match, dp02_candidates, dp02_host_truth_shapes]
    decisions: [truth_match, dp02_sample_cuts]
    recipe:
      command: python src/dp02_sample.py --truth {inputs.dp02_sn_truth} --match {inputs.dp02_truth_match} --candidates {inputs.dp02_candidates} --shapes {inputs.dp02_host_truth_shapes} --truth-match {decisions.truth_match} --cuts {decisions.dp02_sample_cuts} --output {output}
      resources: {cpus: 4, memory: 24Gi}
  - id: dp02_associations
    type: table
    format: parquet
    description: >-
      One row per sample SN: true host objectId, the SBW most probable host
      and its p_sbw, p_sbw of the true host and its rank, p_top (every
      candidate probability above 0.001, descending), frac_light_beyond, DLR
      host and d_dlr, d_dlr of the true host, and the derived flags
      sbw_correct (most probable host = true host), dlr_correct, agree.
      flb_max is the largest frac_light_beyond over all candidates (an
      alternative hostless statistic to flb_best, the most probable host's).
      Candidates are cut in order: search radius, extendedness_cut, no usable
      radius or flux for the profile (always dropped: an object-table
      failure, not patched), candidate_quality; n_cut_* count the candidates
      each step removed and true_host_status records which step removed the
      true host (absent / point_source / unusable / quality / kept). The
      parquet metadata carries the fraction of candidates and of true hosts
      removed by each step.
    inputs: [dp02_sample, dp02_candidates]
    decisions: [sbw_profile, band, search_radius, dlr_max, dlr_radius, extendedness_cut, candidate_quality]
    recipe:
      command: python src/dp02_associate.py --sample {inputs.dp02_sample} --candidates {inputs.dp02_candidates} --profile {decisions.sbw_profile} --band {decisions.band} --search-radius {decisions.search_radius} --dlr-max {decisions.dlr_max} --dlr-radius {decisions.dlr_radius} --extendedness {decisions.extendedness_cut} --candidate-quality {decisions.candidate_quality} --workers 16 --output {output}
      resources: {cpus: 16, memory: 40Gi}
  - id: dp02_recovery
    type: metric
    format: json
    description: >-
      SBW as a distribution: mean P_SBW(true host) over the sample (the
      expected recovery if each SN's host were drawn from the SBW
      probabilities; P = 0 where the true host is not a surviving candidate),
      with and without the hostless cut, and the fractions in the four bands
      P(true) > 0.5 / p_true_threshold..0.5 / below the threshold (excluded) /
      SBW hostless; argmax recovery (most probable host = true host) and DLR
      recovery with binomial intervals as secondary numbers; the SBW-DLR
      agreement rate, the fraction SBW declares hostless under
      sbw_hostless_cut, the 4x3 probabilistic agreement-matrix cells (and the
      old argmax 3x3), and the random-position 2x2 with the fraction each
      method correctly rejects.
    inputs: [dp02_associations, dp02_random_associations]
    decisions: [sbw_hostless_cut, p_true_threshold]
    recipe:
      command: python src/dp02_fig.py recovery --associations {inputs.dp02_associations} --random {inputs.dp02_random_associations} --hostless-cut {decisions.sbw_hostless_cut} --p-threshold {decisions.p_true_threshold} --output {output}
  - id: dp02_calibration
    type: figure
    format: pdf
    description: >-
      SBW reliability curve: SNe binned by the p_sbw of the SBW most probable
      host, against the fraction of those SNe whose most probable host is the
      true host. A calibrated probability follows the 1:1 line.
    inputs: [dp02_associations]
    decisions: []
    recipe:
      command: python src/dp02_fig.py calibration --associations {inputs.dp02_associations} --output {output}
  - id: dp02_calibration_by_band
    type: figure
    format: pdf
    description: The reliability curve recomputed in each of u g r i z y with the headline profile, one panel per band, independent of the band decision.
    inputs: [dp02_sample, dp02_candidates]
    decisions: [sbw_profile, search_radius, dlr_max, dlr_radius, extendedness_cut, candidate_quality]
    recipe:
      command: python src/dp02_sweep.py band --sample {inputs.dp02_sample} --candidates {inputs.dp02_candidates} --profile {decisions.sbw_profile} --search-radius {decisions.search_radius} --dlr-max {decisions.dlr_max} --dlr-radius {decisions.dlr_radius} --extendedness {decisions.extendedness_cut} --candidate-quality {decisions.candidate_quality} --output {output}
      resources: {cpus: 16, memory: 40Gi}
  - id: dp02_calibration_by_profile
    type: figure
    format: pdf
    description: The reliability curve recomputed for each analytic SBW form (exponential n = 1, de Vaucouleurs n = 4, moment Gaussian) in the headline band, independent of the sbw_profile decision.
    inputs: [dp02_sample, dp02_candidates]
    decisions: [band, search_radius, dlr_max, dlr_radius, extendedness_cut, candidate_quality]
    recipe:
      command: python src/dp02_sweep.py profile --sample {inputs.dp02_sample} --candidates {inputs.dp02_candidates} --band {decisions.band} --search-radius {decisions.search_radius} --dlr-max {decisions.dlr_max} --dlr-radius {decisions.dlr_radius} --extendedness {decisions.extendedness_cut} --candidate-quality {decisions.candidate_quality} --output {output}
      resources: {cpus: 16, memory: 40Gi}
  - id: dp02_agreement_matrix
    type: figure
    format: pdf
    description: >-
      Probabilistic agreement matrix: rows are the SBW probability of the
      true host, P_SBW(true) > 0.5 / in [p_true_threshold, 0.5] / below
      p_true_threshold (excluded by SBW, including a true host that is not a
      surviving candidate) / SBW hostless under sbw_hostless_cut, against DLR
      host true / wrong / hostless: counts and fractions of SNe in each cell.
      A second panel applies the same cuts to dp02_random_positions as a 2x2
      (SBW hostless = correct / assigns a host = wrong, against the same for
      DLR), so loosening the hostless cut is seen to cost random rejections;
      under each panel the real recovery with the cuts and the random
      fraction correctly rejected.
    inputs: [dp02_associations, dp02_random_associations]
    decisions: [sbw_hostless_cut, p_true_threshold]
    recipe:
      command: python src/dp02_fig.py agreement_matrix --associations {inputs.dp02_associations} --random {inputs.dp02_random_associations} --hostless-cut {decisions.sbw_hostless_cut} --p-threshold {decisions.p_true_threshold} --output {output}
  - id: dp02_agreement_vs_ddlr
    type: figure
    format: pdf
    description: Fraction of SNe where the SBW most probable host is the DLR host, with mean P_SBW(true host) and DLR recovery, as a function of the DLR host's d_DLR (and of the SBW most probable host's d_DLR).
    inputs: [dp02_associations]
    decisions: []
    recipe:
      command: python src/dp02_fig.py agreement_vs_ddlr --associations {inputs.dp02_associations} --output {output}
  - id: dp02_recovery_vs_ddlr
    type: figure
    format: pdf
    description: Mean P_SBW(true host) (with the argmax recovery dashed), DLR recovery and SBW-DLR agreement as a function of the true host's d_DLR.
    inputs: [dp02_associations]
    decisions: []
    recipe:
      command: python src/dp02_fig.py recovery_vs --x ddlr --associations {inputs.dp02_associations} --output {output}
  - id: dp02_recovery_vs_separation
    type: figure
    format: pdf
    description: Mean P_SBW(true host), argmax and DLR recovery versus transient-host angular separation.
    inputs: [dp02_associations]
    decisions: []
    recipe:
      command: python src/dp02_fig.py recovery_vs --x separation --associations {inputs.dp02_associations} --output {output}
  - id: dp02_recovery_vs_host_mag
    type: figure
    format: pdf
    description: Mean P_SBW(true host), argmax and DLR recovery versus true-host r magnitude (faint-host regime).
    inputs: [dp02_associations]
    decisions: []
    recipe:
      command: python src/dp02_fig.py recovery_vs --x host_mag --associations {inputs.dp02_associations} --output {output}
  - id: dp02_recovery_vs_redshift
    type: figure
    format: pdf
    description: Mean P_SBW(true host), argmax and DLR recovery versus SN redshift (hosts shrink and fade with z).
    inputs: [dp02_associations]
    decisions: []
    recipe:
      command: python src/dp02_fig.py recovery_vs --x redshift --associations {inputs.dp02_associations} --output {output}
  - id: dp02_p_true_host
    type: figure
    format: pdf
    description: Distribution of the p_sbw assigned to the true host (log scale), split by whether SBW ranked it first; shows how confident the failures are.
    inputs: [dp02_associations]
    decisions: []
    recipe:
      command: python src/dp02_fig.py p_true_host --associations {inputs.dp02_associations} --output {output}
  - id: dp02_band_dependence
    type: figure
    format: pdf
    description: Mean P_SBW(true host), argmax and DLR recovery and SBW-DLR agreement per band (u g r i z y), and how often the SBW most probable host changes between bands.
    inputs: [dp02_sample, dp02_candidates]
    decisions: [sbw_profile, search_radius, dlr_max, dlr_radius, extendedness_cut, candidate_quality]
    recipe:
      command: python src/dp02_sweep.py band_dependence --sample {inputs.dp02_sample} --candidates {inputs.dp02_candidates} --profile {decisions.sbw_profile} --search-radius {decisions.search_radius} --dlr-max {decisions.dlr_max} --dlr-radius {decisions.dlr_radius} --extendedness {decisions.extendedness_cut} --candidate-quality {decisions.candidate_quality} --output {output}
      resources: {cpus: 16, memory: 40Gi}
  - id: dp02_profile_sweep
    type: table
    format: csv
    description: >-
      Mean P_SBW(true host), argmax recovery, DLR agreement and calibration error for every
      analytic SBW form (exponential n = 1, de Vaucouleurs n = 4, moment Gaussian)
      side by side, independent of the headline sbw_profile choice. The stamp
      form joins once dp02_deblended_stamps exists.
    inputs: [dp02_sample, dp02_candidates]
    decisions: [band, search_radius, dlr_max, dlr_radius, extendedness_cut, candidate_quality]
    recipe:
      command: python src/dp02_sweep.py profile_table --sample {inputs.dp02_sample} --candidates {inputs.dp02_candidates} --band {decisions.band} --search-radius {decisions.search_radius} --dlr-max {decisions.dlr_max} --dlr-radius {decisions.dlr_radius} --extendedness {decisions.extendedness_cut} --candidate-quality {decisions.candidate_quality} --output {output}
      resources: {cpus: 16, memory: 40Gi}
  - id: dp02_random_positions
    type: table
    format: parquet
    description: >-
      One random sky position per DC2 truth SN, uniform on the sphere within
      the SN's tract (RA uniform, sin dec uniform inside the bounding box of the
      tract's primary DP0.2 objects, redrawn unless a 1 arcmin cell there holds
      a primary object, so edge-tract corners outside the footprint are
      excluded). sn_id is the negated truth SN id; seeded.
    inputs: [dp02_sn_truth, dp02_object]
    decisions: []
    recipe:
      command: python src/dp02_random_positions.py --truth {inputs.dp02_sn_truth} --objects {inputs.dp02_object} --output {output}
      resources: {cpus: 16, memory: 40Gi}
  - id: dp02_random_candidates
    type: table
    format: parquet
    description: The dp02_candidates extraction run on dp02_random_positions instead of the truth SNe.
    inputs: [dp02_random_positions, dp02_object]
    decisions: [search_radius]
    recipe:
      command: python src/dp02_candidates.py --positions {inputs.dp02_random_positions} --objects {inputs.dp02_object} --search-radius {decisions.search_radius} --workers 16 --output {output}
      resources: {cpus: 16, memory: 56Gi}
  - id: dp02_random_associations
    type: table
    format: parquet
    description: SBW and DLR association of every random position, with the same columns and candidate cuts as dp02_associations and no true host (host_objectId = -1).
    inputs: [dp02_random_positions, dp02_random_candidates]
    decisions: [sbw_profile, band, search_radius, dlr_max, dlr_radius, extendedness_cut, candidate_quality]
    recipe:
      command: python src/dp02_associate.py --positions {inputs.dp02_random_positions} --candidates {inputs.dp02_random_candidates} --profile {decisions.sbw_profile} --band {decisions.band} --search-radius {decisions.search_radius} --dlr-max {decisions.dlr_max} --dlr-radius {decisions.dlr_radius} --extendedness {decisions.extendedness_cut} --candidate-quality {decisions.candidate_quality} --output {output}
      resources: {cpus: 16, memory: 40Gi}
  - id: dp02_hostless_indicator
    type: figure
    format: pdf
    description: >-
      Hostless indicators, real SNe versus random positions: (a) flb_best
      distributions (real SBW-correct, real SBW-wrong, random); (b) fraction
      rejected versus threshold for flb_best < t; (c) the same for the DLR rule
      d_DLR_min > t; (d) random positions rejected versus real SNe kept for
      SBW (flb_best, flb_max) and DLR, with the sbw_hostless_cut and dlr_max
      operating points marked, and the frozen DP0.2 baseline J optima (flb_best
      0.0215, d_DLR 2.7) as open diamonds. Panels (b) and (c) also carry
      Youden's J = real kept + random rejected - 1 versus the threshold, with
      its maximum.
    inputs: [dp02_associations, dp02_random_associations]
    decisions: [sbw_hostless_cut, dlr_max]
    recipe:
      command: python src/dp02_fig.py hostless_indicator --associations {inputs.dp02_associations} --random {inputs.dp02_random_associations} --hostless-cut {decisions.sbw_hostless_cut} --dlr-max {decisions.dlr_max} --output {output}
  - id: dp02_hostless_metrics
    type: metric
    format: json
    description: Real SNe kept and random positions rejected at flb_best and flb_max thresholds 0.001, 0.01, 0.05, 0.1 and d_DLR thresholds 3, 4, 5 (Wilson intervals), the fraction of random positions whose SBW most probable host has P > 0.5 (landing on a galaxy), and the Youden-J-optimal flb_best, flb_max and d_DLR thresholds with J, real kept and random rejected there; dp02_optima_transfer gives real kept, random rejected and J at flb_best 0.01, 0.0215 and 0.05 and at d_DLR 2.7 and 4 (0.0215 and 2.7 are the baseline J optima of 27 Oct 2026, frozen in src/dp02_fig.py) and the J lost against this table's own optimum, so every tier is scored at the DP0.2 thresholds.
    inputs: [dp02_associations, dp02_random_associations]
    decisions: []
    recipe:
      command: python src/dp02_fig.py hostless_metrics --associations {inputs.dp02_associations} --random {inputs.dp02_random_associations} --output {output}
  - id: dp02_host_truth_shapes
    type: table
    format: parquet
    description: >-
      cosmoDC2 truth shape, B/T, stellar masses and true magnitudes of every
      DC2 SN host galaxy (one row per galaxy_id), read from the healpix files
      row group by row group, galaxy_id first and the other columns only where
      a host is.
    inputs: [dp02_sn_truth, cosmodc2_hosts]
    decisions: []
    recipe:
      command: python src/dp02_host_shapes.py --truth {inputs.dp02_sn_truth} --cosmodc2 {inputs.cosmodc2_hosts} --workers 16 --output {output}
      resources: {cpus: 16, memory: 56Gi}
  - id: dp02_offset_diagnostic
    type: figure
    format: pdf
    description: >-
      SBW top host wrong, DLR host wrong or none, both wrong on the same object,
      and SBW hostless fractions versus the SN's offset from its truth host in
      units of the host's truth half-light semi-major axis, measured along the
      truth ellipse, for the bulge R_e, the disk R_e and the dominant
      component's R_e, split into bulge-dominated (B/T_i > 0.5) and
      disk-dominated hosts, with the offset distributions of both classes. The
      both-wrong upturn sets N of the physical sample cut.
    inputs: [dp02_associations, dp02_host_truth_shapes]
    decisions: [sbw_hostless_cut]
    recipe:
      command: python src/dp02_offsets.py --associations {inputs.dp02_associations} --shapes {inputs.dp02_host_truth_shapes} --hostless-cut {decisions.sbw_hostless_cut} --output {output}
  - id: dp02_truth_match_comparison
    type: metric
    format: json
    description: >-
      The two truth matchers side by side: how many SNe get a host under one
      matcher but not the other and how many get a different host objectId
      (before the matcher-dependent sample cut and within the sample), SBW and
      DLR recovery restricted to SNe where the matchers agree and where they
      differ, and the 3x3 agreement-matrix cells against each truth on the SNe
      both matchers resolve.
    inputs: [dp02_sample, dp02_associations]
    decisions: [sbw_hostless_cut]
    recipe:
      command: python src/dp02_truth_match.py --sample {inputs.dp02_sample} --associations {inputs.dp02_associations} --hostless-cut {decisions.sbw_hostless_cut} --output {output}
  - id: dp02_disagreement_cases
    type: table
    format: csv
    description: >-
      Twelve seeded random SNe per class for the cutout gallery:
      truth_matchers_disagree (MatchesTruth and nearest-within-1-arcsec name
      different objects), sbw_excludes_true_host (true host survived the cuts
      but P_SBW(true) < p_true_threshold), dlr_wrong_or_hostless,
      sbw_most_probable_ne_dlr (SBW most probable host differs from the DLR
      host) and true_host_cut_by_object_table (cat2: point source, unusable
      radius or flux, or candidate_quality).
      Columns case_id, class, class_n (size of the class), sn_id, sn_ra,
      sn_dec, label, marker positions truth_pos (host truth position),
      truth_match, truth_nearest, sbw, dlr (_ra/_dec, NaN where absent),
      p_sbw_max, p_sbw_true, true_host_status, d_dlr_min, sep_truth_arcsec
      and the objectIds. Both matchers
      come from the one sample (dp02_sample always carries both), so a single
      universe's associations suffice.
    inputs: [dp02_associations, dp02_candidates]
    decisions: [p_true_threshold]
    recipe:
      command: python src/dp02_cases.py --associations {inputs.dp02_associations} --candidates {inputs.dp02_candidates} --p-threshold {decisions.p_true_threshold} --output {output}
      resources: {cpus: 4, memory: 24Gi}
  - id: dp02_disagreement_gallery
    type: figure
    format: pdf
    description: >-
      DP0.2 deep-coadd cutouts (30 arcsec, headline band, north up, east left)
      of dp02_disagreement_cases, one page per class, with markers for the SN,
      the host truth position, both truth matchers' objects, the SBW most
      probable host and the DLR host. Made with src/dp02_gallery.py (the
      cutout prototype's gallery.py, with the SBW marker relabelled "SBW most
      probable") over the RSP cutout service, from a NERSC compute node with
      the rsp_token on NERSC.
    inputs: [dp02_disagreement_cases, rsp_token]
    decisions: [band]
    recipe:
      command: bash -c 'T=$TMPDIR; [ -n "$T" ] || T=/tmp; python src/dp02_gallery.py {inputs.dp02_disagreement_cases} --output {output} --band {decisions.band} --size 30 --ncol 4 --per-page 12 --token-file {inputs.rsp_token} --cache-dir "$T/dp02_cutouts"'
  - id: dp02_miss_accounting
    type: metric
    format: json
    description: >-
      Where the true host is lost, per method, over every hosted SN that
      passed the sample cut's distance and host-row conditions (including the
      SNe dropped because their true host has no DP0.2 object), in four
      sequential categories, each counted only on the SNe that passed the
      previous one: cat1 true host absent from the catalogue (no DP0.2 object
      under truth_match, or not a primary object within the search radius);
      cat2 true host removed by object-table cuts, split into point source
      (extendedness_cut), unusable measurements (no usable radius or flux for
      the profile; for DLR also no DLR ellipse) and failed
      candidate_quality; cat3 removed by the no-host cut (SBW: no SBW host or
      flb_best < sbw_hostless_cut; DLR: no candidate with d_DLR <= dlr_max);
      cat4 genuine association failure (a host is assigned but P_SBW(true)
      < p_true_threshold; DLR assigns another, closer candidate); else
      success. Counts, fractions of all hosted SNe and conditional fractions
      (of the SNe that entered the stage) with Wilson 68% intervals for the
      headline association, and the same recomputed in-process for every
      candidate_quality level (none, basic, strict) with the fraction of
      candidates each cut removes.
    inputs: [dp02_sample, dp02_associations, dp02_candidates]
    decisions: [sbw_profile, band, search_radius, dlr_max, dlr_radius, extendedness_cut, sbw_hostless_cut, p_true_threshold]
    recipe:
      command: python src/dp02_miss.py compute --sample {inputs.dp02_sample} --associations {inputs.dp02_associations} --candidates {inputs.dp02_candidates} --profile {decisions.sbw_profile} --band {decisions.band} --search-radius {decisions.search_radius} --dlr-max {decisions.dlr_max} --dlr-radius {decisions.dlr_radius} --extendedness {decisions.extendedness_cut} --hostless-cut {decisions.sbw_hostless_cut} --p-threshold {decisions.p_true_threshold} --tier dp02 --workers 16 --output {output}
      resources: {cpus: 16, memory: 40Gi}
  - id: dp02_miss_accounting_fig
    type: figure
    format: pdf
    description: >-
      (a) Stacked bars of success, cat4 (genuine failure), cat3 (no-host
      cut), cat2 (object-table cut) and cat1 (absent from the catalogue) for
      SBW and DLR side by side, as fractions of all hosted SNe; (b) the
      conditional loss at each stage (of the SNe that reached it) for both
      methods; (c) the cat2, cat3 and cat4 fractions of both methods as
      candidate_quality tightens (none, basic, strict). Drawn from
      dp02_miss_accounting.
    inputs: [dp02_miss_accounting]
    decisions: []
    recipe:
      command: python src/dp02_miss.py figure --accounting {inputs.dp02_miss_accounting} --output {output}
  - id: dp02_credible_set
    type: figure
    format: pdf
    description: >-
      SBW credible sets: for t from 0.001 to 0.5 (log grid), the fraction of
      SNe whose true host is in the set of surviving candidates with
      P_SBW > t, versus t and versus the mean set size, over all SNe and
      over SNe whose true host survived the object-table cuts; t = 0.01 and
      0.05 marked, the knee of coverage versus size, and the coverage of the
      top-k sets for k = 1, 2, 3.
    inputs: [dp02_associations]
    decisions: []
    recipe:
      command: python src/dp02_fig.py credible_set --associations {inputs.dp02_associations} --output {output}
  - id: dp02_credible_set_metrics
    type: metric
    format: json
    description: The dp02_credible_set curve (coverage, coverage given a surviving true host, mean set size, empty-set fraction per t), its values at t = 0.01, 0.034 and 0.05, the knee (grid point farthest from the chord of coverage versus mean set size, axes scaled to [0, 1]) and the top-k coverages; dp02_knee_transfer compares the coverage and size at the frozen DP0.2 baseline knee t = 0.034 with this table's own knee.
    inputs: [dp02_associations]
    decisions: []
    recipe:
      command: python src/dp02_fig.py credible_set_metrics --associations {inputs.dp02_associations} --output {output}
  - id: dp02_pa_mirror
    type: figure
    format: pdf
    description: >-
      The DC2 position-angle mirror. Left: for elongated hosts (axis ratio
      < 0.5 in both the cosmoDC2 truth of the dominant component and the
      DP0.2 PSF-subtracted moments) with the SN beyond 1 R_e, the SN offset
      angle (East of North, from the host truth position) relative to the
      pipeline moment PA of the matched host, to its mirror image (-PA), and
      to the cosmoDC2 position_angle_true. DC2 placed the SNe along
      +position_angle_true while the rendered galaxies, as the pipeline
      measures them, have PA = -position_angle_true, so the SNe line up with
      the mirror of the measured galaxy and not with the galaxy itself.
      Right: six deepCoadd cutouts (headline band, north up, east left) of
      large elongated hosts whose two PAs differ by more than 60 degrees and
      whose SN lies within 15 degrees of +PA at 1.3-3.5 R_e, with the cosmoDC2
      ellipse (+PA, 2 R_e) and the pipeline moment ellipse (2 half-light
      radii) drawn. Baseline (27 Oct 2026): 7,664 elongated hosts; mean
      cos 2(psi - PA) is -0.002 against the moment PA, 0.326 against its
      mirror and 0.335 against the cosmoDC2 PA, and the median
      |PA_mom + PA_cosmoDC2| is 1.3 degrees (|PA_mom - PA_cosmoDC2| 44.4).
      No paper documents this; it is recorded in AGENTS.md as a
      prior-insight-like note. Offset-shape analyses must use +PA; the
      association itself, which sees only the rendered image, is unaffected.
      Page 2 asks whether the SNe sit on the mirrored ellipse at the truth
      radii or on a smaller or rounder one, for every host with truth q <
      0.5 and no offset cap: (a) SN radius in units of the semi-major R_e for
      SNe within 30 degrees of the +PA major axis and of the minor axis, (b)
      the same in elliptical radius on the truth ellipse, (c) measured
      (moment and CModel) over cosmoDC2 half-light sizes, (d) the axis ratio
      of the stacked SN distribution about +PA versus the truth q, with q and
      q^0.4 drawn. Numbers in dp02_pa_mirror_metrics.
    inputs: [dp02_sample, dp02_associations, dp02_candidates, dp02_host_truth_shapes, rsp_token]
    decisions: [band]
    recipe:
      command: bash -c 'T=$TMPDIR; [ -n "$T" ] || T=/tmp; python src/dp02_pa_mirror.py --sample {inputs.dp02_sample} --associations {inputs.dp02_associations} --candidates {inputs.dp02_candidates} --shapes {inputs.dp02_host_truth_shapes} --band {decisions.band} --token-file {inputs.rsp_token} --cache-dir "$T/dp02_cutouts" --output {output}'
      resources: {cpus: 4, memory: 24Gi}
  - id: dp02_pa_mirror_metrics
    type: metric
    format: json
    description: >-
      The dp02_pa_mirror numbers without the cutouts: the angle statistics of
      the elongated-host selection; radii (hosts with truth q < 0.5, no
      offset cap): quantiles of the SN radius over the semi-major R_e and of
      the elliptical radius on the truth ellipse for SNe within 30 degrees
      of the +PA major and minor axes, and their minor/major median ratios,
      also for the subset whose 6 R_e lies inside the sample's separation
      cut; measured over cosmoDC2 sizes (moment half-light semi-axes over the
      truth semi-axes, q_mom / q_true, CModel sqrt(ab) of the dominant
      component over the truth sqrt(ab)); the SN distribution's axis ratio
      per truth-q bin with the exponent alpha of q_SN = q^alpha; and the
      example selection rule with the offsets of the chosen and of all
      eligible hosts, so the figure's selection can be judged.
    inputs: [dp02_sample, dp02_associations, dp02_candidates, dp02_host_truth_shapes]
    decisions: [band]
    recipe:
      command: python src/dp02_pa_mirror.py --metrics --sample {inputs.dp02_sample} --associations {inputs.dp02_associations} --candidates {inputs.dp02_candidates} --shapes {inputs.dp02_host_truth_shapes} --band {decisions.band} --output {output}
      resources: {cpus: 4, memory: 24Gi}
  # ---- Tier 1b: OpenUniverse2024 (mirrors the DP0.2 chain; same scripts where only the inputs differ) ----
  - id: ou24_sn_table
    type: table
    format: parquet
    description: >-
      One row per OU2024 transient within 60 arcsec of a primary object of the
      22 tracts (its tract is that object's): skyCatalog id, position, z_CMB
      and class, the SNANA truth (GALID = true host id, GALSNSEP, GALSNDDLR,
      a_rot, HOSTGAL_*), and the true host's skyCatalog truth: position,
      redshift, ugrizy AB magnitudes, bulge and disk half-light radii (sqrt(ab),
      arcsec), axis ratios and major-axis angles (host_beta_*, from +x West
      toward North, equal to SNANA's a_rot), r- and i-band bulge/disk/knot light
      fractions (host_bt_i = bulge fraction) and stellar mass. Flags hostless,
      host_missing (host not in the galaxy files), skycat_host_missing.
    inputs: [ou24_sn_truth, ou24_host_truth, ou24_object]
    decisions: []
    recipe:
      command: python src/ou24_sn_table.py --truth-index {inputs.ou24_sn_truth} --galaxy-index {inputs.ou24_host_truth} --objects {inputs.ou24_object} --coverage-radius 60 --component-bands ri --workers 16 --output {output}
      resources: {cpus: 16, memory: 56Gi}
  - id: ou24_truth_match
    type: table
    format: parquet
    description: >-
      Hand-built truth-to-object match for every OU2024 true host (no
      MatchesTruth table exists for OU2024): all primary objects within 1
      arcsec of the skyCatalog host position; nearest_* is the closest, mag_*
      the one with |m_r(cModel) - m_r(truth)| < 1 and the lowest chi2 =
      (sep / 0.1")^2 + (dm / 0.2)^2. Carries n_within, multiple, no_match,
      matchers_agree and the nearest object's r-band moments, CModel radii,
      extendedness and deblend parent.
    inputs: [ou24_sn_table, ou24_object]
    decisions: []
    recipe:
      command: python src/ou24_truth_match.py --sn-table {inputs.ou24_sn_table} --objects {inputs.ou24_object} --match-radius 1.0 --max-dmag 1.0 --pos-sigma 0.1 --mag-sigma 0.2 --workers 16 --output {output}
      resources: {cpus: 16, memory: 40Gi}
  - id: ou24_candidates
    type: table
    format: parquet
    description: Every primary OU2024 object within the search radius of any transient of ou24_sn_table, one row per (transient, object) pair, with the dp02_candidates columns (src/dp02_candidates.py unchanged).
    inputs: [ou24_sn_table, ou24_object]
    decisions: [search_radius]
    recipe:
      command: python src/dp02_candidates.py --positions {inputs.ou24_sn_table} --objects {inputs.ou24_object} --search-radius {decisions.search_radius} --output {output}
      resources: {cpus: 16, memory: 56Gi}
  - id: ou24_sample
    type: table
    format: parquet
    description: >-
      One row per OU2024 transient in the test sample, with the dp02_sample
      columns: transient and true-host truth, host_objectId under truth_match
      (matches_truth = the magnitude-aware match, nearest_1arcsec = the
      nearest; both always carried as host_objectId_mt / _nn), the cut flags,
      and the elliptical offsets in skyCatalog half-light radii
      (offset_re_bulge, offset_re_disk, offset_re of the dominant component by
      B/T_i, bulge_dominated). FIXMAG sources peak after the survey and are
      always dropped. All redshifts are kept (median z 1.5; DP0.2 has only
      z < 1), so z < 1 splits are reported alongside.
    inputs: [ou24_sn_table, ou24_truth_match]
    decisions: [truth_match, dp02_sample_cuts]
    recipe:
      command: python src/ou24_sample.py --sn-table {inputs.ou24_sn_table} --match {inputs.ou24_truth_match} --truth-match {decisions.truth_match} --cuts {decisions.dp02_sample_cuts} --output {output}
      resources: {cpus: 4, memory: 24Gi}
  - id: ou24_associations
    type: table
    format: parquet
    description: As dp02_associations for the OU2024 sample. A candidate whose CModel radius is missing is dropped from SBW (no radius fallback).
    inputs: [ou24_sample, ou24_candidates]
    decisions: [sbw_profile, band, search_radius, dlr_max, dlr_radius, extendedness_cut, candidate_quality]
    recipe:
      command: python src/dp02_associate.py --sample {inputs.ou24_sample} --candidates {inputs.ou24_candidates} --profile {decisions.sbw_profile} --band {decisions.band} --search-radius {decisions.search_radius} --dlr-max {decisions.dlr_max} --dlr-radius {decisions.dlr_radius} --extendedness {decisions.extendedness_cut} --candidate-quality {decisions.candidate_quality} --workers 16 --output {output}
      resources: {cpus: 16, memory: 40Gi}
  - id: ou24_random_positions
    type: table
    format: parquet
    description: As dp02_random_positions, one random position per ou24_sn_table transient inside its tract, drawn over the union of the tract's objectTable files (sn_id negated).
    inputs: [ou24_sn_table, ou24_object]
    decisions: []
    recipe:
      command: python src/dp02_random_positions.py --sne {inputs.ou24_sn_table} --objects {inputs.ou24_object} --output {output}
      resources: {cpus: 16, memory: 40Gi}
  - id: ou24_random_candidates
    type: table
    format: parquet
    description: The ou24_candidates extraction run on ou24_random_positions.
    inputs: [ou24_random_positions, ou24_object]
    decisions: [search_radius]
    recipe:
      command: python src/dp02_candidates.py --positions {inputs.ou24_random_positions} --objects {inputs.ou24_object} --search-radius {decisions.search_radius} --output {output}
      resources: {cpus: 16, memory: 56Gi}
  - id: ou24_random_associations
    type: table
    format: parquet
    description: SBW and DLR association of every OU2024 random position (host_objectId = -1).
    inputs: [ou24_random_positions, ou24_random_candidates]
    decisions: [sbw_profile, band, search_radius, dlr_max, dlr_radius, extendedness_cut, candidate_quality]
    recipe:
      command: python src/dp02_associate.py --positions {inputs.ou24_random_positions} --candidates {inputs.ou24_random_candidates} --profile {decisions.sbw_profile} --band {decisions.band} --search-radius {decisions.search_radius} --dlr-max {decisions.dlr_max} --dlr-radius {decisions.dlr_radius} --extendedness {decisions.extendedness_cut} --candidate-quality {decisions.candidate_quality} --workers 16 --output {output}
      resources: {cpus: 16, memory: 40Gi}
  - id: ou24_recovery
    type: metric
    format: json
    description: As dp02_recovery for OU2024 (mean P_SBW(true host), the four P bands, argmax and DLR recovery as secondary numbers, the 4x3 matrix cells and the random 2x2), population-averaged over OU2024's too-faint host population; see ou24_recovery_by_host_mag.
    inputs: [ou24_associations, ou24_random_associations]
    decisions: [sbw_hostless_cut, p_true_threshold]
    recipe:
