    decisions: [sbw_hostless_cut, dlr_max, p_true_threshold]
    recipe:
      command: python src/dp02_fig.py hostless_indicator --tier dp02 --dp02-hostless-metrics own --associations {inputs.dp02_associations} --random {inputs.dp02_random_associations} --hostless-cut {decisions.sbw_hostless_cut} --dlr-max {decisions.dlr_max} --p-threshold {decisions.p_true_threshold} --output {output}
  - id: dp02_hostless_metrics
    type: metric
    format: json
    description: >-
      Real SNe (rung 4) kept and random positions rejected at flb_best and
      flb_max thresholds 0.001, 0.01, 0.05, 0.1 and d_DLR thresholds 3, 4, 5
      (Wilson intervals), the fraction of random positions whose SBW most
      probable host has P > 0.5 (landing on a galaxy), the Youden-J-optimal
      flb_best, flb_max and d_DLR thresholds with J, real kept and random
      rejected there, and the full ROC sweeps (curves, for
      hostless_roc_tiers); dp02_optima_transfer gives real kept, random
      rejected and J at flb_best 0.01, the DP0.2 J optimum and 0.05 and at
      d_DLR the DP0.2 J optimum and 4, and the J lost against this table's
      own optimum. Since 2 Nov 2026 the DP0.2 optima are this universe's own
      (the DP0.2 tier scores itself with the flag value own; the other tiers
      read dp02_hostless_metrics of the same universe), not frozen constants. Real SNe on rung 4 of the sample ladder (n_real; n_sample is rung 2).
    inputs: [dp02_associations, dp02_random_associations]
    decisions: [p_true_threshold]
    recipe:
      command: python src/dp02_fig.py hostless_metrics --tier dp02 --dp02-hostless-metrics own --associations {inputs.dp02_associations} --random {inputs.dp02_random_associations} --p-threshold {decisions.p_true_threshold} --output {output}
  - id: dp02_host_truth_shapes
