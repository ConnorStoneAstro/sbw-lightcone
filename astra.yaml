      resources: {cpus: 16, memory: 40Gi}
  - id: dp02_hostless_indicator
    type: figure
    format: pdf
    description: >-
      Hostless indicators, real SNe versus random positions: (a) flb_best
      distributions (real SBW-correct, real SBW-wrong, random); (b) fraction
      rejected versus threshold for flb_best < t; (c) the same for the DLR rule
      d_DLR_min > t; (d) random positions rejected versus real SNe kept for
      SBW (flb_best, flb_max) and DLR, with the sbw_hostless_cut and dlr_max
      operating points marked, and the frozen DP0.2 baseline J optima (flb_best
      0.0215, d_DLR 2.7) as open diamonds. Panels (b) and (c) also carry
