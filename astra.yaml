  ou2024_lsst_pipeline_w_2024_22:
    claim: The OpenUniverse2024 LSST imaging was processed with the LSST Science Pipelines at weekly w_2024_22
      (close to v27), through the same steps as DC2 (coadds, multiband detection, deblending, measurement,
      merging into a six-band Object catalogue). OU2024 therefore offers the DP0.2 data products from a later
