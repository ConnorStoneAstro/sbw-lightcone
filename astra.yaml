  ou2024_static_flux_throughput_version:
    claim: OpenUniverse2024 galaxy (static) fluxes were computed with LSST throughputs v1.7 while transient
      fluxes used v1.9, so the skyCatalog galaxy magnitudes carry a small bandpass inconsistency; truth host
      magnitudes (and a magnitude-aware truth match) inherit it, which is why the match allows 1 mag.
