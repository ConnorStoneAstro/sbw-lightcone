  # ---- Tier 2: DES ----
  - id: des_sample
    type: table
    format: parquet
    description: >-
      The 1,623 DES-SN5YR Dovekie SNe Ia (IDSURVEY = 10), one row each: sn_id (CID), sn_ra, sn_dec (HEAD
      file), sn_redshift (zHD), field, and the published host (HOSTGAL) and second host (HOSTGAL2): position,
      DES-SN objid, separation, published d_DLR and r magnitude, and host_objectId / host2_objectId, the DES DR2
      object matched to the published position under reference_match (any object, whatever its star/galaxy
      class; -1 if none, then the published host counts as absent), with host_extended_class_coadd. The
      published host is the DES-SN DLR assignment on deep SN-field coadds (visually vetted), a DLR-derived
      reference and not truth: every DES "recovery" is agreement with that reference.
    inputs: [des_sn5yr_hosts, des_dr2_objects]
    decisions: [reference_match]
    recipe:
      command: python src/des_sample.py --hosts {inputs.des_sn5yr_hosts} --objects {inputs.des_dr2_objects} --reference-match {decisions.reference_match} --record-decisions --output {output}
  - id: des_candidates
    type: table
    format: parquet
    description: >-
      Every DES DR2 object within the search radius of each des_sample SN, one row per (SN, object) pair, cut
      from the 2' des_dr2_objects cache and rewritten into the DP0.2 candidate schema by src/des_lib.py:
      objectId (coadd_object_id), coord_ra/dec, sep_arcsec, refExtendedness (1 for extended_class_coadd >= 2,
      0 for stars and candidate stars, NaN for -9), the detection-image A, B, THETA_J2000 (also as
      {b}_ixx/iyy/ixy in arcsec^2, zero PSF moments), and per band (grizy) flux_auto and its error in nJy (as
      cModelFlux / cModelFluxErr), flux_radius, mag_auto, class_star, spread_model, flags and imaflags_iso
      (cModel_flag = flags >= 4 or imaflags_iso > 0); DR2 has no deblend parents or blendedness.
    inputs: [des_sample, des_dr2_objects]
    decisions: [search_radius]
    recipe:
      command: python src/des_candidates.py --positions {inputs.des_sample} --sample {inputs.des_sample} --objects {inputs.des_dr2_objects} --search-radius {decisions.search_radius} --output {output}
  - id: des_associations
    type: table
    format: parquet
    description: >-
      One row per DES SN with the dp02_associations columns, the published host in place of the true host
      (host_objectId, so dlr_correct / p_sbw_true / true_host_status refer to the published host)
      and the des_sample columns. Light models on DES DR2 (src/des_lib.py): exponential = n = 1 and sersic =
      n = 4 on the band's FLUX_RADIUS (circular half-light radius, PSF included) as the determinant radius of
      the A/B, THETA ellipse with flux_auto (DR2 has no Sersic fit); moments = a Gaussian with the A, B rms
      ellipse. DLR moments = A, B, THETA (the DES-SN definition, not PSF-subtracted); half_light = the band's
      FLUX_RADIUS ellipse.
    inputs: [des_sample, des_candidates]
    decisions: [sbw_profile, band, search_radius, dlr_max, dlr_radius, extendedness_cut, candidate_quality]
    recipe:
      command: python src/des_run.py associate --sample {inputs.des_sample} --candidates {inputs.des_candidates} --profile {decisions.sbw_profile} --band {decisions.band} --search-radius {decisions.search_radius} --dlr-max {decisions.dlr_max} --dlr-radius {decisions.dlr_radius} --extendedness {decisions.extendedness_cut} --candidate-quality {decisions.candidate_quality} --workers 8 --output {output}
      resources: {cpus: 8, memory: 8Gi}
  - id: des_recovery
    type: metric
    format: json
    description: >-
      Agreement of SBW and DLR with the published DES-SN host (a DLR-derived reference, not truth), with
      Wilson 68% intervals: the dp02_recovery keys (mean P_SBW of the published host, the P-band matrix rows
      P_SBW(published) > 0.5 / t-0.5 / < t / SBW hostless against DLR = published / != published / hostless,
      the random-position 2x2) plus agreement_with_published (SBW: P_SBW(published) >= t), the matrix as fractions with
      intervals, the HOSTGAL2 agreement (either host counts), where the published host stands in the candidate
      cuts and its DR2 class, the published versus our d_DLR, a split of the SBW disagreements, and per band
      and light model agreement from des_association_sweep.
    inputs: [des_associations, des_random_associations, des_sample, des_association_sweep, dp02_lib_script]
    decisions: [sbw_hostless_cut, p_true_threshold]
    recipe:
      command: python src/des_run.py recovery --associations {inputs.des_associations} --random {inputs.des_random_associations} --sample {inputs.des_sample} --sweep {inputs.des_association_sweep} --hostless-cut {decisions.sbw_hostless_cut} --p-threshold {decisions.p_true_threshold} --output {output}
  - id: des_agreement_vs_ddlr
    type: figure
    format: pdf
    description: dp02_agreement_vs_ddlr on DES against the published host - SBW-DLR agreement (the DLR host in SBW's credible set), mean P_SBW of the published host and DLR = published versus d_DLR of the published host and of the DLR host.
    inputs: [des_associations]
    decisions: [p_true_threshold]
    recipe:
      command: python src/des_run.py fig agreement_vs_ddlr --tier des --associations {inputs.des_associations} --p-threshold {decisions.p_true_threshold} --output {output}
  - id: des_disagreement_gallery
    type: figure
    format: pdf
    description: >-
      DES DR2 coadd cutouts (30 arcsec, headline band, north up, east left; NOIRLab Data Lab SIA des_dr2) of
      des_disagreement_cases, one page per class, with the SBW most probable host and its half-light ellipse
      (solid), the DLR host and its DLR ellipse (dashed), both at 4 x their axes, the published DES-SN host
      position (black diamond), and the other members of SBW's credible set (every candidate with P_SBW >= p_true_threshold other than the most probable one, which keeps its solid marker) drawn in the SBW style with transparency, each with its P; src/des_gallery.py, throttled, cached under $TMPDIR.
    inputs: [des_disagreement_cases, dp02_gallery_script]
    decisions: [band]
    recipe:
