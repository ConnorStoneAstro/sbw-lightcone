  # ---- Tier 4: DP2 ----
  - id: dp2_sample
    type: table
    format: parquet
    description: >-
      The 690 DP2 transients of RC_sample.parquet (rc_salt: a successful SALT3
      fit, R. Chen, 8 Oct 2026), the real-data tier's sample, one row each:
      sn_id (the DiaObject id), sn_ra, sn_dec, host_objectId = -1 (no truth)
      and the light-curve fit columns the file carries (SALT3 z, x1, c, mB,
      FITPROB, MWEBV, PKMJD, S/N summaries and Mi Dai's overlap flags).
      src/dp2_sample.py refuses to run if the file's size or mtime no longer
      match data/dp2_sn_candidates_index.csv. The sample is fixed (4 Nov 2026;
      until then the decision dp2_sample chose between this and the DDF
      ParSNIP sets, each in its own universe): the DDF ParSNIP transients
      that DELIGHT covers are the separate dp2_ddf_sample chain.
    inputs: [dp2_transients]
    decisions: []
    recipe:
      command: python src/dp2_sample.py --index {inputs.dp2_transients} --sample rc_salt --record-decisions --output {output}
  - id: dp2_candidates
    type: table
    format: parquet
    description: >-
      Every DP2 Object (all rows are primary) within the search radius of any
      dp2_sample transient, one row per (transient, object) pair, read from
      the HATS object_collection by bounding-box partition lookup (whole
      neighbouring partitions, so no margin cache is involved). Columns:
      position, sep_arcsec, refExtendedness, tract, patch, parentObjectId,
      parent_nChild (deblend_parentNChild), deblend_blendNChild,
      detect_fromBlend, detect_isIsolated, shape_xx/yy/xy and shape_flag,
      both MultiProFit fits (exponential_* and sersic_*: ra, dec, reff_x,
      reff_y, rho, chi2_reduced, unknown_flag, no_data_flag, sersic_index,
      exponential_delta_lnL_fit_ps) and per band exponentialFlux(Err),
      sersicFlux(Err), cModelFlux(Err), cModel_flag, blendedness, the HSM
      source and PSF moments ixx/iyy/ixy(PSF) and extendedness, i.e. the DP2
      names of every column the DP0.2 candidate_quality cuts read. The
      candidate catalogue is fixed to the DP2 Object table (4 Nov 2026; the
      Legacy DR10 Tractor alternative and its universes were dropped).
    inputs: [dp2_sample, dp2_object]
    decisions: [search_radius]
    recipe:
      command: python src/dp2_candidates.py --positions {inputs.dp2_sample} --objects {inputs.dp2_object} --search-radius {decisions.search_radius} --workers 16 --record-decisions --output {output}
      resources: {cpus: 16, memory: 56Gi}
  - id: dp2_associations
    type: table
    format: parquet
    description: >-
      One row per DP2 transient with the same columns as dp02_associations
      (SBW most probable host, p_sbw_max, flb_best, flb_max, the P_SBW list
      p_top, d_DLR of the SBW host, the DLR host and d_DLR_min, candidate
      counts per cut) plus p_sbw_dlr, the SBW probability of the DLR host;
      truth columns are empty. Made by src/dp02_associate.py --tier dp2, which
      swaps in src/dp2_lib.py: sbw_profile exponential / sersic use the
      MultiProFit exponential / free-n Sersic fit (one multiband shape,
      per-band flux) evaluated as the fitted Gaussian mixture with half-light
      radius 1.386 reff (for n = 1), moments the band's PSF-subtracted HSM
      moments; DLR half_light is the exponential fit's half-light ellipse for
      every profile, moments the rms moment ellipse; exclude_suspect = drop
      removes sbw_host's suspect fits. Every band and profile is in
      dp2_association_sweep.
    inputs: [dp2_sample, dp2_candidates]
    decisions: [sbw_profile, band, search_radius, dlr_max, dlr_radius, extendedness_cut, exclude_suspect, candidate_quality]
    recipe:
      command: python src/dp02_associate.py --tier dp2 --sample {inputs.dp2_sample} --candidates {inputs.dp2_candidates} --profile {decisions.sbw_profile} --band {decisions.band} --search-radius {decisions.search_radius} --dlr-max {decisions.dlr_max} --dlr-radius {decisions.dlr_radius} --extendedness {decisions.extendedness_cut} --candidate-quality {decisions.candidate_quality} --exclude-suspect {decisions.exclude_suspect} --workers 16 --output {output}
      resources: {cpus: 16, memory: 24Gi}
  - id: dp2_association_sweep
    type: table
    format: parquet
    description: >-
      The dp2_associations computation for every band (ugrizy) and SBW light
      model (exponential fit, free-n Sersic fit, moment Gaussian), one row per
      (transient, band, profile) with the SBW and DLR picks (sbw_objectId,
      p_sbw_max, flb_best, flb_max, sep_sbw, dlr_objectId, p_sbw_dlr,
      d_dlr_min, d_dlr_sbw, sep_dlr, agree); the other settings are those of
      dp2_associations.
    inputs: [dp2_sample, dp2_candidates, dp02_lib_script]
    decisions: [search_radius, dlr_max, dlr_radius, extendedness_cut, exclude_suspect, candidate_quality]
    recipe:
      command: python src/dp02_sweep.py table --tier dp2 --sample {inputs.dp2_sample} --candidates {inputs.dp2_candidates} --search-radius {decisions.search_radius} --dlr-max {decisions.dlr_max} --dlr-radius {decisions.dlr_radius} --extendedness {decisions.extendedness_cut} --candidate-quality {decisions.candidate_quality} --exclude-suspect {decisions.exclude_suspect} --workers 16 --output {output}
      resources: {cpus: 16, memory: 24Gi}
  - id: dp2_random_positions
    type: table
    format: parquet
    description: As dp02_random_positions for the DP2 sample (ten per transient in the 45-90 arcsec annulus around it, seeded; before 2 Nov 2026 they were drawn over the transient's own patch).
    inputs: [dp2_sample]
    decisions: []
    recipe:
      command: python src/dp2_random_positions.py --sample {inputs.dp2_sample} --per-sn 10 --output {output}
      resources: {cpus: 16, memory: 40Gi}
  - id: dp2_random_candidates
    type: table
    format: parquet
    description: The dp2_candidates extraction (DP2 Object table) run on dp2_random_positions instead of the transients.
    inputs: [dp2_random_positions, dp2_object]
    decisions: [search_radius]
    recipe:
      command: python src/dp2_candidates.py --positions {inputs.dp2_random_positions} --objects {inputs.dp2_object} --search-radius {decisions.search_radius} --workers 16 --record-decisions --output {output}
      resources: {cpus: 16, memory: 56Gi}
  - id: dp2_random_associations
    type: table
    format: parquet
    description: SBW and DLR association of every DP2 random position, with the same columns, light models and candidate cuts as dp2_associations.
    inputs: [dp2_random_positions, dp2_random_candidates]
    decisions: [sbw_profile, band, search_radius, dlr_max, dlr_radius, extendedness_cut, exclude_suspect, candidate_quality]
    recipe:
      command: python src/dp02_associate.py --tier dp2 --positions {inputs.dp2_random_positions} --candidates {inputs.dp2_random_candidates} --profile {decisions.sbw_profile} --band {decisions.band} --search-radius {decisions.search_radius} --dlr-max {decisions.dlr_max} --dlr-radius {decisions.dlr_radius} --extendedness {decisions.extendedness_cut} --candidate-quality {decisions.candidate_quality} --exclude-suspect {decisions.exclude_suspect} --workers 16 --output {output}
      resources: {cpus: 16, memory: 24Gi}
  - id: dp2_hostless_indicator
    type: figure
    format: pdf
    description: >-
      dp02_hostless_indicator for DP2: (a) flb_best of the real transients
      (one population, there is no truth) and of the random positions; (b),
      (c) fraction rejected and Youden J versus the flb_best and d_DLR_min
      thresholds; (d) the random-position ROC with the sbw_hostless_cut and
      dlr_max operating points and the frozen DP0.2 J optima (flb_best
      0.0215, d_DLR 2.7) as open diamonds. "Real kept" is not a recovery
      here: some DP2 transients are truly hostless or have undetected hosts.
    inputs: [dp2_associations, dp2_random_associations, dp02_hostless_metrics]
    decisions: [sbw_hostless_cut, dlr_max]
    recipe:
      command: python src/dp02_fig.py hostless_indicator --tier dp2 --rung none --dp02-hostless-metrics {inputs.dp02_hostless_metrics} --associations {inputs.dp2_associations} --random {inputs.dp2_random_associations} --hostless-cut {decisions.sbw_hostless_cut} --dlr-max {decisions.dlr_max} --output {output}
  - id: dp2_hostless_metrics
    type: metric
    format: json
    description: dp02_hostless_metrics for DP2 (real transients kept, random positions rejected, Youden J optima, and dp02_optima_transfer at flb_best 0.01, 0.0215, 0.05 and d_DLR 2.7, 4); real_kept_and_true_in_set is null without truth.
    inputs: [dp2_associations, dp2_random_associations, dp02_hostless_metrics]
    decisions: []
    recipe:
      command: python src/dp02_fig.py hostless_metrics --tier dp2 --rung none --dp02-hostless-metrics {inputs.dp02_hostless_metrics} --associations {inputs.dp2_associations} --random {inputs.dp2_random_associations} --output {output}
  - id: dp2_disagreement_rate
    type: metric
    format: json
    description: >-
      SBW versus DLR on DP2 without truth. Categories per transient: both
      hosted with the DLR host in SBW's credible set (P_SBW(DLR host) >= t,
      t = p_true_threshold), both hosted with the DLR host excluded (P < t),
      SBW hostless only (flb_best < sbw_hostless_cut), DLR hostless only (no
      d_DLR <= dlr_max), both hostless ('same object' is not a category: SBW's
      most probable host has no special meaning, 4 Nov 2026); the P-band
      matrix (rows: P_SBW of the DLR host > 0.5, in [t, 0.5], < t, or SBW
      hostless; columns: DLR hosted, and DLR hostless); the same for the random
      positions; per band (headline profile) and per profile (headline band)
      from the sweep; band_flip, the fraction whose SBW (and DLR) host differs
      from the headline band's; and the pairwise SBW-host agreement of the
      three light models.
    inputs: [dp2_associations, dp2_association_sweep, dp2_random_associations, dp02_lib_script]
    decisions: [sbw_hostless_cut, p_true_threshold]
    recipe:
      command: python src/dp2_fig.py disagreement_rate --associations {inputs.dp2_associations} --sweep {inputs.dp2_association_sweep} --random {inputs.dp2_random_associations} --hostless-cut {decisions.sbw_hostless_cut} --p-threshold {decisions.p_true_threshold} --output {output}
  - id: dp2_agreement_vs_ddlr
    type: figure
    format: pdf
    description: The DLR host in SBW's credible set (P_SBW(DLR host) >= p_true_threshold), mean P_SBW of the DLR host and the SBW hostless fraction versus d_DLR of the DLR host, versus its separation and versus flb_best, with counts.
    inputs: [dp2_associations]
    decisions: [sbw_hostless_cut, p_true_threshold]
    recipe:
      command: python src/dp2_fig.py agreement_vs_ddlr --associations {inputs.dp2_associations} --hostless-cut {decisions.sbw_hostless_cut} --p-threshold {decisions.p_true_threshold} --output {output}
  - id: dp2_band_consistency
    type: figure
    format: pdf
    description: >-
      From dp2_association_sweep: (a) per band, how often the SBW most
      probable host (each light model) and the DLR host differ from the
      headline band's when both name one; (b) the SBW-DLR categories per band;
      (c) SBW and DLR hostless fractions per band and light model; (d) SBW
      host agreement between the exponential fit, the free-n Sersic fit and
      the moment Gaussian per band.
    inputs: [dp2_associations, dp2_association_sweep]
    decisions: [sbw_hostless_cut, p_true_threshold]
    recipe:
      command: python src/dp2_fig.py band_consistency --associations {inputs.dp2_associations} --sweep {inputs.dp2_association_sweep} --hostless-cut {decisions.sbw_hostless_cut} --p-threshold {decisions.p_true_threshold} --output {output}
  - id: dp2_agreement_matrix
    type: figure
    format: pdf
    description: >-
      Figure form of the dp2_disagreement_rate P-band matrix in the layout of
      dp02_agreement_matrix: (a) rows P_SBW of the DLR host > 0.5 / in
      [p_true_threshold, 0.5] / below p_true_threshold, or SBW hostless under
      sbw_hostless_cut, against DLR assigns a host / DLR hostless (that
      column holds SBW assigns a host / SBW hostless, since the P bands need
      a DLR host); (b) SBW x DLR hosted / hostless on every transient; (c)
      the same 2x2 on dp2_random_positions,
      where hostless is the correct answer.
    inputs: [dp2_associations, dp2_random_associations, dp02_lib_script]
    decisions: [sbw_hostless_cut, p_true_threshold]
    recipe:
      command: python src/dp2_fig.py agreement_matrix --associations {inputs.dp2_associations} --random {inputs.dp2_random_associations} --hostless-cut {decisions.sbw_hostless_cut} --p-threshold {decisions.p_true_threshold} --output {output}
  - id: dp2_p_top_host
    type: figure
    format: pdf
    description: >-
      Without truth, the shape of SBW's output: (a) the distribution of
      P_SBW of the most probable host for SBW-hosted DP2 transients, DP2
      random positions and (dashed) the DP0.2 SNe of the same universe; (b)
      mean credible-set size (candidates with P_SBW > t) versus t for the same
      three, with the DP0.2 credible-set knee of the same universe marked
      (read from dp02_credible_set_metrics). The numbers the text quotes
      (median P of the most probable host, fraction above 0.9) are in
      dp2_disagreement_rate.headline.
    inputs: [dp2_associations, dp2_random_associations, dp02_associations, dp02_credible_set_metrics]
    decisions: [sbw_hostless_cut]
    recipe:
      command: python src/dp2_fig.py p_top_host --associations {inputs.dp2_associations} --random {inputs.dp2_random_associations} --reference {inputs.dp02_associations} --dp02-credible-metrics {inputs.dp02_credible_set_metrics} --hostless-cut {decisions.sbw_hostless_cut} --output {output}
  - id: dp2_disagreement_cases
    type: table
    format: csv
    description: >-
      Twelve seeded transients per class for the DP2 gallery: sbw_ne_dlr
      (both name a host, different objects), sbw_hostless_only,
      dlr_hostless_only and band_flip (SBW hosted in the headline band and in
      another band, with a different most probable host; the first such band
      in ugrizy order). Columns case_id, class, class_n, sn_id, sn_ra, sn_dec,
      label, and for the SBW host, the DLR host and the other band's SBW host
      (flip) the position and ellipse (_ra, _dec, _a, _b, _phi in arcsec and
      degrees from West toward North; SBW: the profile's half-light ellipse,
      DLR: the ellipse d_DLR is measured on), plus p_sbw_max, p_sbw_dlr,
      flb_best, d_dlr_min, separations, flip_band, the objectIds and z, and
      sbw_set: the other members of SBW's credible set (P_SBW >=
      p_true_threshold, the most probable host excluded) as
      ra,dec,P,a,b,phi with their half-light ellipses; sbw_set_t is the
      threshold (5 Nov 2026).
    inputs: [dp2_associations, dp2_association_sweep, dp2_candidates, dp02_lib_script]
    decisions: [sbw_hostless_cut, exclude_suspect, p_true_threshold]
    recipe:
      command: python src/dp2_cases.py --associations {inputs.dp2_associations} --sweep {inputs.dp2_association_sweep} --candidates {inputs.dp2_candidates} --hostless-cut {decisions.sbw_hostless_cut} --exclude-suspect {decisions.exclude_suspect} --p-threshold {decisions.p_true_threshold} --output {output}
  - id: dp2_disagreement_gallery
    type: figure
    format: pdf
    description: >-
      DP2 deep_coadd cutouts (30 arcsec, headline band, north up, east left)
      of dp2_disagreement_cases, one page per class, with the SBW most
      probable host and its half-light ellipse (solid), the DLR host and its
      DLR ellipse (dashed), both drawn at 4 x their axes (d_DLR = 4 for the
      DLR one, the DLR hostless boundary), for band flips, the other
      band's SBW host, and the other members of SBW's credible set (every candidate with P_SBW >= p_true_threshold other than the most probable one, which keeps its solid marker) drawn in the SBW style with transparency, each with its P;
      src/dp02_gallery.py --tier dp2 over ivoa.ObsCore (obs_collection
      LSST.DP2, lsst.deep_coadd) and the RSP cutout service, from a NERSC
      compute node with the rsp_token.
    inputs: [dp2_disagreement_cases, rsp_token, dp02_gallery_script]
    decisions: [band]
    recipe:
      command: bash -c 'T=$TMPDIR; [ -n "$T" ] || T=/tmp; python src/dp02_gallery.py {inputs.dp2_disagreement_cases} --tier dp2 --ellipse-scale 4 --workers 4 --output {output} --band {decisions.band} --size 30 --ncol 4 --per-page 12 --token-file {inputs.rsp_token} --cache-dir "$T/dp2_cutouts"'
  # ---- Tier 4b: the DDF ParSNIP chain for the DELIGHT comparison (appendix) ----
  - id: dp2_ddf_sample
    type: table
    format: parquet
    description: >-
      The cleaned deep-drilling-field ParSNIP sample for the DELIGHT
      comparison, the only DP2 transients Y. J. Kang's DELIGHT predictions
      cover: the 7,823 parsnip_ddf.parquet transients without those on a
      Legacy DR10 source within 1 arcsec that is a Gaia star (parallax S/N >
      3 or proper motion S/N > 5) or an AGN-coloured point source (W1 - W2 >=
      0.8 Vega, W1 and W2 S/N > 3), 2,601 transients (src/dp2_sample.py
      --sample parsnip_ddf_clean, 29 Oct 2026). Same columns as dp2_sample
      plus the Legacy flags gaia_star, wise_agn, legacy_psf_1arcsec,
      gaia_ref_no_astrometry, the flagging (or nearest) legacy_objectId,
      legacy_type, legacy_sep_arcsec, legacy_n_1arcsec and ddf_field; the
      transients removed by each rule, overall and per DDF field, are in the
      parquet attrs key dp2_sample_accounting. The DDF set is mostly
      variable stars and AGN (three quarters sit on a Legacy point source),
      so it is not the real-data tier's sample; it exists for Fig 9 only.
    inputs: [dp2_transients, legacy_dr10_sweeps]
    decisions: []
    recipe:
      command: python src/dp2_sample.py --index {inputs.dp2_transients} --legacy-sweeps {inputs.legacy_dr10_sweeps} --sample parsnip_ddf_clean --record-decisions --output {output}
  - id: dp2_ddf_candidates
    type: table
    format: parquet
    description: As dp2_candidates (DP2 Object table within the search radius) for the dp2_ddf_sample transients.
    inputs: [dp2_ddf_sample, dp2_object]
    decisions: [search_radius]
    recipe:
      command: python src/dp2_candidates.py --positions {inputs.dp2_ddf_sample} --objects {inputs.dp2_object} --search-radius {decisions.search_radius} --workers 16 --record-decisions --output {output}
      resources: {cpus: 16, memory: 56Gi}
  - id: dp2_ddf_associations
    type: table
    format: parquet
    description: As dp2_associations (SBW and DLR, same light models and candidate cuts) for the dp2_ddf_sample transients.
    inputs: [dp2_ddf_sample, dp2_ddf_candidates]
    decisions: [sbw_profile, band, search_radius, dlr_max, dlr_radius, extendedness_cut, exclude_suspect, candidate_quality]
    recipe:
      command: python src/dp02_associate.py --tier dp2 --sample {inputs.dp2_ddf_sample} --candidates {inputs.dp2_ddf_candidates} --profile {decisions.sbw_profile} --band {decisions.band} --search-radius {decisions.search_radius} --dlr-max {decisions.dlr_max} --dlr-radius {decisions.dlr_radius} --extendedness {decisions.extendedness_cut} --candidate-quality {decisions.candidate_quality} --exclude-suspect {decisions.exclude_suspect} --workers 16 --output {output}
      resources: {cpus: 16, memory: 24Gi}
  - id: dp2_cross_method_agreement
    type: table
    format: csv
    description: >-
      Pairwise host agreement between SBW, sbw_host's DLR, Y. J. Kang's
      DELIGHT (CNN position) and DELIGHT-SEx (its SExtractor host) on the DP2
      transients that have a DELIGHT prediction (the dp2_ddf_sample chain:
      the cleaned DDF ParSNIP set). The DELIGHT positions are matched to the
      transient's DP2 candidates (every primary object within the search
      radius, before object-table cuts) under reference_match; no candidate
      is DELIGHT's implicit no-host. SBW is hostless at flb_best <
      sbw_hostless_cut, DLR beyond dlr_max. One row per subset (all, and each
      image_survey) and method pair: n, same, different, a_only_hostless,
      b_only_hostless, both_hostless (counts and fractions) and
      frac_same_given_both_hosted; for the SBW pairs 'same' means the other
      method's host is in SBW's credible set (P_SBW >= p_true_threshold) and
      'different' that SBW excludes it, for the single-pick pairs the same
      object. src/dp2_cross_method.py agreement; the association is
      recomputed with the DELIGHT (and DELIGHT-SEx) object as host to get its
      P_SBW and checked against dp2_ddf_associations.
    inputs: [dp2_ddf_associations, dp2_ddf_candidates, dp2_delight_yjkang, dp02_lib_script]
    decisions: [reference_match, sbw_hostless_cut, p_true_threshold]
    recipe:
      command: python src/dp2_cross_method.py agreement --associations {inputs.dp2_ddf_associations} --candidates {inputs.dp2_ddf_candidates} --delight {inputs.dp2_delight_yjkang} --reference-match {decisions.reference_match} --hostless-cut {decisions.sbw_hostless_cut} --workers 16 --p-threshold {decisions.p_true_threshold} --output {output}
  - id: dp2_cross_method_matrix
    type: figure
    format: pdf
    description: >-
      Fig 9 of the paper (the DELIGHT appendix): SBW, DLR and DELIGHT
      compared three ways on the cleaned deep-drilling sample, drawn
      from dp2_cross_method_metrics (subset all): for each pair of methods a
      2x2 of hosted / hostless with the hosted-hosted cell split into agree
      and disagree (SBW pairs: the other host in SBW's credible set; others:
      the same object), the agreement given both hosted in the title, and
      the P_SBW bands of the DELIGHT host (> 0.5, t..0.5, < t,
      SBW hostless) over the transients whose DELIGHT position matched a
      candidate.
    inputs: [dp2_cross_method_metrics, cross_method_matrix_script]
    decisions: []
    recipe:
      command: python src/cross_method_matrix.py --metrics {inputs.dp2_cross_method_metrics} --subset all --output {output}
  - id: dp2_cross_method_metrics
    type: metric
    format: json
    description: >-
      The dp2_cross_method_agreement cells as fractions with Wilson 68%
      intervals, for all transients and per image_survey (Legacy versus PS1
      cutouts); hostless rate per method; the fraction of DELIGHT and
      DELIGHT-SEx positions beyond the search radius; a cross-check of the
      DELIGHT match against Kang's own nearest DP2 object (on Legacy
      candidates against his Legacy DR10 counterpart, legacy_ls_id decoded
      as release << 40 | brickid << 20 | objid); SBW and DLR
      agreement with DELIGHT under every reference_match rule; and the SBW
      probability of the DELIGHT host: over transients whose DELIGHT position
      matched a candidate, SBW hostless or P_SBW of that object > 0.5, in
      [t, 0.5], < t (t = p_true_threshold; 0 when the object-table cuts
      removed it, counted per true_host_status).
    inputs: [dp2_ddf_associations, dp2_ddf_candidates, dp2_delight_yjkang, dp02_lib_script]
    decisions: [reference_match, sbw_hostless_cut, p_true_threshold]
    recipe:
      command: python src/dp2_cross_method.py metrics --associations {inputs.dp2_ddf_associations} --candidates {inputs.dp2_ddf_candidates} --delight {inputs.dp2_delight_yjkang} --reference-match {decisions.reference_match} --hostless-cut {decisions.sbw_hostless_cut} --p-threshold {decisions.p_true_threshold} --kang-ls-id-shift 20 --workers 16 --output {output}
  - id: dp2_delight_cases
    type: table
    format: csv
    description: >-
      Twelve seeded transients per class for the DELIGHT gallery:
      sbw_ne_delight and dlr_ne_delight (both name a host, different
      objects), sbw_hostless_delight_hosted, delight_nocand (no DP2 candidate
      at the DELIGHT position) and sex_ne_delight (DELIGHT-SEx and DELIGHT
      match different objects). Columns case_id, class, class_n, sn_id,
      sn_ra, sn_dec, image_survey, label, the SBW and DLR host positions and
      ellipses (as dp2_disagreement_cases), the raw DELIGHT and DELIGHT-SEx
      positions (delight_ra/dec, sex_ra/dec), P_SBW of the SBW, DLR and
      DELIGHT hosts, flb_best, separations and the objectIds, and sbw_set /
      sbw_set_t as dp2_disagreement_cases (5 Nov 2026).
    inputs: [dp2_ddf_associations, dp2_ddf_candidates, dp2_delight_yjkang, dp02_lib_script]
    decisions: [reference_match, sbw_hostless_cut, p_true_threshold]
    recipe:
      command: python src/dp2_cross_method.py cases --associations {inputs.dp2_ddf_associations} --candidates {inputs.dp2_ddf_candidates} --delight {inputs.dp2_delight_yjkang} --reference-match {decisions.reference_match} --hostless-cut {decisions.sbw_hostless_cut} --p-threshold {decisions.p_true_threshold} --workers 16 --output {output}
  - id: dp2_delight_gallery
    type: figure
    format: pdf
    description: >-
      DP2 deep_coadd cutouts (30 arcsec, headline band, north up, east left)
      of dp2_delight_cases (the DDF chain), one page per class, with the SBW most probable
      host and its half-light ellipse (solid), the DLR host and its DLR
      ellipse (dashed), both at 4 x their axes, the DELIGHT CNN position and
      the DELIGHT-SEx position, and the other members of SBW's credible set (every candidate with P_SBW >= p_true_threshold other than the most probable one, which keeps its solid marker) drawn in the SBW style with transparency, each with its P; the panel title names the survey whose cutout
      DELIGHT used. src/dp02_gallery.py --tier dp2, as dp2_disagreement_gallery.
    inputs: [dp2_delight_cases, rsp_token, dp02_gallery_script]
    decisions: [band]
    recipe:
      command: bash -c 'T=$TMPDIR; [ -n "$T" ] || T=/tmp; python src/dp02_gallery.py {inputs.dp2_delight_cases} --tier dp2 --ellipse-scale 4 --workers 2 --min-interval 1.5 --output {output} --band {decisions.band} --size 30 --ncol 4 --per-page 12 --token-file {inputs.rsp_token} --cache-dir "$T/dp2_cutouts"'
  # ---- Cross-tier summary ----
  - id: summary_table
    type: table
    format: csv
    description: >-
      Table 2 of the paper: one row per tier (DP0.2, OU2024, DES-SN5YR, DP2)
      with the same quantities under the same names, read from the recovery
      and disagreement metric files: N detectable / host in the object table /
      host usable (the ladder), mean P_SBW(reference) with its standard error,
      the four P bands (> 0.5, t..0.5, < t, SBW hostless), SBW agreement with
      the reference (P_SBW(reference) >= t: in the credible set) and DLR
      agreement (Wilson 68%), DLR hostless fraction, SBW-DLR agreement (the
      DLR host in SBW's credible set), random positions rejected by each
      method, the calibration error, and the two fixed thresholds. DP2 has no
      reference: its "reference" is the DLR host, so its SBW agreement is
      P_SBW(DLR host) >= t given DLR hosted and its calibration columns are
      empty.
    inputs: [dp02_recovery, ou24_recovery, des_recovery, dp2_disagreement_rate]
    decisions: []
    recipe:
      command: python src/summary_table.py --dp02 {inputs.dp02_recovery} --ou24 {inputs.ou24_recovery} --des {inputs.des_recovery} --dp2 {inputs.dp2_disagreement_rate} --output {output}
  - id: hostless_roc_tiers
    type: figure
    format: pdf
    description: >-
      Fig 5 of the paper: the hostless ROC (random positions rejected versus
      real transients kept) of SBW (flb_best) and DLR (d_DLR_min) on every
      tier, one panel each (DP0.2, OU2024, DES-SN5YR, DP2), drawn from the
      curves block of the four *_hostless_metrics files, with the fixed
      operating points (sbw_hostless_cut, dlr_max) as filled circles and the
      DP0.2 J optima of the same universe as open diamonds. Real transients
      are on rung 4 where a reference exists; the random positions are the
      ten-per-transient annulus draws of each tier.
    inputs: [dp02_hostless_metrics, ou24_hostless_metrics, des_hostless_metrics, dp2_hostless_metrics]
    decisions: [sbw_hostless_cut, dlr_max]
    recipe:
      command: python src/roc_tiers.py --dp02 {inputs.dp02_hostless_metrics} --ou24 {inputs.ou24_hostless_metrics} --des {inputs.des_hostless_metrics} --dp2 {inputs.dp2_hostless_metrics} --hostless-cut {decisions.sbw_hostless_cut} --dlr-max {decisions.dlr_max} --output {output}

decisions:
  sbw_profile:
    label: Form of the host light model used by SBW
    rationale: >-
      The core question of the paper. Parametric fits are cheap and available in
      every catalogue; the deblended stamp form is model-free but depends on the
      deblender. Exponential is the package default because the free-n fit pins
      ~3% of galaxies at n ~ 6 whose wings dominate from far away.
    default: exponential
    options:
      exponential:
        label: Exponential (n = 1) fit; on DP0.2 and OU2024 the CModel disk component radius with the total cModel flux
        insights: [dc2_sn_position_sampled_from_sersic_profile, legacy_tractor_model_set, legacy_single_shape_across_bands, ou2024_lsst_pipeline_w_2024_22]
      sersic:
        label: Free-n Sersic fit; on DP0.2 the CModel de Vaucouleurs (n = 4) component radius with the total cModel flux (no fracDev is exported, so no composite)
        insights: [ou2024_hostlib_sb_weighted_placement, ou2024_galaxy_model_bulge_disk_knots, dc2_sn_position_sampled_from_sersic_profile, dc2_galaxy_model_bulge_disk_fixed_sersic, dc2_pipeline_runs_cmodel_photometry, legacy_tractor_model_set, legacy_single_shape_across_bands, qu2024_sim_sn_placement_intensity_weighted, qu2024_sersic_radii_scaled_0p8]
      moments:
        label: Gaussian with the PSF-subtracted second-moment ellipse and the cModel flux (the DLR literature's shape, used as a light model)
        insights: [sullivan06_dlr_ellipse_is_sextractor_moments, gupta16_dlr_defined_from_sextractor_moment_ellipse]
      stamps:
        label: Image-level deblended model stamps (sbw_host.stamps); not available on DP0.2 at NERSC
        insights: [dc2_random_walk_knots_perturb_disk_profile, delight_catastrophic_failure_mode_large_hosts, delight_nearby_sample_asiago_hecate, legacy_tractor_fails_on_large_galaxies, ghost_gradient_ascent_beats_dlr_12_vs_16_pct, ghost_image_method_fails_in_crowded_large_host_fields]
  band:
    label: Band in which surface brightness is evaluated
    rationale: r is the deepest and best-fit band in Rubin; wavelength dependence is reported as its own output.
    default: r
    options:
      r:
        label: r
        insights: [delight_images_ps1_rband_stamps, legacy_coverage_and_depth, legacy_single_shape_across_bands]
      i: { label: i }
      g:
        label: g
        insights: [legacy_coverage_and_depth]
      z:
        label: z
        insights: [legacy_coverage_and_depth, legacy_z_band_best_image_quality]
  search_radius:
    label: Candidate search radius
    rationale: 30 arcsec captures hosts out to several half-light radii for all but the largest nearby galaxies.
    default: r30
    options:
      r15:
        label: 15 arcsec (DES-SN5YR data convention)
        insights: [qu2024_dlr_threshold_4_radius_15arcsec, gupta16_search_radius_30arcsec_loses_few_true_hosts]
      r30:
        label: 30 arcsec
        insights: [sullivan06_candidate_search_radius_10arcsec, ou2024_sne_truth_table_host_id_and_separation, qu2024_dlr_threshold_4_radius_15arcsec, qu2024_sim_matching_10arcsec_10gal, ghost_ps1_30arcsec_cone_search, gupta16_search_radius_30arcsec_loses_few_true_hosts]
  dlr_max:
    label: Maximum d_DLR for a DLR assignment
    rationale: Gupta et al. 2016 and DES-SN use 4; beyond it the transient is declared hostless.
    default: d4
    options:
      d4:
        label: "d_DLR <= 4"
        insights: [qu2024_dlr_threshold_4_radius_15arcsec, qu2024_hostless_rate_faint_hosts, qu2024_sim_matching_10arcsec_10gal, gupta16_dlr_threshold_4_is_nominal_sdss_choice_not_optimised]
      d5:
        label: "d_DLR <= 5"
        insights: [sullivan06_dlr_isophotal_r3_threshold_r5, sullivan06_hostless_fraction_7pct, ghost_dlr_max_extended_to_5, gupta16_dlr_threshold_4_is_nominal_sdss_choice_not_optimised]
  dlr_radius:
    label: Ellipse used for the DLR radius
    rationale: >-
      Every published DLR implementation (Sullivan+06, Gupta+16, Qu+24, GHOST)
      uses a second-moment or Kron ellipse, and Gupta+16 show that fitted
      half-light radii without a quality cut degrade DLR, so the moment
      ellipse is the paper's DLR on every tier (30 Oct 2026): it is the
      literature's DLR, it is what DES-SN used for the published hosts, and
      it is independent of the ellipse SBW evaluates. The package default is
      the model half-light ellipse, which keeps d_dlr equal to the
      transient's elliptical radius in SBW's own light model; with it DLR and
      SBW differ only by flux weighting (on DP2 they name the same host for
      all but 2 of 690 transients). On DP0.2 the half-light DLR recovers ~2
      points more than moments, on OU2024 ~4 points less (the `physical`
      universe, dropped 4 Nov 2026 with its results in git history).
    default: moments
    options:
      half_light:
        label: Model half-light ellipse (1.386 x reff for MultiProFit; flux-weighted bulge/disk radius on DP0.2)
        insights: [qu2024_sersic_radii_scaled_0p8]
      moments:
        label: "Second-moment (HSM or SExtractor A, B) ellipse"
        insights: [sullivan06_dlr_ellipse_is_sextractor_moments, sullivan06_dlr_isophotal_r3_threshold_r5, delight_sextractor_ellipse_failures_kept, qu2024_dlr_recipe_sextractor_moments, ghost_dlr_uses_moments_and_kron_radius_best_snr_band, gupta16_dlr_defined_from_sextractor_moment_ellipse, gupta16_fitted_half_light_radius_degrades_dlr_matching]
  extendedness_cut:
    label: Point-source rejection
    rationale: Stars contaminate candidate lists; but faint hosts are sometimes classed as stars (the dominant DES failure mode).
    default: ext05
    options:
      ext05:
        label: "refExtendedness (or survey equivalent) >= 0.5"
        insights: [legacy_psf_type_contains_compact_galaxies, ghost_star_cut_is_deliberately_lenient, gupta16_compact_objects_removed_from_candidate_catalogue]
      none:
        label: Keep all objects
        insights: [legacy_psf_type_contains_compact_galaxies, ou2024_lsst_exposures_15s_shallower, ou2024_host_correlation_known_issue]
  sbw_hostless_cut:
    label: frac_light_beyond below which SBW declares a transient hostless
    rationale: >-
      frac_light_beyond is the fraction of a host's light fainter than the
      isophote through the transient, so it is SBW's natural hostless
      statistic: a transient on a galaxy's isophotes has a sizeable fraction
      of the light beyond it, one far in the wings has almost none. The cut
      trades real transients lost against random positions rejected (see
      dp02_hostless_indicator); 0.01 is the default as the point where the
      real loss is still small. Used for the 3x3 agreement matrix and the
      hostless-aware recovery; the threshold sweep itself is an output.
    default: flb01
    options:
      flb001:
        label: "flb_best < 0.001 (lenient: only far-wing positions are hostless)"
      flb01:
        label: "flb_best < 0.01"
      flb02:
        label: "flb_best < 0.02 (Youden-J optimum on DP0.2 baseline, 0.0215; physical 0.032)"
      flb05:
        label: "flb_best < 0.05 (strict)"
  candidate_quality:
    label: Object-table quality cut on candidates before association
    rationale: >-
      Defined only from object-table columns (headline band), so the same cut
      transfers unchanged to real data (DP2, OU2024); failing candidates are
      dropped before SBW and DLR see them, and the miss accounting reports how
      often that removes the true host (cat2) against the genuine failures it
      prevents (cat3). Candidates with no usable radius or flux for the
      profile are always dropped, under every option, as object-table
      failures. Sibling counts (candidates sharing the parentObjectId within
      the SN's search radius) barely separate true hosts from wrong picks on
      DP0.2: 96% of true hosts are deblended children (median 10 siblings, 12
      for wrong SBW picks), so the strict threshold is the smallest that
      removes < 1% of true hosts (0.85% against 2.4% of wrong picks; baseline,
      27 Oct 2026). Thresholds are chosen on DP0.2 and tested unchanged on
      OU2024.
    default: none
    options:
      none:
        label: No quality cut (only the always-applied unusable-measurement drop)
      basic:
        label: "basic: drop {b}_cModel_flag set or cModelFlux / cModelFluxErr < 5"
        insights: [gupta16_fitted_half_light_radius_degrades_dlr_matching]
      strict:
        label: "strict: basic plus {b}_blendedness > 0.5 or more than 50 siblings (same parentObjectId among the SN's candidates)"
  p_true_threshold:
    label: P_SBW below which the true host counts as excluded by SBW
    rationale: >-
      SBW returns a probability over candidates, so success is not "the most
      probable host is the true host" but "the true host keeps a
      non-negligible probability": below this P the true host is effectively
      excluded by SBW. It splits the probabilistic agreement matrix and the
      miss accounting (cat3); the credible-set figure shows coverage over a
      continuous range of thresholds.
    default: p005
    options:
      p001:
        label: "P_SBW(true) < 0.01"
      p005:
        label: "P_SBW(true) < 0.05"
  exclude_suspect:
    label: Drop fits flagged as suspect (deblend-halo phantoms)
    default: keep
    options:
      keep:
        label: Keep suspect fits in the probabilities
        insights: [delight_sextractor_ellipse_failures_kept]
      drop:
        label: Exclude suspect fits
        insights: [qu2024_sersic_radii_scaled_0p8]
  truth_match:
    label: How the simulated true host is linked to a pipeline object
    rationale: >-
      DP0.2 has Rubin's MatchesTruth table; OU2024 has none, so ou24_truth_match
      builds both matchers by hand and matches_truth maps to its magnitude-aware
      match, the closest analogue of MatchesTruth (which is also
      magnitude-aware). On OU2024 the two differ for 0.1% of hosts matched by
      both, but the nearest matcher also matches ~9% more faint hosts whose
      nearest object is often unrelated.
    default: matches_truth
    options:
      matches_truth:
        label: "DP0.2: Rubin's truth-object match table (TAP MatchesTruth). OU2024: the magnitude-aware match, primary objects within 1 arcsec with |m_r(cModel) - m_r(truth)| < 1, lowest chi2 = (sep/0.1\")^2 + (dm/0.2)^2"
        insights: [dc2_truth_match_magnitude_within_1arcsec, dc2_truth_table_single_entry_per_galaxy, ou2024_truth_and_pipeline_catalog_products, ou2024_static_flux_throughput_version]
      nearest_1arcsec:
        label: "Nearest primary Object within 1 arcsec of the host truth position (DP0.2: among the SN's candidates; OU2024: nearest_objectId of ou24_truth_match)"
        insights: [dc2_truth_match_magnitude_within_1arcsec, ou2024_truth_and_pipeline_catalog_products]
  dp02_sample_cuts:
    label: Simulated-tier (DP0.2, OU2024) SN sample cleaning
    rationale: >-
      Every cut drops SNe whose host row is missing (~5%); since 31 Oct 2026
      SNe whose host has no DP0.2 object under truth_match stay in the sample
      (host_objectId = -1), so the miss accounting can say what the pipeline
      did with them. The options differ in how far from its host an SN may
      sit. DC2 drew SN positions from the host component's full
      Sersic profile, so ~9% sit > 3 arcsec from the host centre, many far out
      in n = 4 bulge wings where no catalogue method (nor a human) would assign
      them. A fixed angular cut is unfair to large nearby hosts, which span
      many arcsec (the recovery-vs-separation curve suggests a geometric cut
      would have to be ~10 arcsec to stop hurting the results); a cut in units
      of the host's own half-light radius removes the unphysical tail without
      penalising large hosts, so it is the default. N = 3 is where the
      both-wrong-same-object fraction turns up in dp02_offset_diagnostic
      (sep10): 0.1-0.5% inside 1 R_e, ~3% at 2 R_e, ~6% at 2.7 R_e, ~12% at 3.6
      R_e for bulge-dominated hosts, with DLR failures jumping from 16% to 38% to
      75% over the same bins; it is a constant in src/dp02_sample.py to tune.
      The radius uses position_angle_true East of North and the truth axis
      ratio, the convention DC2 placed SNe with (the rendered galaxies are
      mirrored, see host_offsets in src/dp02_lib.py). The 3 arcsec cut is kept
      for comparability with the first results. On OU2024 the same options
      apply with the skyCatalog bulge/disk half-light radii, axis ratios and
      B/T_i from the component SEDs; there the ellipse angle is the skyCatalog
      beta (= SNANA a_rot), which both the transient offsets and the pipeline
      moments follow (ou24_pa_check), and SNANA placed transients by host
      surface brightness, so there is no untruncated-wing tail as in DC2.
    default: physical
    options:
      clean3:
        label: Drop SNe whose host row is missing or > 3 arcsec from the host truth position (the first results; those also dropped host-unmatched SNe)
        insights: [dc2_hostless_sn_fraction, dc2_host_choice_proportional_to_stellar_mass]
      clean10:
        label: As clean3 but > 10 arcsec
        insights: [dc2_hostless_sn_fraction, dc2_sn_position_sampled_from_sersic_profile]
      physical:
        label: As clean3 but drop only SNe beyond N = 3 half-light radii of the host along its truth ellipse (bulge R_e for B/T_i > 0.5, disk R_e otherwise; N_RE in src/dp02_sample.py)
        insights: [dc2_hostless_sn_fraction, dc2_sn_position_sampled_from_sersic_profile, dc2_sn_offsets_scale_with_hosting_component_size, ou2024_hostlib_sb_weighted_placement]
      all:
        label: Keep every SN truth row (the cut flags are carried; consumers apply them)
        insights: [dc2_hostless_sn_fraction]
  transient_peak_mag:
    label: Which simulated transients count as detectable
    rationale: >-
      The miss accounting and every truth metric describe what happens to a
      transient an analyst has in hand, so transients that would never enter
      an analysis should not be in the denominator; what fraction of all
      simulated transients that is belongs to the survey's selection function,
      reported as a number from the sample ladder, not drawn. A transient
      needs several difference-imaging detections, which at LSST's
      single-visit depth (r ~ 24.5 at 5 sigma in 30 s; OU2024 used 15 s
      exposures) means a true peak r brighter than about 24. DC2's SN truth
      spans ten years while DP0.2 imaged five, so a DC2 SN also has to peak
      inside the dp02_visits window (59582 to 61406); every OU2024 transient
      peaks inside its survey (the FIXMAG class, which does not, is always
      dropped). On DC2 the r < 24 and in-window condition keeps ~10% of the
      hosted SNe (~41k); on OU2024, whose transients sit at median z 1.5, r <
      24 keeps ~4% (~21k), which removes most of the hosts that have no
      catalogue object. Both remain large enough for sub-percent failure
      rates. r < 23 is the conservative alternative (~18k / ~8k).
    default: r24
    options:
      none:
        label: Keep every transient regardless of peak magnitude (the pre-31-Oct-2026 samples)
      r24:
        label: Keep transients with true peak r < 24 (DC2 also peaking inside the DP0.2 visit window)
      r23:
        label: Keep transients with true peak r < 23 (DC2 also peaking inside the DP0.2 visit window)
  reference_match:
    label: How a method's chosen host is matched to the reference host position
    rationale: >-
      DES HOSTGAL and DELIGHT visual positions are catalogue centroids that can
      differ from the Rubin, DES DR2 or Legacy object centroid by arcseconds,
      and by more for large nearby hosts (DELIGHT reports tails of a few
      arcsec). The tolerance sets what counts as agreement with the reference.
    default: pos_1arcsec
    options:
      pos_1arcsec:
        label: Same host if centroids agree within 1 arcsec
      pos_3arcsec:
        label: Same host if centroids agree within 3 arcsec
        insights: [delight_visual_vetting_by_twelve_people, delight_catastrophic_failure_mode_large_hosts]
      frac_semimajor:
        label: Same host if the reference position lies within 0.5 half-light semi-major axes of the chosen host
        insights: [delight_catastrophic_failure_mode_large_hosts]

prior_insights:
  sullivan06_dlr_original_definition:
    claim: 'The DLR-style host assignment originates here: the SN-galaxy separation is normalised by the
      galaxy''s apparent size along the SN-galaxy direction (an elliptical radius R), explicitly because
      the nearest host in arcseconds is sometimes the wrong identification.'
    created_at: '2026-10-26T20:04:08Z'
    evidence:
    - id: ev1
      doi: 10.1086/506137
      quote:
        exact: Instead we use a separation normalized by the apparent size of the galaxy to which the SN
          is being compared
        prefix: 'probably not the correct identification. '
        suffix: ' ( Fig. 1). We calculate the separation of the SN'
      location:
        page: 4
  sullivan06_dlr_ellipse_is_sextractor_moments:
    claim: The ellipse used for the original directional radius is the SExtractor shape (semimajor rA, semiminor
      rB, position angle theta), i.e. a second-moment A/B/THETA ellipse, not a model half-light ellipse.
    created_at: '2026-10-26T20:04:08Z'
    evidence:
    - id: ev1
      doi: 10.1086/506137
      quote:
        exact: The elliptical shape is determined by SExtractor, defined by semimajor (rA ) and semiminor
          (rB ) axes together with a position angle
        prefix: 'to a given host center (xgal , ygal ). '
        suffix: ', with R given by'
      location:
        page: 4
  sullivan06_dlr_isophotal_r3_threshold_r5:
    claim: R ~ 3 corresponds to the SExtractor isophotal limit of an object, and only galaxies with R <=
      5 are considered as candidate hosts; this R <= 5 cut is the origin of the d_DLR <= 5 convention (R
      is in units of the moment ellipse, so it is not the same physical cut as 5 half-light radii).
    created_at: '2026-10-26T20:04:08Z'
    evidence:
    - id: ev1
      doi: 10.1086/506137
      quote:
        exact: The isophotal limit of a given object corresponds to R
        prefix: 'is nearest in terms of this parameter. '
        suffix: 3; we consider only galaxies with R
      location:
        page: 4
    scope: SExtractor A/B moment ellipse on CFHTLS deep stacks; the numerical thresholds are tied to that
      ellipse definition and detection depth.
  sullivan06_dlr_assignment_rule_nearest_in_r:
    claim: 'Host assignment is a hard argmin: candidates are ranked by R and the SN is assigned to the single
      galaxy with the smallest R, with no probabilistic weighting and no handling of near-ties.'
    created_at: '2026-10-26T20:04:08Z'
    evidence:
    - id: ev1
      doi: 10.1086/506137
      quote:
        exact: the hosts ordered by R, and each SN is assigned to the host that is nearest in terms of this
          parameter.
        prefix: 'The value R is determined for every candidate host galaxy, '
        suffix: ' The isophotal limit of a given object corresponds to R'
      location:
        page: 4
    - id: ev2
      doi: 10.1086/506137
      quote:
        exact: The nearest host in terms of this R-parameter is considered to be the correct host
        prefix: '5R ellipse overplotted (see x 2.3 for the definition of R). '
        suffix: ; SNes with no hosts inside 5R are considered
      location:
        page: 3
  sullivan06_candidate_search_radius_10arcsec:
    claim: The original DLR implementation searched for candidate hosts only within 10 arcsec of the SN
      position on i-band-detected deep stacks, far smaller than the 30-60 arcsec considered here; at SNLS
      redshifts (0.2 < z < 0.75) 10 arcsec is still several host radii.
    created_at: '2026-10-26T20:04:08Z'
    evidence:
    - id: ev1
      doi: 10.1086/506137
      quote:
        exact: to identify all potential host galaxies within 1000 of the SN position and simultaneously
          measure photometric information on the host galaxies
        prefix: 'see Holwerda [2005] for an excellent user guide) '
        suffix: . SExtractor is used in dual-image mode
      location:
        page: 3
    scope: The '1000' in the extracted text is the PDF rendering of 10 arcsec; SNLS deep-stack depth, 0.2
      < z < 0.75.
  sullivan06_hostless_fraction_7pct:
    claim: For 7% of SNLS SNe Ia no SExtractor galaxy is found with R <= 5; those are treated as hostless
      and the host flux is replaced by a 3 arcsec aperture at the SN position.
    created_at: '2026-10-26T20:04:08Z'
    evidence:
    - id: ev1
      doi: 10.1086/506137
      quote:
        exact: In some cases (7%), no host galaxy is identified by SExtractor with R
        prefix: 'we consider only galaxies with R  5. '
        suffix: 5; we then measure the flux and flux error inside a
      location:
        page: 4
    scope: SNLS spectroscopically confirmed SNe Ia on CFHTLS deep stacks; hostless fraction depends on stack
      depth and redshift range.
  ou2024_hostlib_sb_weighted_placement:
    claim: OpenUniverse2024 transients were placed by SNANA using a HOSTLIB in which each galaxy carries
      a bulge+disk Sersic profile, with the transient position drawn with weight proportional to the local
      surface brightness. The truth placement is therefore exactly a surface-brightness-weighted model,
      so SBW with a Sersic-type profile matches the simulation's generative prior while DLR does not.
    created_at: '2026-10-26T20:04:08Z'
    evidence:
    - id: ev1
      doi: 10.48550/arXiv.2501.05632
      quote:
        exact: The HOSTLIB includes a bulge+disk Sersic profile that is used to place transients near a
          galaxy with a weight proportional to the local surface brightness.
        prefix: construct a host library (HOSTLIB) for the SNANA simulation.
        suffix: The HOSTLIB also includes estimates of stellar mass and star formation rate
      location:
        page: 11
    scope: OpenUniverse2024 (SNANA HOSTLIB) simulated transients only; not a statement about real transient
      offsets.
  ou2024_hostlib_mass_sfr_type_correlations:
    claim: The HOSTLIB carries stellar mass and SFR which SNANA uses for transient-host correlations (e.g.
      core-collapse SNe only in star-forming galaxies); host choice in the truth is a galaxy-property-weighted
      draw, not uniform.
    created_at: '2026-10-26T20:04:08Z'
    evidence:
    - id: ev1
      doi: 10.48550/arXiv.2501.05632
      quote:
        exact: The HOSTLIB also includes estimates of stellar mass and star formation rate, which are used
          to model transient-host correlations such as core collapse SNe being found only in star forming
          galaxies.
        prefix: with a weight proportional to the local surface brightness.
        suffix: 3.2.3 Rebinning to reduce SED output size
      location:
        page: 11
  ou2024_host_correlation_known_issue:
    claim: 'Known issue: host-transient correlations in OpenUniverse2024 were modelled incorrectly, giving
      hosts an average stellar mass about 1 dex too low. A cosmology propagation built on OU2024 truth hosts
      inherits a host population biased toward faint, low-mass galaxies, which likely inflates mis-association
      rates relative to a realistic host population.'
    created_at: '2026-10-26T20:04:08Z'
    evidence:
    - id: ev1
      doi: 10.48550/arXiv.2501.05632
      quote:
        exact: Host-transient correlations were also incorrectly modeled, resulting in an average stellar
          mass about 1 dex too low.
        prefix: without host extinction corrections.
        suffix: Thus the Poisson noise contribution from the host is underestimated.
      location:
        page: 11
    scope: Caveat on OpenUniverse2024 host truth; applies to any analysis using its host population.
  ou2024_galaxy_model_bulge_disk_knots:
    claim: Simulated galaxies are composite bulge + disk + star-forming-knot models with sizes and ellipticities
      inherited from the cosmoDC2 models; a bulge+disk or free-n Sersic fit is the natural light model,
      and a pure exponential would miss the bulge component.
    created_at: '2026-10-26T20:04:08Z'
    evidence:
    - id: ev1
      doi: 10.48550/arXiv.2501.05632
      quote:
        exact: Galaxies are built from a composite morphological model consisting of a bulge, disk, and
          star-forming knot regions.
        prefix: image scene photon-by-photon.
        suffix: The SED
      location:
        page: 3
    - id: ev2
      doi: 10.48550/arXiv.2501.05632
      quote:
        exact: Briefly, the model for the scaling relations used for galaxy size was calibrated against
          Zhang & Yang (2019);
        prefix: we use the same models implemented in Korytov et al. (2019) for cosmoDC2.
        suffix: the models for black hole mass and accretion rate were calibrated
      location:
        page: 6
    - id: ev3
      doi: 10.48550/arXiv.2501.05632
      quote:
        exact: and the model for ellipticity was calibrated against Joachimi et al. (2013). We refer the
          reader to the cosmoDC2 paper for details.
        prefix: Kormendy & Ho (2013) and Aird et al. (2018), respectively;
        suffix: Within the smooth disk profile, we model a random set of star-forming
      location:
        page: 6
  ou2024_skycatalog_galaxy_truth_columns:
    claim: The SkyCatalog galaxy parquet truth tables give per-galaxy bulge and disk half-light radii in
      arcsec, per-component ellipticities, stellar mass, and redshift with and without peculiar velocity;
      the truth host light profile and true redshift are directly available for every candidate host without
      fitting.
    created_at: '2026-10-26T20:04:08Z'
    evidence:
    - id: ev1
      doi: 10.48550/arXiv.2501.05632
      quote:
        exact: spheroidHalfLightRadiusArcsec
        prefix: Convergence (𝜅) experienced by object.
        suffix: float32 arcsec Bulge component half-light radius.
      location:
        page: 24
    - id: ev2
      doi: 10.48550/arXiv.2501.05632
      quote:
        exact: Object redshift (inc. peculiar velocity).
        prefix: redshift float64 –
        suffix: redshiftHubble float64 – Object redshift (w/o peculiar velocity).
      location:
        page: 24
  ou2024_sne_truth_table_host_id_and_separation:
    claim: The SkyCatalog SNe truth table records for each transient the true host_id, host position and
      magnitudes, z_CMB and host_sn_sep (angular separation in arcsec). The truth host link is the generative
      one from SNANA, not a DLR match; the paper describes no post-hoc host-association product. host_sn_sep
      gives the true offset distribution directly, which bounds the search radius needed.
    created_at: '2026-10-26T20:04:08Z'
    evidence:
    - id: ev1
      doi: 10.48550/arXiv.2501.05632
      quote:
        exact: Table A4. Contents of the SkyCatalog SNe parquet tables.
        prefix: OpenUniverse2024 25
        suffix: Column name Datatype Units Description
      location:
        page: 25
    - id: ev2
      doi: 10.48550/arXiv.2501.05632
      quote:
        exact: host_sn_sep
        prefix: host_mag_F float32 – Host magnitude.
        suffix: float32 arcsec Separation from host.
      location:
        page: 25
  ou2024_truth_and_pipeline_catalog_products:
    claim: Truth for the suite lives in SkyCatalog Parquet/HDF5 files, while the LSST imaging was run through
