      come from the one sample (dp02_sample always carries both), so a single
      universe's associations suffice.
      A sixth class, true_host_not_in_catalogue, draws SNe whose host has no DP0.2 object and to which SBW still assigned one (31 Oct 2026).
      sbw_set lists the other members of SBW's credible set (P_SBW >= p_true_threshold, the most probable
      host excluded) as ra,dec,P; sbw_set_t is the threshold (5 Nov 2026).
    inputs: [dp02_associations, dp02_candidates, dp02_lib_script]
    decisions: [p_true_threshold]
    recipe:
      command: python src/dp02_cases.py --associations {inputs.dp02_associations} --candidates {inputs.dp02_candidates} --p-threshold {decisions.p_true_threshold} --output {output}
      resources: {cpus: 4, memory: 24Gi}
  - id: dp02_disagreement_gallery
    type: figure
    format: pdf
    description: >-
      DP0.2 deep-coadd cutouts (30 arcsec, headline band, north up, east left)
      of dp02_disagreement_cases, one page per class, with markers for the SN,
      the host truth position, both truth matchers' objects, the SBW most
      probable host and the DLR host, and the other members of SBW's credible set (every candidate with P_SBW >= p_true_threshold other than the most probable one, which keeps its solid marker) drawn in the SBW style with transparency, each with its P. Made with src/dp02_gallery.py (the
      cutout prototype's gallery.py, with the SBW marker relabelled "SBW most
      probable") over the RSP cutout service, from a NERSC compute node with
      the rsp_token on NERSC.
    inputs: [dp02_disagreement_cases, rsp_token, dp02_gallery_script]
    decisions: [band]
    recipe:
      command: bash -c 'T=$TMPDIR; [ -n "$T" ] || T=/tmp; python src/dp02_gallery.py {inputs.dp02_disagreement_cases} --output {output} --band {decisions.band} --size 30 --ncol 4 --per-page 12 --token-file {inputs.rsp_token} --cache-dir "$T/dp02_cutouts"'
  - id: dp02_miss_accounting
    type: metric
    format: json
    description: >-
      Where the true host is lost, per method, over the sample (rung 2: every
      detectable hosted SN with a host row within the offset cut, the
      host-unmatched SNe included), in four sequential categories, each
      counted only on the SNe that passed the previous one: cat1 true host
      absent from the catalogue (no DP0.2 object under truth_match, or not a
      primary object within the search radius);
      cat2 true host removed by object-table cuts, split into point source
      (extendedness_cut), unusable measurements (no usable radius or flux for
      the profile; for DLR also no DLR ellipse) and failed
      candidate_quality; cat3 removed by the no-host cut (SBW: no SBW host or
      flb_best < sbw_hostless_cut; DLR: no candidate with d_DLR <= dlr_max);
      cat4 genuine association failure (a host is assigned but P_SBW(true)
      < p_true_threshold; DLR assigns another, closer candidate); else
      success. For cat1 and cat2, where the method could not have found the
      host, the pipeline's outcome is split further (31 Oct 2026): it called
      the SN hostless, or it assigned a host, which is then a wrong one; this
      is the contamination an analyst meets, not a method failure. Counts,
      fractions of the sample and conditional fractions (of the SNe that
      entered the stage) with Wilson 68% intervals for the headline
      association, the same recomputed in-process for every
      candidate_quality level (none, basic, strict) with the fraction of
      candidates each cut removes, and the sample's ladder (the SNe the
      peak-magnitude cut removed are a number here, not a bar). The placement
      block (2 Nov 2026) is the paper's framing of the same table: every
      detectable SN is hosted (a host assigned) or rejected (hostless call);
      hosted SNe hold the true host, a wrong host because the true host was
      not in the object table, or a wrong host although it was (a real miss;
      for SBW the true host is recovered when P_SBW(true) >= t, i.e. it is in
      the credible set, since 4 Nov 2026); rejected SNe
      split by whether the true host was available; contamination is the
      wrong-host fraction of the hosted SNe. Counts, fractions of the sample
      and of the hosted SNe with Wilson 68% intervals.
    inputs: [dp02_sample, dp02_associations, dp02_candidates, dp02_lib_script]
    decisions: [sbw_profile, band, search_radius, dlr_max, dlr_radius, extendedness_cut, sbw_hostless_cut, p_true_threshold]
    recipe:
      command: python src/dp02_miss.py compute --sample {inputs.dp02_sample} --associations {inputs.dp02_associations} --candidates {inputs.dp02_candidates} --profile {decisions.sbw_profile} --band {decisions.band} --search-radius {decisions.search_radius} --dlr-max {decisions.dlr_max} --dlr-radius {decisions.dlr_radius} --extendedness {decisions.extendedness_cut} --hostless-cut {decisions.sbw_hostless_cut} --p-threshold {decisions.p_true_threshold} --tier dp02 --workers 16 --output {output}
      resources: {cpus: 16, memory: 40Gi}
  - id: dp02_miss_accounting_fig
    type: figure
    format: pdf
    description: >-
      Fig 1 of the paper, "How SNe are placed with a host" (one panel, 2 Nov
      2026): for SBW and DLR a stacked bar over the detectable SNe (the
      sample) of hosted with the true host, hosted with a wrong host because
      the true host was not in the object table, hosted with a wrong host
      although the true host was available (a real miss), rejected although
      the true host was available (the hostless cut fired), and rejected with
      the true host not in the object table; beside the bar each fraction of
      the sample and, for the two wrong-host outcomes, the fraction of the
      hosted SNe, which is the contamination a user of the hosted sample
      meets; under each bar the hosted fraction and the contamination. Drawn
      from the placement block of dp02_miss_accounting. The earlier panels
      (conditional loss per stage, candidate_quality sweep) are gone; the
      sequential cat1-cat4 accounting stays in the json.
    inputs: [dp02_miss_accounting, dp02_miss_script]
    decisions: []
    recipe:
      command: python src/dp02_miss.py figure --legend outside --accounting {inputs.dp02_miss_accounting} --output {output}
  - id: dp02_credible_set
    type: figure
    format: pdf
    description: >-
      SBW credible sets: for t from 0.001 to 0.5 (log grid), the fraction of
      SNe whose true host is in the set of surviving candidates with
      P_SBW > t, versus t and versus the mean set size, over all SNe and
      over SNe whose true host survived the object-table cuts; t = 0.01 and
      0.05 marked, the knee of coverage versus size, and the coverage of the
      top-k sets for k = 1, 2, 3.
      Coverage and set size on rung 4 of the sample ladder; the dashed curve is the whole sample (rung 2), where an absent or cut true host is never covered.
    inputs: [dp02_associations]
    decisions: []
    recipe:
      command: python src/dp02_fig.py credible_set --tier dp02 --dp02-credible-metrics own --associations {inputs.dp02_associations} --output {output}
  - id: dp02_credible_set_metrics
    type: metric
    format: json
    description: The dp02_credible_set curve (coverage, coverage given a surviving true host, mean set size, empty-set fraction per t), its values at t = 0.01, 0.034 and 0.05, the knee (grid point farthest from the chord of coverage versus mean set size, axes scaled to [0, 1]) and the top-k coverages; dp02_knee_transfer compares the coverage and size at the frozen DP0.2 baseline knee t = 0.034 with this table's own knee. coverage, mean_size and frac_empty on rung 4; coverage_sample over the whole sample (rung 2); ladder gives the counts.
    inputs: [dp02_associations]
    decisions: []
    recipe:
      command: python src/dp02_fig.py credible_set_metrics --tier dp02 --dp02-credible-metrics own --associations {inputs.dp02_associations} --output {output}
  - id: dp02_pa_mirror
    type: figure
    format: pdf
    description: >-
      The DC2 position-angle mirror. Left: for elongated hosts (axis ratio
      < 0.5 in both the cosmoDC2 truth of the dominant component and the
      DP0.2 PSF-subtracted moments) with the SN beyond 1 R_e, the SN offset
      angle (East of North, from the host truth position) relative to the
      pipeline moment PA of the matched host, to its mirror image (-PA), and
      to the cosmoDC2 position_angle_true. DC2 placed the SNe along
      +position_angle_true while the rendered galaxies, as the pipeline
      measures them, have PA = -position_angle_true, so the SNe line up with
      the mirror of the measured galaxy and not with the galaxy itself.
      Right: six deepCoadd cutouts (headline band, north up, east left) of
      large elongated hosts whose two PAs differ by more than 60 degrees and
      whose SN lies within 15 degrees of +PA at 1.3-3.5 R_e, with the cosmoDC2
      ellipse (+PA, 2 R_e) and the pipeline moment ellipse (2 half-light
      radii) drawn. Baseline (27 Oct 2026): 7,664 elongated hosts; mean
      cos 2(psi - PA) is -0.002 against the moment PA, 0.326 against its
      mirror and 0.335 against the cosmoDC2 PA, and the median
      |PA_mom + PA_cosmoDC2| is 1.3 degrees (|PA_mom - PA_cosmoDC2| 44.4).
      No paper documents this; it is recorded in AGENTS.md as a
      prior-insight-like note. Offset-shape analyses must use +PA; the
      association itself, which sees only the rendered image, is unaffected.
      Page 2 asks whether the SNe sit on the mirrored ellipse at the truth
      radii or on a smaller or rounder one, for every host with truth q <
      0.5 and no offset cap: (a) SN radius in units of the semi-major R_e for
      SNe within 30 degrees of the +PA major axis and of the minor axis, (b)
      the same in elliptical radius on the truth ellipse, (c) measured
      (moment and CModel) over cosmoDC2 half-light sizes, (d) the axis ratio
      of the stacked SN distribution about +PA versus the truth q, with q and
      q^0.4 drawn. Numbers in dp02_pa_mirror_metrics.
    inputs: [dp02_sample, dp02_associations, dp02_candidates, dp02_host_truth_shapes, rsp_token]
    decisions: [band]
    recipe:
      command: bash -c 'T=$TMPDIR; [ -n "$T" ] || T=/tmp; python src/dp02_pa_mirror.py --sample {inputs.dp02_sample} --associations {inputs.dp02_associations} --candidates {inputs.dp02_candidates} --shapes {inputs.dp02_host_truth_shapes} --band {decisions.band} --token-file {inputs.rsp_token} --cache-dir "$T/dp02_cutouts" --radius-page --output {output}'
      resources: {cpus: 4, memory: 24Gi}
  - id: dp02_pa_mirror_metrics
    type: metric
    format: json
    description: >-
      The dp02_pa_mirror numbers without the cutouts: the angle statistics of
      the elongated-host selection; radii (hosts with truth q < 0.5, no
      offset cap): quantiles of the SN radius over the semi-major R_e and of
      the elliptical radius on the truth ellipse for SNe within 30 degrees
      of the +PA major and minor axes, and their minor/major median ratios,
      also for the subset whose 6 R_e lies inside the sample's separation
      cut; measured over cosmoDC2 sizes (moment half-light semi-axes over the
      truth semi-axes, q_mom / q_true, CModel sqrt(ab) of the dominant
      component over the truth sqrt(ab)); the SN distribution's axis ratio
      per truth-q bin with the exponent alpha of q_SN = q^alpha; and the
      example selection rule with the offsets of the chosen and of all
      eligible hosts, so the figure's selection can be judged.
    inputs: [dp02_sample, dp02_associations, dp02_candidates, dp02_host_truth_shapes]
    decisions: [band]
    recipe:
      command: python src/dp02_pa_mirror.py --metrics --sample {inputs.dp02_sample} --associations {inputs.dp02_associations} --candidates {inputs.dp02_candidates} --shapes {inputs.dp02_host_truth_shapes} --band {decisions.band} --output {output}
      resources: {cpus: 4, memory: 24Gi}
  # ---- Tier 1b: OpenUniverse2024 (mirrors the DP0.2 chain; same scripts where only the inputs differ) ----
  - id: ou24_sn_table
    type: table
    format: parquet
    description: >-
      One row per OU2024 transient within 60 arcsec of a primary object of the
      22 tracts (its tract is that object's): skyCatalog id, position, z_CMB
      and class, the SNANA truth (GALID = true host id, GALSNSEP, GALSNDDLR,
      a_rot, HOSTGAL_*), and the true host's skyCatalog truth: position,
      redshift, ugrizy AB magnitudes, bulge and disk half-light radii (sqrt(ab),
      arcsec), axis ratios and major-axis angles (host_beta_*, from +x West
      toward North, equal to SNANA's a_rot), r- and i-band bulge/disk/knot light
      fractions (host_bt_i = bulge fraction) and stellar mass. Flags hostless,
      host_missing (host not in the galaxy files), skycat_host_missing.
    inputs: [ou24_sn_truth, ou24_host_truth, ou24_object]
    decisions: []
    recipe:
      command: python src/ou24_sn_table.py --truth-index {inputs.ou24_sn_truth} --galaxy-index {inputs.ou24_host_truth} --objects {inputs.ou24_object} --coverage-radius 60 --component-bands ri --workers 16 --output {output}
      resources: {cpus: 16, memory: 56Gi}
  - id: ou24_truth_match
    type: table
    format: parquet
    description: >-
      Hand-built truth-to-object match for every OU2024 true host (no
      MatchesTruth table exists for OU2024): all primary objects within 1
      arcsec of the skyCatalog host position; nearest_* is the closest, mag_*
      the one with |m_r(cModel) - m_r(truth)| < 1 and the lowest chi2 =
      (sep / 0.1")^2 + (dm / 0.2)^2. Carries n_within, multiple, no_match,
      matchers_agree and the nearest object's r-band moments, CModel radii,
      extendedness and deblend parent.
    inputs: [ou24_sn_table, ou24_object]
    decisions: []
    recipe:
      command: python src/ou24_truth_match.py --sn-table {inputs.ou24_sn_table} --objects {inputs.ou24_object} --match-radius 1.0 --max-dmag 1.0 --pos-sigma 0.1 --mag-sigma 0.2 --workers 16 --output {output}
      resources: {cpus: 16, memory: 40Gi}
  - id: ou24_candidates
    type: table
    format: parquet
    description: Every primary OU2024 object within the search radius of any transient of ou24_sn_table, one row per (transient, object) pair, with the dp02_candidates columns (src/dp02_candidates.py unchanged).
    inputs: [ou24_sn_table, ou24_object]
    decisions: [search_radius]
    recipe:
      command: python src/dp02_candidates.py --positions {inputs.ou24_sn_table} --objects {inputs.ou24_object} --search-radius {decisions.search_radius} --workers 16 --output {output}
      resources: {cpus: 16, memory: 56Gi}
  - id: ou24_sample
    type: table
    format: parquet
    description: >-
      One row per OU2024 transient in the test sample, with the dp02_sample
      columns: transient and true-host truth, host_objectId under truth_match
      (matches_truth = the magnitude-aware match, nearest_1arcsec = the
      nearest; both always carried as host_objectId_mt / _nn), the cut flags,
      and the elliptical offsets in skyCatalog half-light radii
      (offset_re_bulge, offset_re_disk, offset_re of the dominant component by
      B/T_i, bulge_dominated). FIXMAG sources peak after the survey and are
      always dropped. All redshifts are kept (median z 1.5; DP0.2 has only
      z < 1), so z < 1 splits are reported alongside. As dp02_sample it is
      rung 2 of the ladder: detectable under transient_peak_mag (the SNANA
      PEAKMAG_r, as peak_mag_r; every OU2024 transient peaks inside the
      survey), host-unmatched transients kept with host_objectId = -1, and
      the sample_ladder counts in the parquet metadata.
    inputs: [ou24_sn_table, ou24_truth_match]
    decisions: [truth_match, dp02_sample_cuts, transient_peak_mag]
    recipe:
      command: python src/ou24_sample.py --sn-table {inputs.ou24_sn_table} --match {inputs.ou24_truth_match} --truth-match {decisions.truth_match} --cuts {decisions.dp02_sample_cuts} --peak-mag {decisions.transient_peak_mag} --record-decisions --output {output}
      resources: {cpus: 4, memory: 24Gi}
  - id: ou24_associations
    type: table
    format: parquet
    description: As dp02_associations for the OU2024 sample. A candidate whose CModel radius is missing is dropped from SBW (no radius fallback).
    inputs: [ou24_sample, ou24_candidates]
    decisions: [sbw_profile, band, search_radius, dlr_max, dlr_radius, extendedness_cut, candidate_quality]
    recipe:
      command: python src/dp02_associate.py --sample {inputs.ou24_sample} --candidates {inputs.ou24_candidates} --profile {decisions.sbw_profile} --band {decisions.band} --search-radius {decisions.search_radius} --dlr-max {decisions.dlr_max} --dlr-radius {decisions.dlr_radius} --extendedness {decisions.extendedness_cut} --candidate-quality {decisions.candidate_quality} --workers 16 --output {output}
      resources: {cpus: 16, memory: 40Gi}
