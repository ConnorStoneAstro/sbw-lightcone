# ASTRA Analysis Specification

version: "0.0.14"
name: "SBW host association performance"
description: >-
  Tests the surface-brightness-weighted (SBW) host-association method for
  transients, as implemented in the sbw_host package, on four tiers of data:
  DP0.2 (DC2) with true hosts, the DES-SN5YR published hosts, the DELIGHT
  visually matched host set, and Rubin DP2 real data without any reference.
  SBW is taken as the framework; the questions are which form of SBW (fitted
  exponential, free-n Sersic, or deblended image stamps) recovers hosts best,
  and how SBW relates to the directional-light-radius (DLR) standard
  (disagreement rate, band dependence, agreement versus d_DLR) rather than
  which one wins. Each tier produces an association table, a recovery or
  disagreement metric and regime-binned figures; the DP0.2 tier adds SBW
  calibration (reliability) curves and the SBW/DLR agreement-versus-truth
  matrix; a cross-tier summary table collects them. Everything for DP0.2 runs
  on NERSC from the parquet copies of the DC2 truth and DP0.2 Object tables.

inputs:
  # ---- Tier 1: simulation with true hosts (DP0.2 / DC2) ----
  - id: dp02_sn_truth
    type: data
    source: "/global/cfs/cdirs/lsst/shared/DC2-prod/Run2.2i/truth/truth_merged_summary_v1-0-0/match_dr6_v2"
    description: >-
      DESC DC2 merged truth summary, one parquet per tract (166 tracts): every
      truth row (truth_type 1 galaxy, 2 star, 3 SN) with id, host_galaxy, ra,
      dec, redshift, fluxes and mag_r. SN rows (445k over the DC2 footprint)
      give the transient positions and the true host id; the host's own row
      gives its position, magnitude and redshift. The match_objectId column in
      these files refers to the DESC DR6 processing, not DP0.2, and is not used.
  - id: dp02_truth_match
    type: data
    source: "/global/cfs/cdirs/lsst/shared/rubin/DP0.2/match_ref_truth_summary_objectTable"
    description: >-
      Rubin's DP0.2 truth-to-object match (the TAP MatchesTruth table), one
      parquet per tract: truth id string to DP0.2 objectId with match_candidate,
      match_count and match_chisq. This is how a true host galaxy becomes a
      DP0.2 objectId under truth_match: matches_truth.
  - id: dp02_object
    type: data
    source: "data/dp02_objectTable_index.csv"
    description: >-
      DP0.2 Object table at NERSC, /global/cfs/cdirs/lsst/shared/rubin/DP0.2/objectTable,
      one parquet per tract (157 tracts, 1 TB), the same rows ingested into
      Qserv. The declared source is an index of those files (path, size,
      mtime, written by src/dp02_index_objects.py) because lc hashes declared
      inputs by content on every command and 1 TB takes 15 minutes; DP0.2 is
      a frozen 2022 release, so the index stands in for the bytes. Per band: CModel bulge (de Vaucouleurs) and
      disk (exponential) determinant radii bdReB/bdReD in pixels, component
      fluxes bdFluxB/bdFluxD, cModelFlux, HSM source and PSF moments
      ixx/iyy/ixy(PSF), kronRad, extendedness. The v23 bdE1 column is unusable
      (the E1 functor lacked parentheses: xx - yy/(xx+yy)), so orientation and
      axis ratio come from the PSF-subtracted HSM moments instead.
  - id: dp02_deblended_stamps
    type: data
    source: "RSP butler dp02 deepCoadd_deblendedModel / cutout service (not on NERSC)"
    description: >-
      Deblender model stamps for candidate hosts, used by the image-level
      (stamp) form of SBW. No DP0.2 images exist on NERSC, so this needs the
      RSP cutout service and is parked until a subsample is chosen.
  # ---- Tier 2: DES-SN5YR confident host matches ----
  - id: des_sn5yr_hosts
    type: data
    source: "https://github.com/des-science/DES-SN5YR (4_DISTANCES_COVMAT/DES-Dovekie_Metadata.csv, 0_DATA/DES-SN5YR_DES/DES-SN5YR_DES_HEAD.FITS.gz)"
    description: >-
      1623 DES SNe Ia of the Dovekie cosmology sample (IDSURVEY = 10) with the
      published HOSTGAL_RA/DEC (DLR-based, visually vetted) host positions.
  - id: des_dr2_objects
    type: data
    source: "tap://datalab.noirlab.edu/tap des_dr2.main (a_image, b_image, theta_j2000, flux_radius, flux_auto)"
    description: >-
      DES DR2 SExtractor shape and flux measurements for every object within the
      search radius of each DES SN; the candidate catalogue for both methods.
  # ---- Tier 3: DELIGHT visually matched hosts ----
  - id: delight_hosts
    type: data
    source: "DELIGHT (Forster et al. 2022, AJ 164 195) public training set: transient RA/Dec and visually matched host RA/Dec"
    description: >-
      Historical transients with hosts matched by eye; no ground truth but a
      vetted reference. Candidate galaxies must come from a survey with model
      fits covering these fields (see decision delight_catalogue).
  - id: delight_candidate_objects
    type: data
    source: "DESI Legacy Surveys DR10 Tractor catalogue (shape_r, shape_e1, shape_e2, sersic, flux_*) via NOIRLab Data Lab TAP"
    description: >-
      Candidate galaxies with parametric (EXP/DEV/SER) Tractor models around each
      DELIGHT transient.
  # ---- Tier 4: Rubin DP2, no truth ----
  - id: dp2_transients
    type: data
    source: "NERSC /global/cfs/cdirs/lsst/groups/TD/SN/EDP2/SN_candidates/{RC_sample,final_sample,parsnip_ddf,RC_lcfit_input_122k}.parquet (file chosen by decision dp2_sample)"
    description: >-
      DP2 SN candidate samples from the EDP2 transient working group (Mi Dai,
      R. Chen; README and README_RC.md in that directory). RC_sample.parquet:
      690 objects with a successful SALT3 fit (FITPROB > 0.01, |x1| < 3,
      |c| < 0.3) after nightly coadd, baseline correction and S/N cuts;
      final_sample.parquet: Mi Dai's 617 candidates with a SALT fit (overlap of
      102 with RC); parsnip_ddf.parquet: the 7823 DDF DiaObjects run through
      ParSNIP (also the set the three collaborator host-association runs
      cover); RC_lcfit_input_122k.parquet: all 122,465 objects passing the
      detection, reliability, |b| > 10 and S/N cuts before any fit. A local
      copy of the parsnip_ddf ids and positions is data/dp2_transients.csv
      (verified identical id set, 2026-10-26).
  - id: dp2_parsnip_ddf_sample
    type: data
    source: "NERSC /global/cfs/cdirs/lsst/groups/TD/SN/EDP2/SN_candidates/parsnip_ddf.parquet (local copy data/dp2_transients.csv)"
    description: >-
      The 7823-object DDF ParSNIP sample, fixed as the cross-method comparison
      set regardless of dp2_sample, because the collaborator associations below
      exist only for it.
  - id: dp2_dlr_legacy_jlee
    type: data
    source: "NERSC .../SN_candidates/EDP2_Host_Associations/Host_Association_DLR_J_Lee/host_association_DLR_8k_sample_v261009.csv"
    description: >-
      J. Lee's DLR host association of the 7823 DDF sample using DESI Legacy
      Surveys DR10 Tractor shapes (SHAPE_R, SHAPE_E1/E2, TYPE) with photo-z;
      columns include ddlr, ddlr_second, n_candidates, has_host (7809 rows).
  - id: dp2_delight_yjkang
    type: data
    source: "NERSC .../SN_candidates/EDP2_Host_Associations/Host_Association_Delight_Prost_YJ_Kang/delight_parsnip_dp2_8k_results.parquet (+ _legacy_dr10_photoz_specz.parquet)"
    description: >-
      Y. J. Kang's DELIGHT (and SExtractor) predicted host positions for the
      7823 DDF sample on image cutouts, with DP2 Object and Legacy DR10
      counterparts and redshifts in the companion file.
  - id: dp2_object
    type: data
    source: "tap://data.lsst.cloud/api/tap dp2 Object (MultiProFit sersic_* and exponential_* fits) | NERSC HATS object_collection"
    description: >-
      DP2 Object table rows with both MultiProFit fits, queried per transient
      region (grouped TAP) or via the LSDB HATS copy at NERSC.

outputs:
  # ---- Tier 1: DP0.2 ----
  - id: dp02_candidates
    type: table
    format: parquet
    description: >-
      Every DP0.2 primary object within the search radius of any DC2 SN, one
      row per (SN, object) pair, carrying the per-band CModel component radii
      and fluxes, HSM moments, extendedness and position. Extracted once from
      the 157 tract files; everything downstream reads this instead of the
      1 TB Object table.
    inputs: [dp02_sn_truth, dp02_object]
    decisions: [search_radius]
    recipe:
      command: python src/dp02_candidates.py --truth {inputs.dp02_sn_truth} --objects {inputs.dp02_object} --search-radius {decisions.search_radius} --output {output}
      resources: {cpus: 16, memory: 56Gi}
  - id: dp02_sample
    type: table
    format: parquet
    description: >-
      One row per DC2 SN in the test sample: SN position and redshift, true
      host truth id, position, mag_r and redshift, the true host's DP0.2
      objectId (per truth_match) and the SN-host separation, plus the flags
      the sample cuts were based on (missing host row, host unmatched,
      separation cut). Both truth matchers are always computed
      (host_objectId_mt, host_objectId_nn with match_sep_arcsec);
      host_objectId is the one truth_match selects, and the parquet metadata
      key truth_match_precut counts how the two compare before the
      matcher-dependent cut.
    inputs: [dp02_sn_truth, dp02_truth_match, dp02_candidates]
    decisions: [truth_match, dp02_sample_cuts]
    recipe:
      command: python src/dp02_sample.py --truth {inputs.dp02_sn_truth} --match {inputs.dp02_truth_match} --candidates {inputs.dp02_candidates} --truth-match {decisions.truth_match} --cuts {decisions.dp02_sample_cuts} --output {output}
      resources: {cpus: 4, memory: 24Gi}
  - id: dp02_associations
    type: table
    format: parquet
    description: >-
      One row per sample SN: true host objectId, SBW top host and its p_sbw,
      p_sbw of the true host and its rank, frac_light_beyond, DLR host and
      d_dlr, d_dlr of the true host, number of candidates, and the derived
      flags sbw_correct, dlr_correct, agree. flb_max is the largest
      frac_light_beyond over all candidates (an alternative hostless statistic
      to flb_best, the SBW top host's).
    inputs: [dp02_sample, dp02_candidates]
    decisions: [sbw_profile, band, search_radius, dlr_max, dlr_radius, extendedness_cut]
    recipe:
      command: python src/dp02_associate.py --sample {inputs.dp02_sample} --candidates {inputs.dp02_candidates} --profile {decisions.sbw_profile} --band {decisions.band} --search-radius {decisions.search_radius} --dlr-max {decisions.dlr_max} --dlr-radius {decisions.dlr_radius} --extendedness {decisions.extendedness_cut} --workers 16 --output {output}
      resources: {cpus: 16, memory: 40Gi}
  - id: dp02_recovery
    type: metric
    format: json
    description: Fraction of SNe whose true host is the top-ranked host, per method, with binomial intervals, plus the SBW-DLR agreement rate and sample size, the fraction SBW declares hostless under sbw_hostless_cut and the SBW recovery with that cut applied.
    inputs: [dp02_associations]
    decisions: [sbw_hostless_cut]
    recipe:
      command: python src/dp02_fig.py recovery --associations {inputs.dp02_associations} --hostless-cut {decisions.sbw_hostless_cut} --output {output}
  - id: dp02_calibration
    type: figure
    format: pdf
    description: >-
      SBW reliability curve: SNe binned by the top host's p_sbw, against the
      fraction of those SNe whose top host is the true host. A calibrated
      probability follows the 1:1 line.
    inputs: [dp02_associations]
    decisions: []
    recipe:
      command: python src/dp02_fig.py calibration --associations {inputs.dp02_associations} --output {output}
  - id: dp02_calibration_by_band
    type: figure
    format: pdf
    description: The reliability curve recomputed in each of u g r i z y with the headline profile, one panel per band, independent of the band decision.
    inputs: [dp02_sample, dp02_candidates]
    decisions: [sbw_profile, search_radius, dlr_max, dlr_radius, extendedness_cut]
    recipe:
      command: python src/dp02_sweep.py band --sample {inputs.dp02_sample} --candidates {inputs.dp02_candidates} --profile {decisions.sbw_profile} --search-radius {decisions.search_radius} --dlr-max {decisions.dlr_max} --dlr-radius {decisions.dlr_radius} --extendedness {decisions.extendedness_cut} --output {output}
      resources: {cpus: 16, memory: 40Gi}
  - id: dp02_calibration_by_profile
    type: figure
    format: pdf
    description: The reliability curve recomputed for each analytic SBW form (exponential n = 1, de Vaucouleurs n = 4, moment Gaussian) in the headline band, independent of the sbw_profile decision.
    inputs: [dp02_sample, dp02_candidates]
    decisions: [band, search_radius, dlr_max, dlr_radius, extendedness_cut]
    recipe:
      command: python src/dp02_sweep.py profile --sample {inputs.dp02_sample} --candidates {inputs.dp02_candidates} --band {decisions.band} --search-radius {decisions.search_radius} --dlr-max {decisions.dlr_max} --dlr-radius {decisions.dlr_radius} --extendedness {decisions.extendedness_cut} --output {output}
      resources: {cpus: 16, memory: 40Gi}
  - id: dp02_agreement_matrix
    type: figure
    format: pdf
    description: >-
      3x3 matrix of SBW (host true / host wrong / hostless under
      sbw_hostless_cut) against DLR (host true / host wrong / hostless):
      counts and fractions of SNe in each cell, so the disagreements split
      into who was right and both methods' hostless calls are visible.
    inputs: [dp02_associations]
    decisions: [sbw_hostless_cut]
    recipe:
      command: python src/dp02_fig.py agreement_matrix --associations {inputs.dp02_associations} --hostless-cut {decisions.sbw_hostless_cut} --output {output}
  - id: dp02_agreement_vs_ddlr
    type: figure
    format: pdf
    description: Fraction of SNe where SBW and DLR pick the same host, as a function of the DLR host's d_DLR (and of the SBW host's d_DLR).
    inputs: [dp02_associations]
    decisions: []
    recipe:
      command: python src/dp02_fig.py agreement_vs_ddlr --associations {inputs.dp02_associations} --output {output}
  - id: dp02_recovery_vs_ddlr
    type: figure
    format: pdf
    description: Recovery fraction per method as a function of the true host's d_DLR.
    inputs: [dp02_associations]
    decisions: []
    recipe:
      command: python src/dp02_fig.py recovery_vs --x ddlr --associations {inputs.dp02_associations} --output {output}
  - id: dp02_recovery_vs_separation
    type: figure
    format: pdf
    description: Recovery fraction per method versus transient-host angular separation.
    inputs: [dp02_associations]
    decisions: []
    recipe:
      command: python src/dp02_fig.py recovery_vs --x separation --associations {inputs.dp02_associations} --output {output}
  - id: dp02_recovery_vs_host_mag
    type: figure
    format: pdf
    description: Recovery fraction per method versus true-host r magnitude (faint-host regime).
    inputs: [dp02_associations]
    decisions: []
    recipe:
      command: python src/dp02_fig.py recovery_vs --x host_mag --associations {inputs.dp02_associations} --output {output}
  - id: dp02_recovery_vs_redshift
    type: figure
    format: pdf
    description: Recovery fraction per method versus SN redshift (hosts shrink and fade with z).
    inputs: [dp02_associations]
    decisions: []
    recipe:
      command: python src/dp02_fig.py recovery_vs --x redshift --associations {inputs.dp02_associations} --output {output}
  - id: dp02_p_true_host
    type: figure
    format: pdf
    description: Distribution of the p_sbw assigned to the true host (log scale), split by whether SBW ranked it first; shows how confident the failures are.
    inputs: [dp02_associations]
    decisions: []
    recipe:
      command: python src/dp02_fig.py p_true_host --associations {inputs.dp02_associations} --output {output}
  - id: dp02_band_dependence
    type: figure
    format: pdf
    description: SBW recovery and SBW-DLR agreement per band (u g r i z y), and how often the SBW top host changes between bands.
    inputs: [dp02_sample, dp02_candidates]
    decisions: [sbw_profile, search_radius, dlr_max, dlr_radius, extendedness_cut]
    recipe:
      command: python src/dp02_sweep.py band_dependence --sample {inputs.dp02_sample} --candidates {inputs.dp02_candidates} --profile {decisions.sbw_profile} --search-radius {decisions.search_radius} --dlr-max {decisions.dlr_max} --dlr-radius {decisions.dlr_radius} --extendedness {decisions.extendedness_cut} --output {output}
      resources: {cpus: 16, memory: 40Gi}
  - id: dp02_profile_sweep
    type: table
    format: csv
    description: >-
      Recovery fraction, DLR agreement and calibration error for every
      analytic SBW form (exponential n = 1, de Vaucouleurs n = 4, moment Gaussian)
      side by side, independent of the headline sbw_profile choice. The stamp
      form joins once dp02_deblended_stamps exists.
    inputs: [dp02_sample, dp02_candidates]
    decisions: [band, search_radius, dlr_max, dlr_radius, extendedness_cut]
    recipe:
      command: python src/dp02_sweep.py profile_table --sample {inputs.dp02_sample} --candidates {inputs.dp02_candidates} --band {decisions.band} --search-radius {decisions.search_radius} --dlr-max {decisions.dlr_max} --dlr-radius {decisions.dlr_radius} --extendedness {decisions.extendedness_cut} --output {output}
      resources: {cpus: 16, memory: 40Gi}
  - id: dp02_random_positions
    type: table
    format: parquet
    description: >-
      One random sky position per DC2 truth SN, uniform on the sphere within
      the SN's tract (RA uniform, sin dec uniform inside the bounding box of the
      tract's primary DP0.2 objects, redrawn unless a 1 arcmin cell there holds
      a primary object, so edge-tract corners outside the footprint are
      excluded). sn_id is the negated truth SN id; seeded.
    inputs: [dp02_sn_truth, dp02_object]
    decisions: []
    recipe:
      command: python src/dp02_random_positions.py --truth {inputs.dp02_sn_truth} --objects {inputs.dp02_object} --output {output}
      resources: {cpus: 16, memory: 40Gi}
  - id: dp02_random_candidates
    type: table
    format: parquet
    description: The dp02_candidates extraction run on dp02_random_positions instead of the truth SNe.
    inputs: [dp02_random_positions, dp02_object]
    decisions: [search_radius]
    recipe:
      command: python src/dp02_candidates.py --positions {inputs.dp02_random_positions} --objects {inputs.dp02_object} --search-radius {decisions.search_radius} --output {output}
      resources: {cpus: 16, memory: 56Gi}
  - id: dp02_random_associations
    type: table
    format: parquet
    description: SBW and DLR association of every random position, with the same columns as dp02_associations and no true host (host_objectId = -1).
    inputs: [dp02_random_positions, dp02_random_candidates]
    decisions: [sbw_profile, band, search_radius, dlr_max, dlr_radius, extendedness_cut]
    recipe:
      command: python src/dp02_associate.py --positions {inputs.dp02_random_positions} --candidates {inputs.dp02_random_candidates} --profile {decisions.sbw_profile} --band {decisions.band} --search-radius {decisions.search_radius} --dlr-max {decisions.dlr_max} --dlr-radius {decisions.dlr_radius} --extendedness {decisions.extendedness_cut} --output {output}
      resources: {cpus: 16, memory: 40Gi}
  - id: dp02_hostless_indicator
    type: figure
    format: pdf
    description: >-
      Hostless indicators, real SNe versus random positions: (a) flb_best
      distributions (real SBW-correct, real SBW-wrong, random); (b) fraction
      rejected versus threshold for flb_best < t; (c) the same for the DLR rule
      d_DLR_min > t; (d) random positions rejected versus real SNe kept for
      SBW (flb_best, flb_max) and DLR, with the sbw_hostless_cut and dlr_max
      operating points marked.
    inputs: [dp02_associations, dp02_random_associations]
    decisions: [sbw_hostless_cut, dlr_max]
    recipe:
      command: python src/dp02_fig.py hostless_indicator --associations {inputs.dp02_associations} --random {inputs.dp02_random_associations} --hostless-cut {decisions.sbw_hostless_cut} --dlr-max {decisions.dlr_max} --output {output}
  - id: dp02_hostless_metrics
    type: metric
    format: json
    description: Real SNe kept and random positions rejected at flb_best and flb_max thresholds 0.001, 0.01, 0.05, 0.1 and d_DLR thresholds 3, 4, 5 (Wilson intervals), and the fraction of random positions whose SBW host has P > 0.5 (landing on a galaxy).
    inputs: [dp02_associations, dp02_random_associations]
    decisions: []
    recipe:
      command: python src/dp02_fig.py hostless_metrics --associations {inputs.dp02_associations} --random {inputs.dp02_random_associations} --output {output}
  - id: dp02_truth_match_comparison
    type: metric
    format: json
    description: >-
      The two truth matchers side by side: how many SNe get a host under one
      matcher but not the other and how many get a different host objectId
      (before the matcher-dependent sample cut and within the sample), SBW and
      DLR recovery restricted to SNe where the matchers agree and where they
      differ, and the 3x3 agreement-matrix cells against each truth on the SNe
      both matchers resolve.
    inputs: [dp02_sample, dp02_associations]
    decisions: [sbw_hostless_cut]
    recipe:
      command: python src/dp02_truth_match.py --sample {inputs.dp02_sample} --associations {inputs.dp02_associations} --hostless-cut {decisions.sbw_hostless_cut} --output {output}
  # ---- Tier 2: DES ----
  - id: des_associations
    type: table
    format: parquet
    description: One row per DES SN with the published host, SBW top host, DLR host and all metrics.
    inputs: [des_sn5yr_hosts, des_dr2_objects]
    decisions: [sbw_profile, band, search_radius, dlr_max, dlr_radius, extendedness_cut, reference_match]
  - id: des_recovery
    type: metric
    format: json
    description: Fraction of DES SNe for which each method returns the published host.
    inputs: [des_associations]
    decisions: []
  - id: des_agreement_vs_ddlr
    type: figure
    format: pdf
    description: SBW-DLR agreement and recovery of the published host versus d_DLR and separation.
    inputs: [des_associations]
    decisions: []
  - id: des_disagreement_gallery
    type: figure
    format: pdf
    description: Cutout gallery of DES cases where SBW and DLR pick different hosts, marking the published host.
    inputs: [des_associations]
    decisions: []
  # ---- Tier 3: DELIGHT ----
  - id: delight_associations
    type: table
    format: parquet
    description: One row per DELIGHT transient with the visually matched host, SBW top host and DLR host.
    inputs: [delight_hosts, delight_candidate_objects]
    decisions: [sbw_profile, band, search_radius, dlr_max, dlr_radius, delight_catalogue, reference_match]
  - id: delight_recovery
    type: metric
    format: json
    description: Fraction of DELIGHT transients for which each method returns the visually matched host.
    inputs: [delight_associations]
    decisions: []
  - id: delight_disagreement_gallery
    type: figure
    format: pdf
    description: Cutout gallery of DELIGHT cases where SBW, DLR and the visual match disagree.
    inputs: [delight_associations]
    decisions: []
  # ---- Tier 4: DP2 ----
  - id: dp2_associations
    type: table
    format: parquet
    description: One row per DP2 transient with SBW and DLR hosts, all bands, both MultiProFit fits.
    inputs: [dp2_transients, dp2_object]
    decisions: [dp2_sample, sbw_profile, band, search_radius, dlr_max, dlr_radius, extendedness_cut, exclude_suspect]
  - id: dp2_disagreement_rate
    type: metric
    format: json
    description: Fraction of DP2 transients where SBW and DLR pick different hosts, overall and per band.
    inputs: [dp2_associations]
    decisions: []
  - id: dp2_agreement_vs_ddlr
    type: figure
    format: pdf
    description: SBW-DLR agreement versus d_DLR of the DLR host and versus p_sbw of the SBW host.
    inputs: [dp2_associations]
    decisions: []
  - id: dp2_band_consistency
    type: figure
    format: pdf
    description: How often the SBW top host changes with band, and the exponential-versus-Sersic fit agreement.
    inputs: [dp2_associations]
    decisions: []
  - id: dp2_disagreement_gallery
    type: figure
    format: pdf
    description: Cutout gallery of representative DP2 disagreements on deep_coadd images.
    inputs: [dp2_associations]
    decisions: []
  - id: dp2_cross_method_agreement
    type: table
    format: csv
    description: >-
      Pairwise host-agreement matrix on the 7823 DDF sample between SBW,
      sbw_host's own DLR on DP2 fits, J. Lee's DLR on Legacy DR10 shapes and
      Y. J. Kang's DELIGHT positions, with hostless rates per method; hosts are
      matched by position under reference_match.
    inputs: [dp2_parsnip_ddf_sample, dp2_object, dp2_dlr_legacy_jlee, dp2_delight_yjkang]
    decisions: [sbw_profile, band, search_radius, dlr_max, dlr_radius, extendedness_cut, reference_match]
  # ---- Cross-tier summary ----
  - id: summary_table
    type: table
    format: csv
    description: One row per dataset and method with recovery (where a reference exists), disagreement rate and sample size.
    inputs: [dp02_recovery, des_recovery, delight_recovery, dp2_disagreement_rate]
    decisions: []

decisions:
  sbw_profile:
    label: Form of the host light model used by SBW
    rationale: >-
      The core question of the paper. Parametric fits are cheap and available in
      every catalogue; the deblended stamp form is model-free but depends on the
      deblender. Exponential is the package default because the free-n fit pins
      ~3% of galaxies at n ~ 6 whose wings dominate from far away.
    default: exponential
    options:
      exponential:
        label: Exponential (n = 1) fit; on DP0.2 the CModel disk component radius with the total cModel flux
        insights: [dc2_sn_position_sampled_from_sersic_profile, legacy_tractor_model_set, legacy_single_shape_across_bands]
      sersic:
        label: Free-n Sersic fit; on DP0.2 the CModel de Vaucouleurs (n = 4) component radius with the total cModel flux (no fracDev is exported, so no composite)
        insights: [ou2024_hostlib_sb_weighted_placement, ou2024_galaxy_model_bulge_disk_knots, dc2_sn_position_sampled_from_sersic_profile, dc2_galaxy_model_bulge_disk_fixed_sersic, dc2_pipeline_runs_cmodel_photometry, legacy_tractor_model_set, legacy_single_shape_across_bands, qu2024_sim_sn_placement_intensity_weighted, qu2024_sersic_radii_scaled_0p8]
      moments:
        label: Gaussian with the PSF-subtracted second-moment ellipse and the cModel flux (the DLR literature's shape, used as a light model)
        insights: [sullivan06_dlr_ellipse_is_sextractor_moments, gupta16_dlr_defined_from_sextractor_moment_ellipse]
      stamps:
        label: Image-level deblended model stamps (sbw_host.stamps); not available on DP0.2 at NERSC
        insights: [dc2_random_walk_knots_perturb_disk_profile, delight_catastrophic_failure_mode_large_hosts, delight_nearby_sample_asiago_hecate, legacy_tractor_fails_on_large_galaxies, ghost_gradient_ascent_beats_dlr_12_vs_16_pct, ghost_image_method_fails_in_crowded_large_host_fields]
  band:
    label: Band in which surface brightness is evaluated
    rationale: r is the deepest and best-fit band in Rubin; wavelength dependence is reported as its own output.
    default: r
    options:
      r:
        label: r
        insights: [delight_images_ps1_rband_stamps, legacy_coverage_and_depth, legacy_single_shape_across_bands]
      i: { label: i }
      g:
        label: g
        insights: [legacy_coverage_and_depth]
      z:
        label: z
        insights: [legacy_coverage_and_depth, legacy_z_band_best_image_quality]
  search_radius:
    label: Candidate search radius
    rationale: 30 arcsec captures hosts out to several half-light radii for all but the largest nearby galaxies.
    default: r30
    options:
      r15:
        label: 15 arcsec (DES-SN5YR data convention)
        insights: [qu2024_dlr_threshold_4_radius_15arcsec, gupta16_search_radius_30arcsec_loses_few_true_hosts]
      r30:
        label: 30 arcsec
        insights: [sullivan06_candidate_search_radius_10arcsec, ou2024_sne_truth_table_host_id_and_separation, qu2024_dlr_threshold_4_radius_15arcsec, qu2024_sim_matching_10arcsec_10gal, ghost_ps1_30arcsec_cone_search, gupta16_search_radius_30arcsec_loses_few_true_hosts]
      r60:
        label: 60 arcsec (covers the whole DELIGHT labelled set)
        insights: [delight_host_set_assembly]
  dlr_max:
    label: Maximum d_DLR for a DLR assignment
    rationale: Gupta et al. 2016 and DES-SN use 4; beyond it the transient is declared hostless.
    default: d4
    options:
      d4:
        label: "d_DLR <= 4"
        insights: [qu2024_dlr_threshold_4_radius_15arcsec, qu2024_hostless_rate_faint_hosts, qu2024_sim_matching_10arcsec_10gal, gupta16_dlr_threshold_4_is_nominal_sdss_choice_not_optimised]
      d5:
        label: "d_DLR <= 5"
        insights: [sullivan06_dlr_isophotal_r3_threshold_r5, sullivan06_hostless_fraction_7pct, ghost_dlr_max_extended_to_5, gupta16_dlr_threshold_4_is_nominal_sdss_choice_not_optimised]
  dlr_radius:
    label: Ellipse used for the DLR radius
    rationale: >-
      Every published DLR implementation (Sullivan+06, Gupta+16, Qu+24, GHOST)
      uses a second-moment or Kron ellipse, and Gupta+16 show that fitted
      half-light radii without a quality cut degrade DLR. The package default
      is the model half-light ellipse because that is what SBW itself uses and
      it keeps d_dlr equal to the transient's elliptical radius; the moment
      ellipse is the literature-faithful alternative, and the DES tier must use
      it to reproduce the published DES hosts.
    default: half_light
    options:
      half_light:
        label: Model half-light ellipse (1.386 x reff for MultiProFit; flux-weighted bulge/disk radius on DP0.2)
        insights: [qu2024_sersic_radii_scaled_0p8]
      moments:
        label: "Second-moment (HSM or SExtractor A, B) ellipse"
        insights: [sullivan06_dlr_ellipse_is_sextractor_moments, sullivan06_dlr_isophotal_r3_threshold_r5, delight_sextractor_ellipse_failures_kept, qu2024_dlr_recipe_sextractor_moments, ghost_dlr_uses_moments_and_kron_radius_best_snr_band, gupta16_dlr_defined_from_sextractor_moment_ellipse, gupta16_fitted_half_light_radius_degrades_dlr_matching]
  extendedness_cut:
    label: Point-source rejection
    rationale: Stars contaminate candidate lists; but faint hosts are sometimes classed as stars (the dominant DES failure mode).
    default: ext05
    options:
      ext05:
        label: "refExtendedness (or survey equivalent) >= 0.5"
        insights: [legacy_psf_type_contains_compact_galaxies, ghost_star_cut_is_deliberately_lenient, gupta16_compact_objects_removed_from_candidate_catalogue]
      none:
        label: Keep all objects
        insights: [legacy_psf_type_contains_compact_galaxies]
  sbw_hostless_cut:
    label: frac_light_beyond below which SBW declares a transient hostless
    rationale: >-
      frac_light_beyond is the fraction of a host's light fainter than the
      isophote through the transient, so it is SBW's natural hostless
      statistic: a transient on a galaxy's isophotes has a sizeable fraction
      of the light beyond it, one far in the wings has almost none. The cut
      trades real transients lost against random positions rejected (see
      dp02_hostless_indicator); 0.01 is the default as the point where the
      real loss is still small. Used for the 3x3 agreement matrix and the
      hostless-aware recovery; the threshold sweep itself is an output.
    default: flb01
    options:
      flb001:
        label: "flb_best < 0.001 (lenient: only far-wing positions are hostless)"
      flb01:
        label: "flb_best < 0.01"
      flb05:
        label: "flb_best < 0.05 (strict)"
  exclude_suspect:
    label: Drop fits flagged as suspect (deblend-halo phantoms)
    default: keep
    options:
      keep:
        label: Keep suspect fits in the probabilities
        insights: [delight_sextractor_ellipse_failures_kept]
      drop:
        label: Exclude suspect fits
        insights: [qu2024_sersic_radii_scaled_0p8]
  truth_match:
    label: How the DC2 true host is linked to a pipeline object
    default: matches_truth
    options:
      matches_truth:
        label: Rubin's DP0.2 truth-object match table (TAP MatchesTruth)
        insights: [dc2_truth_match_magnitude_within_1arcsec, dc2_truth_table_single_entry_per_galaxy]
      nearest_1arcsec:
        label: Nearest primary Object within 1 arcsec of the host truth position (among the SN's candidates)
        insights: [dc2_truth_match_magnitude_within_1arcsec]
  dp02_sample_cuts:
    label: DP0.2 SN sample cleaning
    rationale: >-
      Every cut drops SNe whose host row is missing (~5%) or whose host has no
      DP0.2 object under truth_match; the options differ in how far from its
      host an SN may sit. DC2 drew SN positions from the host component's full
      Sersic profile, so ~9% sit > 3 arcsec from the host centre, many far out
      in n = 4 bulge wings where no catalogue method (nor a human) would assign
      them. A fixed angular cut is unfair to large nearby hosts, which span
      many arcsec (the recovery-vs-separation curve suggests a geometric cut
      would have to be ~10 arcsec to stop hurting the results); a cut in units
      of the host's own half-light radius removes the unphysical tail without
      penalising large hosts, so it is the default. The 3 arcsec cut is kept for
      comparability with the first results.
    default: physical
    options:
      clean3:
        label: Drop SNe whose host row is missing, unmatched to an object, or > 3 arcsec from the host truth position (the first results)
        insights: [dc2_hostless_sn_fraction, dc2_host_choice_proportional_to_stellar_mass]
      clean10:
        label: As clean3 but > 10 arcsec
        insights: [dc2_hostless_sn_fraction, dc2_sn_position_sampled_from_sersic_profile]
      physical:
        label: As clean3 but drop only SNe beyond N half-light radii of the host along its truth ellipse (bulge R_e for B/T > 0.5, disk R_e otherwise; N set in src/dp02_sample.py)
        insights: [dc2_hostless_sn_fraction, dc2_sn_position_sampled_from_sersic_profile, dc2_sn_offsets_scale_with_hosting_component_size]
      all:
        label: Keep every SN truth row
        insights: [dc2_hostless_sn_fraction]
  dp2_sample:
    label: DP2 transient sample for the real-data tier
    rationale: >-
      Objects with a successful SALT3 fit are credible SNe, so the headline
      disagreement rates are computed on them; the larger samples trade purity
      for statistics and are available as universes.
    default: rc_salt
    options:
      rc_salt: { label: "RC_sample.parquet: 690 SALT3-fit candidates (R. Chen)" }
      md_final: { label: "final_sample.parquet: 617 SALT-fit candidates (M. Dai)" }
      parsnip_ddf: { label: "parsnip_ddf.parquet: 7823 DDF ParSNIP candidates" }
      rc_all: { label: "RC_lcfit_input_122k.parquet: 122,465 objects with minimal cuts" }
  reference_match:
    label: How a method's chosen host is matched to the reference host position
    rationale: >-
      DES HOSTGAL and DELIGHT visual positions are catalogue centroids that can
      differ from the Rubin, DES DR2 or Legacy object centroid by arcseconds,
      and by more for large nearby hosts (DELIGHT reports tails of a few
      arcsec). The tolerance sets what counts as agreement with the reference.
    default: pos_1arcsec
    options:
      pos_1arcsec:
        label: Same host if centroids agree within 1 arcsec
      pos_3arcsec:
        label: Same host if centroids agree within 3 arcsec
        insights: [delight_visual_vetting_by_twelve_people, delight_catastrophic_failure_mode_large_hosts]
      frac_semimajor:
        label: Same host if the reference position lies within 0.5 half-light semi-major axes of the chosen host
        insights: [delight_catastrophic_failure_mode_large_hosts]
  delight_catalogue:
    label: Candidate catalogue for the DELIGHT fields
    default: legacy_dr10
    options:
      legacy_dr10:
        label: DESI Legacy Surveys DR10 Tractor models
        insights: [delight_alerce_sample_from_ztf_and_catalogue_positions, delight_visual_vetting_by_twelve_people, legacy_tractor_model_set, legacy_model_type_chosen_by_joint_residual, legacy_coverage_and_depth, legacy_tractor_fails_on_large_galaxies]
      ps1_stamps:
        label: Pan-STARRS stacks with the stamp form of SBW
        insights: [delight_images_ps1_rband_stamps, delight_alerce_sample_from_ztf_and_catalogue_positions]

prior_insights:
  sullivan06_dlr_original_definition:
    claim: 'The DLR-style host assignment originates here: the SN-galaxy separation is normalised by the
      galaxy''s apparent size along the SN-galaxy direction (an elliptical radius R), explicitly because
      the nearest host in arcseconds is sometimes the wrong identification.'
    created_at: '2026-10-26T20:04:08Z'
    evidence:
    - id: ev1
      doi: 10.1086/506137
      quote:
        exact: Instead we use a separation normalized by the apparent size of the galaxy to which the SN
          is being compared
        prefix: 'probably not the correct identification. '
        suffix: ' ( Fig. 1). We calculate the separation of the SN'
      location:
        page: 4
  sullivan06_dlr_ellipse_is_sextractor_moments:
    claim: The ellipse used for the original directional radius is the SExtractor shape (semimajor rA, semiminor
      rB, position angle theta), i.e. a second-moment A/B/THETA ellipse, not a model half-light ellipse.
    created_at: '2026-10-26T20:04:08Z'
    evidence:
    - id: ev1
      doi: 10.1086/506137
      quote:
        exact: The elliptical shape is determined by SExtractor, defined by semimajor (rA ) and semiminor
          (rB ) axes together with a position angle
        prefix: 'to a given host center (xgal , ygal ). '
        suffix: ', with R given by'
      location:
        page: 4
  sullivan06_dlr_isophotal_r3_threshold_r5:
    claim: R ~ 3 corresponds to the SExtractor isophotal limit of an object, and only galaxies with R <=
      5 are considered as candidate hosts; this R <= 5 cut is the origin of the d_DLR <= 5 convention (R
      is in units of the moment ellipse, so it is not the same physical cut as 5 half-light radii).
    created_at: '2026-10-26T20:04:08Z'
    evidence:
    - id: ev1
      doi: 10.1086/506137
      quote:
        exact: The isophotal limit of a given object corresponds to R
        prefix: 'is nearest in terms of this parameter. '
        suffix: 3; we consider only galaxies with R
      location:
        page: 4
    scope: SExtractor A/B moment ellipse on CFHTLS deep stacks; the numerical thresholds are tied to that
      ellipse definition and detection depth.
  sullivan06_dlr_assignment_rule_nearest_in_r:
    claim: 'Host assignment is a hard argmin: candidates are ranked by R and the SN is assigned to the single
      galaxy with the smallest R, with no probabilistic weighting and no handling of near-ties.'
    created_at: '2026-10-26T20:04:08Z'
    evidence:
    - id: ev1
      doi: 10.1086/506137
      quote:
        exact: the hosts ordered by R, and each SN is assigned to the host that is nearest in terms of this
          parameter.
        prefix: 'The value R is determined for every candidate host galaxy, '
        suffix: ' The isophotal limit of a given object corresponds to R'
      location:
        page: 4
    - id: ev2
      doi: 10.1086/506137
      quote:
        exact: The nearest host in terms of this R-parameter is considered to be the correct host
        prefix: '5R ellipse overplotted (see x 2.3 for the definition of R). '
        suffix: ; SNes with no hosts inside 5R are considered
      location:
        page: 3
  sullivan06_candidate_search_radius_10arcsec:
    claim: The original DLR implementation searched for candidate hosts only within 10 arcsec of the SN
      position on i-band-detected deep stacks, far smaller than the 30-60 arcsec considered here; at SNLS
      redshifts (0.2 < z < 0.75) 10 arcsec is still several host radii.
    created_at: '2026-10-26T20:04:08Z'
    evidence:
    - id: ev1
      doi: 10.1086/506137
      quote:
        exact: to identify all potential host galaxies within 1000 of the SN position and simultaneously
          measure photometric information on the host galaxies
        prefix: 'see Holwerda [2005] for an excellent user guide) '
        suffix: . SExtractor is used in dual-image mode
      location:
        page: 3
    scope: The '1000' in the extracted text is the PDF rendering of 10 arcsec; SNLS deep-stack depth, 0.2
      < z < 0.75.
  sullivan06_hostless_fraction_7pct:
    claim: For 7% of SNLS SNe Ia no SExtractor galaxy is found with R <= 5; those are treated as hostless
      and the host flux is replaced by a 3 arcsec aperture at the SN position.
    created_at: '2026-10-26T20:04:08Z'
    evidence:
    - id: ev1
      doi: 10.1086/506137
      quote:
        exact: In some cases (7%), no host galaxy is identified by SExtractor with R
        prefix: 'we consider only galaxies with R  5. '
        suffix: 5; we then measure the flux and flux error inside a
      location:
        page: 4
    scope: SNLS spectroscopically confirmed SNe Ia on CFHTLS deep stacks; hostless fraction depends on stack
      depth and redshift range.
  ou2024_hostlib_sb_weighted_placement:
    claim: OpenUniverse2024 transients were placed by SNANA using a HOSTLIB in which each galaxy carries
      a bulge+disk Sersic profile, with the transient position drawn with weight proportional to the local
      surface brightness. The truth placement is therefore exactly a surface-brightness-weighted model,
      so SBW with a Sersic-type profile matches the simulation's generative prior while DLR does not.
    created_at: '2026-10-26T20:04:08Z'
    evidence:
    - id: ev1
      doi: 10.48550/arXiv.2501.05632
      quote:
        exact: The HOSTLIB includes a bulge+disk Sersic profile that is used to place transients near a
          galaxy with a weight proportional to the local surface brightness.
        prefix: construct a host library (HOSTLIB) for the SNANA simulation.
        suffix: The HOSTLIB also includes estimates of stellar mass and star formation rate
      location:
        page: 11
    scope: OpenUniverse2024 (SNANA HOSTLIB) simulated transients only; not a statement about real transient
      offsets.
  ou2024_hostlib_mass_sfr_type_correlations:
    claim: The HOSTLIB carries stellar mass and SFR which SNANA uses for transient-host correlations (e.g.
      core-collapse SNe only in star-forming galaxies); host choice in the truth is a galaxy-property-weighted
      draw, not uniform.
    created_at: '2026-10-26T20:04:08Z'
    evidence:
    - id: ev1
      doi: 10.48550/arXiv.2501.05632
      quote:
        exact: The HOSTLIB also includes estimates of stellar mass and star formation rate, which are used
          to model transient-host correlations such as core collapse SNe being found only in star forming
          galaxies.
        prefix: with a weight proportional to the local surface brightness.
        suffix: 3.2.3 Rebinning to reduce SED output size
      location:
        page: 11
  ou2024_host_correlation_known_issue:
    claim: 'Known issue: host-transient correlations in OpenUniverse2024 were modelled incorrectly, giving
      hosts an average stellar mass about 1 dex too low. A cosmology propagation built on OU2024 truth hosts
      inherits a host population biased toward faint, low-mass galaxies, which likely inflates mis-association
      rates relative to a realistic host population.'
    created_at: '2026-10-26T20:04:08Z'
    evidence:
    - id: ev1
      doi: 10.48550/arXiv.2501.05632
      quote:
        exact: Host-transient correlations were also incorrectly modeled, resulting in an average stellar
          mass about 1 dex too low.
        prefix: without host extinction corrections.
        suffix: Thus the Poisson noise contribution from the host is underestimated.
      location:
        page: 11
    scope: Caveat on OpenUniverse2024 host truth; applies to any analysis using its host population.
  ou2024_galaxy_model_bulge_disk_knots:
    claim: Simulated galaxies are composite bulge + disk + star-forming-knot models with sizes and ellipticities
      inherited from the cosmoDC2 models; a bulge+disk or free-n Sersic fit is the natural light model,
      and a pure exponential would miss the bulge component.
    created_at: '2026-10-26T20:04:08Z'
    evidence:
    - id: ev1
      doi: 10.48550/arXiv.2501.05632
      quote:
        exact: Galaxies are built from a composite morphological model consisting of a bulge, disk, and
          star-forming knot regions.
        prefix: image scene photon-by-photon.
        suffix: The SED
      location:
        page: 3
    - id: ev2
      doi: 10.48550/arXiv.2501.05632
      quote:
        exact: Briefly, the model for the scaling relations used for galaxy size was calibrated against
          Zhang & Yang (2019);
        prefix: we use the same models implemented in Korytov et al. (2019) for cosmoDC2.
        suffix: the models for black hole mass and accretion rate were calibrated
      location:
        page: 6
    - id: ev3
      doi: 10.48550/arXiv.2501.05632
      quote:
        exact: and the model for ellipticity was calibrated against Joachimi et al. (2013). We refer the
          reader to the cosmoDC2 paper for details.
        prefix: Kormendy & Ho (2013) and Aird et al. (2018), respectively;
        suffix: Within the smooth disk profile, we model a random set of star-forming
      location:
        page: 6
  ou2024_skycatalog_galaxy_truth_columns:
    claim: The SkyCatalog galaxy parquet truth tables give per-galaxy bulge and disk half-light radii in
      arcsec, per-component ellipticities, stellar mass, and redshift with and without peculiar velocity;
      the truth host light profile and true redshift are directly available for every candidate host without
      fitting.
    created_at: '2026-10-26T20:04:08Z'
    evidence:
    - id: ev1
      doi: 10.48550/arXiv.2501.05632
      quote:
        exact: spheroidHalfLightRadiusArcsec
        prefix: Convergence (𝜅) experienced by object.
        suffix: float32 arcsec Bulge component half-light radius.
      location:
        page: 24
    - id: ev2
      doi: 10.48550/arXiv.2501.05632
      quote:
        exact: Object redshift (inc. peculiar velocity).
        prefix: redshift float64 –
        suffix: redshiftHubble float64 – Object redshift (w/o peculiar velocity).
      location:
        page: 24
  ou2024_sne_truth_table_host_id_and_separation:
    claim: The SkyCatalog SNe truth table records for each transient the true host_id, host position and
      magnitudes, z_CMB and host_sn_sep (angular separation in arcsec). The truth host link is the generative
      one from SNANA, not a DLR match; the paper describes no post-hoc host-association product. host_sn_sep
      gives the true offset distribution directly, which bounds the search radius needed.
    created_at: '2026-10-26T20:04:08Z'
    evidence:
    - id: ev1
      doi: 10.48550/arXiv.2501.05632
      quote:
        exact: Table A4. Contents of the SkyCatalog SNe parquet tables.
        prefix: OpenUniverse2024 25
        suffix: Column name Datatype Units Description
      location:
        page: 25
    - id: ev2
      doi: 10.48550/arXiv.2501.05632
      quote:
        exact: host_sn_sep
        prefix: host_mag_F float32 – Host magnitude.
        suffix: float32 arcsec Separation from host.
      location:
        page: 25
  ou2024_truth_and_pipeline_catalog_products:
    claim: Truth for the suite lives in SkyCatalog Parquet/HDF5 files, while the LSST imaging was run through
      the LSST Science Pipelines producing coadd object catalogs and DIA object catalogs; a pipeline-side
      host association must be built by matching these object catalogs to the SkyCatalog truth.
    created_at: '2026-10-26T20:04:08Z'
    evidence:
    - id: ev1
      doi: 10.48550/arXiv.2501.05632
      quote:
        exact: The truth information for the simulation suite is provided primarily in the form of a SkyCatalog.
          This is a set of compact Parquet and HDF5 files that contain all information about objects necessary
          to reproduce the simulated images.
        prefix: 6.1 SkyCatalog truth tables
        suffix: The files are intended to be interacted with via the SkyCatalogs Python module.
      location:
        page: 17
    - id: ev2
      doi: 10.48550/arXiv.2501.05632
      quote:
        exact: Source detection, measurement, object association and forced photometry are then performed
          to generate the DIA object catalogs.
        prefix: difference images are created for each visit.
        suffix: 6.3 Roman image processing and catalogs
      location:
        page: 17
  dc2_sn_position_sampled_from_sersic_profile:
    claim: In DC2 a hosted SN Ia is assigned to the bulge or disk with probability proportional to that
      component's stellar mass, and its position is drawn from the surface-brightness profile of that component
      (pure Sersic n = 1 disk or n = 4 bulge). DC2 truth therefore places SNe exactly according to the host
      light profile; an exponential-only SBW model is exact for disk-hosted SNe but mis-specified for bulge-hosted
      ones.
    created_at: '2026-10-26T20:04:08Z'
    evidence:
    - id: ev1
      doi: 10.48550/arXiv.2010.05926
      quote:
        exact: we first assigned the SN to one of the components randomly, assuming that the probability
          of a component hosting it was proportional to its stellar mass. Then, finally, we assigned a position
          by sampling the surface brightness profile of the hosting component (which in the cosmoDC2 catalog
          was by definition sersic and only had a sersic index of 1 or 4)
        prefix: Since cosmoDC2 galaxies have bulges, disks, or both,
        suffix: This prescription results in angular distance of the hosted SNe Ia
      location:
        page: 16
    scope: DC2/DP0.2 simulated SNe Ia only; real SN populations need not follow the host light exactly.
  dc2_sn_offsets_scale_with_hosting_component_size:
    claim: DC2 validated its SN-host offsets in units of the half-light size (semi-major or semi-minor axis)
      of the component that hosts the SN, separately for disk- and bulge-hosted SNe, and describes no
      truncation of the sampled Sersic profile. Offsets in units of the hosting component's R_e are therefore the
