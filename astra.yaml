  ou2024_lsst_exposures_15s_shallower:
    claim: OpenUniverse2024 LSST exposures were simulated at 15 s instead of the intended 30 s, halving the
      effective WFD exposure time (about 0.37 mag shallower per visit); the coadds are the first five years
      of WFD. Hosts are detected, deblended and classified on shallower coadds than a real five-year WFD, which
      adds to the faint-host regime.
    created_at: '2026-10-27T21:00:00Z'
    evidence:
    - id: ev1
      doi: 10.48550/arXiv.2501.05632
      quote:
