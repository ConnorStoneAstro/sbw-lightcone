      resources: {cpus: 16, memory: 56Gi}
  - id: dp02_offset_diagnostic
    type: figure
    format: pdf
    description: >-
      SBW top host wrong, DLR host wrong or none, both wrong on the same object,
      and SBW hostless fractions versus the SN's offset from its truth host in
      units of the host's truth half-light semi-major axis, measured along the
      truth ellipse, for the bulge R_e, the disk R_e and the dominant
      component's R_e, split into bulge-dominated (B/T_i > 0.5) and
